  function drawDecor(ctx, st, t, P) {
    const placed = (Game.get().decor) || [];
    if (!placed.length) return;
    const sc = Game.get().scene || {};
    const room = sc.env === 'room';
    const night = P && P.night;
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    placed.forEach(key => {
      const fn = DECOR_DRAW[key]; if (!fn) return;
      const isRoom = key.indexOf('decor:room_') === 0;
      if (room !== isRoom) return;
      fn(ctx, st, rc, night, t);
    });
  }

  function resolveSeason(mode) {
    if (mode && mode !== 'auto') return mode;
    const m = new Date().getMonth() + 1;
    if (m === 12 || m <= 2) return 'winter';
    if (m <= 5) return 'spring';
    if (m <= 8) return 'summer';
    return 'autumn';
  }
  function resolveHoliday() {
    const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    if ((m === 12 && day >= 15) || (m === 1 && day <= 7)) return 'newyear';
    if (m === 10 && day >= 25) return 'halloween';
    return null;
  }

  function ensureSeasonPool(st, kind) {
    if (st._season && st._seasonKind === kind && st._seasonW === st.W) return;
    st._seasonKind = kind; st._seasonW = st.W;
    if (kind === 'summer') { st._season = summerPool(st); return; }
    const nearN = kind === 'winter' ? 16 : 12;
    const farN = kind === 'winter' ? 20 : 12;
    const mk = (layer) => ({
      x: Math.random() * st.W,
      y: Math.random() * st.groundY,
      vy: (layer === 'near' ? 0.5 : 0.22) + Math.random() * (layer === 'near' ? 0.5 : 0.2),
      amp: 4 + Math.random() * 7,
      ph: Math.random() * 6.28,
      spin: Math.random() * 6.28,
      spd: 0.04 + Math.random() * 0.06,
      cidx: Math.floor(Math.random() * 5),
      layer,
    });
    st._season = [
      ...Array.from({ length: farN }, () => mk('far')),
      ...Array.from({ length: nearN }, () => mk('near')),
    ];
  }
  function summerPool(st) {
    return Array.from({ length: 14 }, () => ({
      x: Math.random() * st.W, y: Math.random() * st.groundY,
      vy: 0.12 + Math.random() * 0.18, amp: 6 + Math.random() * 8, ph: Math.random() * 6.28,
      spin: Math.random() * 6.28, spd: 0.03, cidx: 0, layer: Math.random() < 0.5 ? 'far' : 'near',
    }));
  }

  // декор на земле (за персонажем): цветы / опавшие листья / снег
  function drawGroundDecor(ctx, st, season) {
    const gy = st.groundY, W = st.W;
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    const rnd = (x) => ((Math.sin(x * 12.9898) * 43758.5453) % 1 + 1) % 1;
    if (season === 'spring' || season === 'summer') {
      const pals = season === 'spring'
        ? [['#f28ab5', '#ffd24a'], ['#e86ea6', '#ffe08a'], ['#c58ee0', '#ffd24a'], ['#ff9ec2', '#fff2b0']]
        : [['#ffffff', '#ffd24a'], ['#ffe08a', '#e0902f'], ['#f5f0e0', '#ffd24a'], ['#ffd0e0', '#ffd24a']];
      for (let x = 8; x < W - 4; x += 16) {
        const r = rnd(x); if (r < 0.35) continue;
        const px = x + Math.floor(r * 8), py = gy + 2 + Math.floor(rnd(x + 1) * 3);
        const [pc, cc] = pals[Math.floor(rnd(x + 2) * pals.length)];
        rc(px, py - 1, 1, 3, '#4d8a46');                 // стебель
        rc(px - 1, py - 2, 1, 1, pc); rc(px + 1, py - 2, 1, 1, pc);
        rc(px, py - 3, 1, 1, pc); rc(px, py - 1, 1, 1, pc);
        rc(px, py - 2, 1, 1, cc);                         // серединка
      }
    } else if (season === 'autumn') {
      const cols = ['#d9863f', '#c85a3a', '#e0a83f', '#a5642f'];
      for (let x = 6; x < W - 4; x += 13) {
        const r = rnd(x); if (r < 0.3) continue;
        const px = x + Math.floor(r * 6), py = gy + 2 + Math.floor(rnd(x + 3) * 3);
        const c = cols[Math.floor(rnd(x + 5) * cols.length)];
        rc(px, py, 2, 1, c); rc(px + (r < 0.6 ? 1 : 0), py + 1, 1, 1, shade(c, -20));
      }
    } else if (season === 'winter') {
      // земля уже снежная в базовой сцене — оверлей добавляет только лёгкий блеск
      const rnd2 = (x) => ((Math.sin(x * 91.7) * 4331.1) % 1 + 1) % 1;
      for (let x = 6; x < W; x += 20) { if (rnd2(x) < 0.5) rc(x, gy + 2 + Math.floor(rnd2(x + 1) * 3), 1, 1, 'rgba(255,255,255,0.9)'); }
    }
  }

  function drawSeasonOverlay(ctx, st, t, season) {
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    drawGroundDecor(ctx, st, season);
    ensureSeasonPool(st, season);

    const SPRING = ['#f5b9d0', '#f0a6c4', '#ffd0e2', '#e88ac0', '#ffc2da'];
    const AUTUMN = ['#d9863f', '#c85a3a', '#e0a83f', '#a5642f', '#c0492f'];

    st._season.forEach(p => {
      p.y += p.vy; p.ph += 0.04; p.spin += p.spd;
      p.x += Math.sin(p.ph) * 0.35;
      if (p.y > st.groundY - 1) { p.y = -3; p.x = Math.random() * st.W; }
      const sx = Math.round(p.x + Math.sin(p.ph) * (season === 'autumn' ? 3 : 1.5));
      const sy = Math.round(p.y);
      const near = p.layer === 'near';
      const flip = Math.sin(p.spin) > 0;

      if (season === 'winter') {
        const a = near ? 0.95 : 0.6;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        if (near) { rc(sx, sy, 2, 2, `rgba(255,255,255,${a})`); rc(sx, sy - 1, 1, 1, `rgba(230,240,255,${a})`); }
        else rc(sx, sy, 1, 1, `rgba(255,255,255,${a})`);
      } else if (season === 'spring') {
        const c = SPRING[p.cidx];
        if (near) { // лепесток
          if (flip) { rc(sx, sy, 2, 1, c); rc(sx + 1, sy + 1, 1, 1, shade(c, -12)); }
          else { rc(sx, sy, 1, 2, c); rc(sx + 1, sy, 1, 1, shade(c, -12)); }
        } else rc(sx, sy, 1, 1, c);
      } else if (season === 'autumn') {
        const c = AUTUMN[p.cidx];
        if (near) { // лист с прожилкой
          if (flip) { rc(sx, sy, 2, 2, c); rc(sx + 2, sy + 1, 1, 1, c); rc(sx + 1, sy, 1, 2, shade(c, -22)); }
          else { rc(sx, sy, 2, 2, c); rc(sx - 1, sy, 1, 1, c); rc(sx, sy, 1, 2, shade(c, -22)); }
        } else rc(sx, sy, 1, 1, c);
      } else { // summer — пушинки одуванчика
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        rc(sx, sy, 1, 1, 'rgba(255,255,255,0.75)');
        if (near) { rc(sx - 1, sy, 1, 1, 'rgba(255,255,255,0.35)'); rc(sx + 1, sy, 1, 1, 'rgba(255,255,255,0.35)'); rc(sx, sy - 1, 1, 1, 'rgba(255,255,255,0.35)'); rc(sx, sy + 1, 1, 1, 'rgba(255,255,255,0.35)'); }
      }
    });
  }

  function drawHolidayProp(ctx, st, t) {
    const hol = resolveHoliday(); if (!hol) return;
    const gy = st.groundY, x = Math.round(st.W * 0.3);
    if (hol === 'newyear') {
      // маленькая наряженная ёлка
      ctx.fillStyle = '#6b4a2f'; ctx.fillRect(x - 1, gy - 3, 3, 3);
      ctx.fillStyle = '#2f6a3f';
      ctx.fillRect(x - 6, gy - 9, 13, 4); ctx.fillRect(x - 4, gy - 13, 9, 4); ctx.fillRect(x - 2, gy - 16, 5, 4);
      const baub = ['#e0524a', '#f6c453', '#5b8fd0'];
      for (let i = 0; i < 4; i++) { const tw = 0.5 + Math.abs(Math.sin(t / 20 + i)) * 0.5; ctx.fillStyle = baub[i % 3]; ctx.globalAlpha = tw; ctx.fillRect(x - 4 + i * 2, gy - 8 - (i % 2) * 3, 1, 1); ctx.globalAlpha = 1; }
      ctx.fillStyle = '#ffe08a'; ctx.fillRect(x, gy - 17, 1, 1);
    } else if (hol === 'halloween') {
      ctx.fillStyle = '#8a5a2f'; ctx.fillRect(x, gy - 6, 1, 2); // стебель
      ctx.fillStyle = '#e07a2f'; ctx.fillRect(x - 4, gy - 5, 9, 5); ctx.fillRect(x - 3, gy - 6, 7, 1);
      ctx.fillStyle = '#3a2418'; ctx.fillRect(x - 2, gy - 4, 1, 1); ctx.fillRect(x + 1, gy - 4, 1, 1); ctx.fillRect(x - 1, gy - 2, 3, 1);
    }
  }

  function ensureStars(st) {
    if (st._stars && st._starsW === st.W) return;
    st._starsW = st.W;
    st._stars = Array.from({ length: 26 }, () => ({
      x: Math.random() * st.W, y: Math.random() * st.groundY * 0.8, ph: Math.random() * 6,
    }));
  }

  function drawCelestial(ctx, st, t, P, cx, cy) {
    if (P.night) {
      // луна
      ctx.fillStyle = 'rgba(240,245,255,0.35)'; ctx.fillRect(cx - 3, cy - 3, 20, 20);
      ctx.fillStyle = P.celest; ctx.fillRect(cx, cy, 14, 14);
      ctx.fillStyle = 'rgba(200,210,235,0.6)'; ctx.fillRect(cx + 9, cy + 2, 4, 4); ctx.fillRect(cx + 4, cy + 8, 3, 3);
    } else {
      const glow = 0.45 + Math.sin(t / 60) * 0.1;
      ctx.fillStyle = `rgba(255,240,190,${glow})`; ctx.fillRect(cx - 4, cy - 4, 24, 24);
      ctx.fillStyle = P.celest; ctx.fillRect(cx, cy, 15, 15);
    }
  }

  // цвета земли и листвы под текущий сезон
  function seasonColors(P, season) {
    const night = P.night;
    if (season === 'winter') return {
      grass: night ? '#6a7686' : '#eaf1f6', grassD: night ? '#586472' : '#d6dfe8', grassL: night ? '#7a8696' : '#f8fcff',
      hill: night ? '#5a6676' : '#dbe6ee', canopy: night ? '#8794a3' : '#e6eef4', canopyD: night ? '#6f7c8b' : '#cfdae4',
      canopyL: night ? '#98a5b4' : '#f8fcff', trunk: night ? '#4a4038' : '#6b5040', snow: true,
    };
    if (season === 'autumn') return {
      grass: night ? shade(P.grass, -4) : shade(P.grass, 8), grassD: shade(P.grassD, -4), grassL: shade(P.grass, 16),
      hill: shade(P.hill, 4), canopy: night ? '#a5652f' : '#d9863f', canopyD: night ? '#834f26' : '#b5652f',
      canopyL: night ? '#c07a3a' : '#e8b45a', trunk: '#7a5334', snow: false,
    };
    if (season === 'spring') return {
      grass: P.grass, grassD: P.grassD, grassL: shade(P.grass, 16), hill: P.hill,
      canopy: night ? '#5f9e58' : '#8fce78', canopyD: night ? '#4a7d46' : '#6cb85c', canopyL: night ? '#78b870' : '#b6e69a',
      trunk: '#7a5334', snow: false,
    };
    return { // лето / по умолчанию
      grass: P.grass, grassD: P.grassD, grassL: shade(P.grass, 12), hill: P.hill,
      canopy: night ? '#3f7a48' : '#5aa055', canopyD: night ? '#2f5e38' : '#4d8a46', canopyL: night ? '#569a5e' : '#6cb85c',
      trunk: '#7a5334', snow: false,
    };
  }

  function drawMeadow(ctx, st, t, P, tod) {
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    const season = resolveSeason((Game.get().scene || {}).season);
    const SC = seasonColors(P, season);
    const W = st.W, gy = st.groundY;

    // небо
    const bh = gy / P.sky.length;
    P.sky.forEach((c, i) => rc(0, Math.floor(i * bh), W, Math.ceil(bh) + 1, c));
    if (season === 'winter' && !P.night) { ctx.fillStyle = 'rgba(205,220,238,0.12)'; ctx.fillRect(0, 0, W, gy); }
    drawCelestial(ctx, st, t, P, W - 34, 12);
    if (P.night) { ensureStars(st); st._stars.forEach(s => { s.ph += 0.04; const a = 0.4 + Math.abs(Math.sin(s.ph)) * 0.6; rc(s.x, s.y, 1, 1, `rgba(255,255,255,${a})`); }); }
    else st.clouds.forEach(cl => { cl.x += cl.sp; if (cl.x > W + 20) cl.x = -20; drawCloud(ctx, Math.round(cl.x), Math.round(cl.y), cl.s); });

    // холмы (два слоя для глубины)
    const hy = gy - 10;
    rc(0, hy - 2, W, 12, shade(SC.hill, -6));
    ctx.fillStyle = SC.hill;
    for (let x = 0; x < W; x += 24) { const hh = 8 + ((x / 24) % 2) * 4; ctx.fillRect(x, hy - hh + 10, 24, hh); }
    rc(0, hy + 4, W, 6, SC.grassD);

    // земля
    rc(0, gy, W, st.H - gy, SC.grass);
    rc(0, gy, W, 3, SC.grassL);
    rc(0, st.H - 6, W, 6, SC.grassD);

    if (season === 'winter') {
      for (let x = 0; x < W; x += 22) { const hgt = 2 + ((x * 7) % 3); rc(x + 4, gy - hgt, 12, hgt, SC.grassL); }
      for (let i = 0; i < 10; i++) { const sx = (i * 17 + 5) % W; const sy = gy + 4 + ((i * 11) % Math.max(1, st.H - gy - 6)); if ((t + i * 9) % 120 < 60) rc(sx, sy, 1, 1, 'rgba(255,255,255,0.9)'); }
      for (let i = 0; i < 5; i++) { const gx = (i * 33 + 10) % W; rc(gx, gy - 2, 1, 2, '#b8a98f'); } // сухие травинки
    } else {
      for (let i = 0; i < 16; i++) { const gx = (i * 8 + 4) % W; const sway = Math.round(Math.sin(t / 40 + i)); rc(gx + sway, gy - 3, 1, 3, SC.grassD); rc(gx + sway, gy - 3, 1, 1, SC.grassL); rc(gx + 3 - sway, gy - 2, 1, 2, shade(SC.grass, -8)); }
      if (season === 'spring') { const pc = ['#f28ab5', '#ffd24a', '#c58ee0']; for (let i = 0; i < 5; i++) { const fx = (i * 29 + 12) % W; const fy = gy + 3 + ((i * 7) % 4); rc(fx, fy - 1, 1, 3, SC.grassD); const c = pc[i % 3]; rc(fx - 1, fy - 2, 1, 1, c); rc(fx + 1, fy - 2, 1, 1, c); rc(fx, fy - 3, 1, 1, c); rc(fx, fy - 2, 1, 1, '#ffd24a'); } }
      rc(W * 0.22, gy + 6, 3, 2, '#9a9088'); rc(W * 0.7, gy + 9, 4, 2, '#8f857c'); // камешки
    }

    // частицы / светлячки
    st.motes.forEach(m => {
      m.x += m.sp; m.ph += 0.05; if (m.x > W) m.x = 0; const fy = m.y + Math.sin(m.ph) * 3;
      if (P.night) { const a = 0.3 + Math.abs(Math.sin(m.ph)) * 0.7; rc(Math.round(m.x), Math.round(fy), 1, 1, `rgba(255,235,140,${a})`); }
      else if (season !== 'winter') { ctx.fillStyle = P.mote; ctx.fillRect(Math.round(m.x), Math.round(fy), 1, 1); }
    });

    // бабочка (тёплый сезон)
    if (!P.night && tod !== 'sunset' && (season === 'spring' || season === 'summer')) {
      st.butterflies.forEach(b => {
        b.t += 0.02; b.x = W * 0.5 + Math.sin(b.t) * W * 0.35; b.y = gy - 34 + Math.cos(b.t * 1.6) * 12;
        const flap = Math.sin(t / 4) > 0; ctx.fillStyle = '#e88ac0';
        if (flap) { ctx.fillRect(b.x - 2, b.y, 2, 2); ctx.fillRect(b.x + 1, b.y, 2, 2); }
        else { ctx.fillRect(b.x - 1, b.y, 1, 2); ctx.fillRect(b.x + 1, b.y, 1, 2); }
        ctx.fillStyle = '#2a2018'; ctx.fillRect(b.x, b.y, 1, 2);
      });
    }
  }

  const ROOM_THEMES = {
    peach:    { wall: ['#f3cfac', '#eec09a', '#e6b48c'], nwall: ['#5a4a63', '#514257', '#48394d'], floor: '#c78b54', nfloor: '#5a4634', base: '#c98f63', nbase: '#3f3348', curt: ['#e79aa2', '#d97f89'], ncurt: ['#b06a72', '#96545d'] },
    mint:     { wall: ['#d2e8d8', '#c2e0c8', '#b2d6b8'], nwall: ['#3f4f52', '#37464a', '#2f3d40'], floor: '#a6b184', nfloor: '#4a5440', base: '#9aa878', nbase: '#333f30', curt: ['#a8d8c0', '#8fc7a8'], ncurt: ['#6f9580', '#577060'] },
    lavender: { wall: ['#e0d3ee', '#d2c3e6', '#c4b1dd'], nwall: ['#453a56', '#3c3350', '#332c48'], floor: '#ad96b4', nfloor: '#4a3f52', base: '#9c86a8', nbase: '#382f40', curt: ['#c4aada', '#ab8fc9'], ncurt: ['#8a6f9c', '#6a5478'] },
    forest:   { wall: ['#dbe2c2', '#cbd8aa', '#bbcc94'], nwall: ['#3a4536', '#323c30', '#2b342a'], floor: '#93a06c', nfloor: '#414a34', base: '#86935e', nbase: '#2f3a2a', curt: ['#b0c890', '#98b078'], ncurt: ['#6a8560', '#4f6448'] },
    rose:     { wall: ['#f3d1d7', '#edc1c9', '#e7b1bb'], nwall: ['#5a4550', '#513c48', '#483340'], floor: '#c68a94', nfloor: '#5a4048', base: '#c07f8a', nbase: '#40303a', curt: ['#e79ab0', '#d97f96'], ncurt: ['#a86f82', '#7a5460'] },
  };

  function drawRoom(ctx, st, t, P, tod) {
    const W = st.W, H = st.H, floorY = st.groundY;
    const night = P.night;
    const TH = ROOM_THEMES[(Game.get().scene || {}).roomTheme] || ROOM_THEMES.peach;
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

    // ----- СТЕНА -----
    const wall = night ? TH.nwall : TH.wall;
    const wbh = floorY / wall.length;
    wall.forEach((c, i) => rc(0, i * wbh, W, wbh + 1, c));
    // мягкое пятно света в центре
    ctx.fillStyle = night ? 'rgba(255,220,180,0.05)' : 'rgba(255,240,210,0.14)';
    ctx.fillRect(W * 0.5 - 34, 0, 68, floorY);

    // ----- ПОЛ -----
    const floorC = night ? TH.nfloor : TH.floor, floorD = shade(floorC, -16), floorL = shade(floorC, 14);
    rc(0, floorY, W, H - floorY, floorC);
    rc(0, floorY, W, 2, floorL);
    ctx.fillStyle = floorD;
    for (let x = 0; x < W; x += 18) ctx.fillRect(Math.round(x), floorY + 2, 1, H - floorY);
    // плинтус
    const base = night ? TH.nbase : TH.base;
    rc(0, floorY - 4, W, 4, base);
    rc(0, floorY - 4, W, 1, shade(base, 20));

    // ----- ОКНО (по центру сверху) -----
    const ww = Math.min(58, Math.round(W * 0.42)), wh = Math.min(46, Math.round(floorY * 0.62));
    const wx = Math.round(W / 2 - ww / 2), wy = 10;
    // рама
    rc(wx - 4, wy - 4, ww + 8, wh + 8, '#7a5334');
    rc(wx - 4, wy - 4, ww + 8, 2, '#9a6f45');
    // небо в окне
    const sbh = wh / P.sky.length;
    P.sky.forEach((c, i) => rc(wx, wy + i * sbh, ww, sbh + 1, c));
    // луна/солнце + звёзды
    drawCelestial(ctx, st, t, P, wx + ww - 20, wy + 5);
    if (night) {
      const stars = [[8, 10], [18, 6], [26, 16], [36, 9], [44, 20], [14, 24], [50, 12], [30, 28]];
      stars.forEach(([sxp, syp], i) => {
        if (sxp < ww - 2 && syp < wh - 2) {
          const a = 0.4 + Math.abs(Math.sin(t / 30 + i)) * 0.6;
          rc(wx + sxp, wy + syp, 1, 1, `rgba(255,255,255,${a})`);
        }
      });
    } else {
      // облачко
      rc(wx + 8, wy + 10, 14, 4, 'rgba(255,255,255,0.85)'); rc(wx + 11, wy + 7, 8, 3, 'rgba(255,255,255,0.85)');
    }
    // перекладины рамы
    rc(wx + ww / 2 - 1, wy, 2, wh, '#7a5334');
    rc(wx, wy + wh / 2 - 1, ww, 2, '#7a5334');
    rc(wx - 1, wy - 1, ww + 2, 1, '#8a6040');

    // ----- СЕЗОН ЗА ОКНОМ -----
    const rseason = resolveSeason((Game.get().scene || {}).season);
    if (rseason === 'winter') {
      for (let i = 0; i < 7; i++) { const px = wx + ((i * 13 + t * 0.4) % ww); const py = wy + ((i * 9 + t * 0.6) % wh); rc(Math.round(px), Math.round(py), 1, 1, 'rgba(255,255,255,0.9)'); }
      rc(wx, wy + wh - 2, ww, 2, '#eef4fa'); // снег на подоконнике
      rc(wx, wy, 3, 3, 'rgba(230,240,250,0.5)'); rc(wx + ww - 3, wy, 3, 3, 'rgba(230,240,250,0.5)'); // иней в углах
    } else if (rseason === 'autumn') {
      for (let i = 0; i < 4; i++) { const px = wx + ((i * 17 + t * 0.5) % ww); const py = wy + ((i * 11 + t * 0.7) % wh); rc(Math.round(px), Math.round(py), 1, 1, i % 2 ? '#d9863f' : '#c85a3a'); }
    } else if (rseason === 'spring') {
      for (let i = 0; i < 4; i++) { const px = wx + ((i * 15 + t * 0.4) % ww); const py = wy + ((i * 13 + t * 0.6) % wh); rc(Math.round(px), Math.round(py), 1, 1, '#f7b8d4'); }
    }

    // ----- ГИРЛЯНДА (тёплые огоньки над окном) -----
    const lights = Math.floor(ww / 6) + 2;
    for (let i = 0; i <= lights; i++) {
      const lx = wx - 2 + (i / lights) * (ww + 4);
      const ly = wy - 3 + Math.sin(i * 0.9) * 2 + Math.sin(i) * 1;
      rc(lx, ly - 2, 1, 2, '#7a6a4a'); // проводок
      const tw = 0.55 + Math.abs(Math.sin(t / 22 + i * 1.3)) * 0.45;
      rc(lx - 0.5, ly, 2, 2, `rgba(255,208,120,${tw})`);
      ctx.fillStyle = `rgba(255,180,90,${tw * 0.4})`; ctx.fillRect(Math.round(lx - 1), Math.round(ly - 1), 4, 4);
    }

    // ----- ШТОРЫ (по бокам окна) -----
    const curt = night ? TH.ncurt : TH.curt;
    function curtain(cxx, dir) {
      for (let f = 0; f < 3; f++) {
        const fx = cxx + dir * f * 4;
        rc(fx, wy - 4, 4, wh + 8, curt[f % 2]);
        rc(fx, wy - 4, 1, wh + 8, shade(curt[f % 2], -18));
      }
      // подхват
      rc(cxx - (dir < 0 ? 6 : 0), wy + wh - 6, 12, 2, shade(curt[1], -25));
    }
    curtain(wx - 12, 1);
    curtain(wx + ww, 1);

    // ----- УЮТНОЕ ОСВЕЩЕНИЕ (тёплый свет, ярче ночью) -----
    ctx.fillStyle = night ? 'rgba(255,178,88,0.10)' : 'rgba(255,224,150,0.045)';
    ctx.fillRect(0, 0, W, floorY);
    ctx.fillStyle = night ? 'rgba(255,200,110,0.12)' : 'rgba(255,232,170,0.06)';
    ctx.fillRect(Math.round(W * 0.28), floorY, Math.round(W * 0.44), H - floorY); // тёплый пул на полу

    // ----- СТОЛ с ноутбуком (слева, если хватает места сбоку) -----
    const dx = Math.round(W * 0.14), dtopY = floorY - 26, dtopW = 46;
    const showDesk = dx + dtopW < W * 0.52;
    if (showDesk) {
      rc(dx, dtopY, dtopW, 4, '#b07a44');           // столешница
      rc(dx, dtopY, dtopW, 1, '#c89058');
      rc(dx, dtopY + 4, dtopW, 1, '#8a5c30');
      rc(dx + 3, dtopY + 4, 3, 22, '#96652f');      // ножки
      rc(dx + dtopW - 6, dtopY + 4, 3, 22, '#96652f');
      // ноутбук
      const nx = dx + 16;
      rc(nx, dtopY - 9, 15, 9, '#5a6b7a');          // экран
      rc(nx + 1, dtopY - 8, 13, 7, night ? '#9fd4e8' : '#bfe6f2'); // свечение экрана
      rc(nx + 2, dtopY - 7, 5, 2, '#e8f6ff');
      rc(nx - 1, dtopY - 1, 17, 2, '#7a8894');      // основание
      if (night) { ctx.fillStyle = 'rgba(160,220,240,0.25)'; ctx.fillRect(nx - 2, dtopY - 10, 19, 12); }
      // стопка книг
      rc(dx + dtopW - 12, dtopY - 6, 9, 2, '#d97f6a');
      rc(dx + dtopW - 11, dtopY - 8, 8, 2, '#7aa6d0');
      rc(dx + dtopW - 13, dtopY - 4, 10, 2, '#e0b45a');
      // горшок с растением
      rc(dx + 2, dtopY - 8, 6, 6, '#c07a4a');
      rc(dx + 1, dtopY - 12, 3, 5, '#4d8a46'); rc(dx + 4, dtopY - 14, 3, 6, '#5aa055'); rc(dx + 6, dtopY - 11, 3, 4, '#4d8a46');
    } else {
      // напольное растение слева
      const plx = Math.round(W * 0.12), ply = floorY - 2;
      rc(plx, ply - 8, 8, 8, '#c07a4a'); rc(plx, ply - 8, 8, 1, '#d68f5a');
      rc(plx + 1, ply - 16, 3, 9, '#4d8a46'); rc(plx - 2, ply - 12, 4, 5, '#5aa055'); rc(plx + 5, ply - 13, 4, 6, '#4d8a46'); rc(plx + 2, ply - 19, 3, 5, '#5aa055');
    }

    // ----- КАРТИНА / ПОЛКА (справа, если есть место) -----
    if (W > 130) {
      const px = Math.round(W * 0.8);
      rc(px, 18, 22, 16, '#7a5334');
      rc(px + 2, 20, 18, 12, night ? '#3a4a6a' : '#bfe0d8');
      rc(px + 2, 27, 18, 5, night ? '#2f5a3f' : '#8fc27a');
      rc(px + 14, 22, 3, 3, night ? '#eaf0ff' : '#f6c453');
    }

    // ----- КОВЁР (под персонажем) -----
    const rugC = night ? '#8a5560' : '#e79aa2', rugC2 = night ? '#6f4650' : '#d97f89';
    const rw = Math.min(70, Math.round(W * 0.5));
    for (let i = 0; i < 4; i++) {
      const iw = rw - i * 10, iy = floorY + 4 + i * 2;
      rc(W / 2 - iw / 2, iy, iw, 3, i % 2 ? rugC2 : rugC);
    }

    // ----- пылинки -----
    st.motes.forEach(m => {
      m.x += m.sp * 0.4; m.ph += 0.03; if (m.x > W) m.x = 0;
      const fy = m.y + Math.sin(m.ph) * 2;
      rc(Math.round(m.x), Math.round(fy), 1, 1, night ? 'rgba(255,225,150,0.5)' : 'rgba(255,255,240,0.55)');
    });
  }

  function drawPark(ctx, st, t, P, tod) {
    const W = st.W, H = st.H, gy = st.groundY, night = P.night;
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    const season = resolveSeason((Game.get().scene || {}).season);
    const SC = seasonColors(P, season);
    const winter = season === 'winter';

    // небо
    const bh = gy / P.sky.length;
    P.sky.forEach((c, i) => rc(0, i * bh, W, bh + 1, c));
    if (winter && !night) { ctx.fillStyle = 'rgba(205,220,238,0.12)'; ctx.fillRect(0, 0, W, gy); }
    drawCelestial(ctx, st, t, P, W - 34, 12);
    if (night) { ensureStars(st); st._stars.forEach(s => { s.ph += 0.04; const a = 0.4 + Math.abs(Math.sin(s.ph)) * 0.6; rc(s.x, s.y, 1, 1, `rgba(255,255,255,${a})`); }); }
    else st.clouds.forEach(cl => { cl.x += cl.sp; if (cl.x > W + 20) cl.x = -20; drawCloud(ctx, Math.round(cl.x), Math.round(cl.y), cl.s); });

    // птицы (кроме зимы — прохладно)
    if (!winter) {
      const birdCol = night ? 'rgba(230,235,255,0.7)' : 'rgba(60,50,45,0.7)';
      for (let i = 0; i < 3; i++) {
        const bx = ((t * 0.25 + i * 47) % (W + 20)) - 10;
        const by = 20 + i * 12 + Math.sin(t / 40 + i) * 3;
        const flap = Math.sin(t / 6 + i) > 0 ? 0 : 1;
        rc(bx, by, 2, 1, birdCol); rc(bx + 2, by - 1 + flap, 1, 1, birdCol); rc(bx - 1, by - 1 + flap, 1, 1, birdCol);
      }
    }

    // дальняя линия деревьев/кустов (сезонная)
    const far = winter ? SC.canopyD : shade(P.grass, night ? -22 : -8);
    for (let x = 0; x < W; x += 20) { rc(x, gy - 12, 16, 12, far); rc(x + 4, gy - 16, 10, 6, far); if (winter) rc(x + 2, gy - 17, 12, 2, SC.canopyL); }

    // земля
    rc(0, gy, W, H - gy, SC.grass);
    rc(0, gy, W, 3, SC.grassL);
    rc(0, H - 6, W, 6, SC.grassD);
    // дорожка вдоль горизонта
    const path = winter ? (night ? '#8892a0' : '#e6edf2') : (night ? '#5a5140' : '#d9c8a0');
    rc(0, gy + 4, W, 7, path); rc(0, gy + 4, W, 1, shade(path, 14)); rc(0, gy + 10, W, 1, shade(path, -18));

    // фоновые люди — приглушённые, неспешно идут
    const people = [['#6b6f86', 0.18, 8], ['#7a6a72', -0.13, 40], ['#5f7a70', 0.10, 70]];
    people.forEach(([col, sp, off], i) => {
      const px = (((t * sp + off) % (W + 24)) + (W + 24)) % (W + 24) - 12;
      const py = gy + 5; const bob = Math.sin(t / 12 + i) > 0 ? 0 : 1;
      ctx.globalAlpha = 0.5;
      rc(px, py - 8, 3, 5, col); rc(px, py - 11, 3, 3, shade(col, 12));
      rc(px, py - 3 + bob, 1, 2, col); rc(px + 2, py - 4 - bob + 1, 1, 2, col);
      ctx.globalAlpha = 1;
    });

    // деревья по краям (сезонная крона + снег зимой)
    function tree(x, s) {
      rc(x, gy - 10 * s, 4 * s, 12 * s, SC.trunk);
      rc(x - 6 * s, gy - 22 * s, 16 * s, 12 * s, SC.canopy);
      rc(x - 4 * s, gy - 26 * s, 12 * s, 6 * s, SC.canopy);
      rc(x - 6 * s, gy - 22 * s, 16 * s, 2 * s, SC.canopyL);
      rc(x - 6 * s, gy - 12 * s, 16 * s, 2 * s, SC.canopyD);
      if (winter) { // снежные шапки
        rc(x - 4 * s, gy - 27 * s, 12 * s, 2 * s, '#ffffff');
        rc(x - 6 * s, gy - 23 * s, 6 * s, 1.5 * s, '#ffffff'); rc(x + 2 * s, gy - 23 * s, 4 * s, 1.5 * s, '#ffffff');
      }
    }
    tree(W * 0.1, 1.1); tree(W * 0.9, 1.0);

    // лавочки (+ снег на сиденье/спинке зимой)
    function bench(cx) {
      const wood = '#9c6b3f', woodD = '#7a5230';
      rc(cx - 10, gy - 1, 20, 3, wood); rc(cx - 10, gy - 1, 20, 1, shade(wood, 14));
      rc(cx - 10, gy - 7, 20, 3, wood);
      rc(cx - 10, gy - 7, 2, 8, woodD); rc(cx + 8, gy - 7, 2, 8, woodD);
      rc(cx - 8, gy + 2, 2, 4, woodD); rc(cx + 6, gy + 2, 2, 4, woodD);
      if (winter) { rc(cx - 10, gy - 2, 20, 1, '#ffffff'); rc(cx - 10, gy - 8, 20, 1, '#ffffff'); }
    }
    bench(W * 0.2); bench(W * 0.8);

    // фонарь (+ снег на крыше)
    const lx = W * 0.66;
    rc(lx, gy - 30, 2, 30, '#3a3630');
    rc(lx - 3, gy - 36, 8, 7, '#3a3630');
    rc(lx - 2, gy - 35, 6, 5, night ? '#ffe08a' : '#cfe0dd');
    if (winter) rc(lx - 3, gy - 37, 8, 1, '#ffffff');
    if (night) { ctx.fillStyle = 'rgba(255,210,120,0.25)'; ctx.fillRect(Math.round(lx - 8), Math.round(gy - 42), 18, 18); }
  }

  /* --- причёски (T рисует клетками относительно головы) --- */
  function drawHair(T, hair, hairL, hairD, style) {
    const cap = () => { T(3.4, 1.3, 7.2, 1.8, hair); T(3.4, 1.3, 7.2, 0.5, hairL); };
    if (style === 'buzz') {
      T(3.6, 1.6, 6.8, 1.2, hair); T(3.6, 1.6, 6.8, 0.4, hairL);
      T(3.5, 2.2, 0.7, 1.3, hairD); T(10.3, 2.2, 0.7, 1.3, hairD);
    } else if (style === 'messy') {
      cap();
      T(3.7, 0.4, 1.2, 1.1, hair); T(5.3, 0.1, 1.2, 1.4, hair); T(6.9, 0.2, 1.2, 1.3, hair); T(8.6, 0.5, 1.2, 1.0, hair);
      T(3.3, 1.9, 0.9, 2.4, hair); T(10.2, 1.9, 0.9, 2.4, hair);
      T(4.0, 3.0, 1.4, 0.7, hair); T(8.6, 3.0, 1.4, 0.7, hair);
    } else if (style === 'messybob') {
      // объёмная шапка + растрёпанные пики
      T(3.3, 1.2, 7.4, 2.0, hair); T(3.3, 1.2, 7.4, 0.5, hairL);
      T(3.9, 0.3, 1.3, 1.2, hair); T(5.5, 0.1, 1.3, 1.4, hairL); T(7.1, 0.2, 1.3, 1.3, hair); T(8.7, 0.5, 1.2, 1.0, hair);
      // боковые пряди средней длины (до подбородка), с тенью и бликом
      T(3.0, 1.9, 1.4, 5.6, hair); T(10.0, 1.9, 1.4, 5.6, hair);
      T(3.0, 1.9, 0.5, 5.6, hairD); T(10.9, 1.9, 0.5, 5.6, hairD);
      T(3.2, 2.2, 0.7, 1.4, hairL); T(9.9, 2.4, 0.6, 1.1, hairL);
      // неровные кончики
      T(3.1, 7.2, 1.1, 0.8, hair); T(10.0, 7.2, 1.1, 0.8, hair);
      // чёлка на лоб (с просветом и бликами)
      T(3.9, 2.4, 2.3, 1.3, hair); T(7.8, 2.4, 2.3, 1.3, hair); T(6.0, 2.5, 1.6, 1.0, hair);
      T(4.3, 2.5, 0.9, 0.5, hairL); T(8.3, 2.5, 0.9, 0.5, hairL);
      T(6.3, 2.55, 0.8, 0.5, hairL);
    } else if (style === 'long') {
      T(3.4, 1.3, 7.2, 1.8, hair); T(3.4, 1.3, 7.2, 0.5, hairL);

  // ===== ОСОБЫЙ CHIBI-СКИН «ДЕВОЧКА» (своя рисовка: хвостики, большая голова) =====
  function drawChibiSkin(ctx, cx, feetY, u, look, o) {
    o = o || {};
    const tick = o.tick || 0, breath = o.breath || 0;
    const sleeping = o.arm === 'sleep', blink = o.blink || sleeping;
    const hair = look.hair || '#ecdcae';
    const hairL = shade(hair, 30), hairM = shade(hair, -12), hairD = shade(hair, -44);
    const skin = look.skin || '#f7e2cf', skinD = shade(skin, -20), skinE = shade(skin, -52);
    const dress = look.shirt || '#f6f2ea', dressD = shade(dress, -14), dressE = shade(dress, -32), dressL = shade(dress, 16);
    const sock = '#2a2630', sockL = '#433e4c', foot = '#1e1b24';
    const blush = '#f0a3a3', bow = '#f0a8c0', bowD = '#d67fa0';
    const eyeW = '#f4f0f8', iris = '#8f8aa6', pupil = '#2f2b3a';

    const GW = 14, ox = Math.round(cx - (GW * u) / 2), by = Math.round(feetY);
    const bob = breath ? 0.25 : 0;
    const px = (c, r, w, h, col) => {
      const y = r - bob;
      const x1 = Math.round(ox + c * u), x2 = Math.round(ox + (c + w) * u);
      const y1 = Math.round(by - (20 - y) * u), y2 = Math.round(by - (20 - (y + h)) * u);
      ctx.fillStyle = col; ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    };

    // тень
    ctx.fillStyle = 'rgba(40,60,30,0.18)';
    ctx.fillRect(Math.round(ox + 3.6 * u), Math.round(by - 0.4 * u), Math.round(6.8 * u), Math.round(0.9 * u));

    const sway = Math.sin(tick / 24);
    // ---- ХВОСТИКИ (за головой) ----
    function tail(sign) {
      const bx = 7 + sign * 5.0;
      const segs = [
        { r: 4.4, w: 2.8, h: 2.4, dx: 0 },
        { r: 6.5, w: 3.0, h: 2.6, dx: sign * 0.3 },
        { r: 8.9, w: 2.8, h: 2.6, dx: sign * 0.6 + sway * sign * 0.3 },
        { r: 11.3, w: 2.4, h: 2.6, dx: sign * 0.9 + sway * 0.6 },
        { r: 13.5, w: 2.0, h: 2.4, dx: sign * 1.1 + sway * 1.0 },
      ];
      segs.forEach(s => {
        const x = bx - s.w / 2 + s.dx;
        px(x, s.r, s.w, s.h, hairM);
        px(x, s.r, s.w, 0.55, hairL);
        px(sign < 0 ? x : x + s.w - 0.55, s.r, 0.55, s.h, hairD);
        px(x, s.r + s.h - 0.55, s.w, 0.55, hairD);
      });
      const t = segs[segs.length - 1];
      px(bx - 0.7 + t.dx, t.r + t.h - 0.3, 1.4, 0.9, hairD);
    }
    tail(-1); tail(1);

    // ---- НОГИ (чёрные носочки) ----
    px(5.7, 16.4, 1.15, 2.9, sock); px(7.15, 16.4, 1.15, 2.9, sock);
    px(5.7, 16.4, 1.15, 0.6, sockL); px(7.15, 16.4, 1.15, 0.6, sockL);
    px(5.55, 19.0, 1.5, 0.95, foot); px(7.0, 19.0, 1.5, 0.95, foot);

    // ---- ПЛАТЬЕ (маленькое, А-силуэт) ----
    px(5.4, 11.9, 3.2, 2.3, dress);
    px(4.5, 13.7, 5.0, 2.6, dress);
    px(4.2, 15.6, 5.6, 0.9, dress);
    px(5.4, 11.9, 3.2, 0.5, dressL);
    px(4.2, 15.9, 5.6, 0.55, dressE);
    px(5.4, 11.9, 0.5, 2.3, dressD); px(8.1, 11.9, 0.5, 2.3, dressD);
    px(4.5, 13.7, 0.5, 2.6, dressD); px(9.0, 13.7, 0.5, 2.6, dressD);
    // мягкие складки
    px(6.0, 14.0, 0.35, 1.9, dressD); px(7.0, 14.1, 0.35, 2.0, dressD); px(8.0, 14.0, 0.35, 1.9, dressD);
    // бретельки
    px(5.6, 11.2, 0.5, 0.9, dress); px(7.9, 11.2, 0.5, 0.9, dress);

    // ---- ГОЛОВА (большая, круглая) ----
    px(3.3, 4.6, 7.4, 6.6, skin);
    px(3.9, 3.8, 6.2, 0.9, skin);
    px(4.7, 3.3, 4.6, 0.6, skin);
    px(4.1, 11.0, 5.8, 0.7, skin);
    px(4.9, 11.6, 4.2, 0.5, skin);
    px(3.3, 4.6, 0.7, 6.6, skinD); px(10.0, 4.6, 0.7, 6.6, skinD);
    px(4.1, 11.2, 5.8, 0.5, skinD);
    // ушки
    px(3.0, 7.0, 0.6, 1.2, skin); px(10.4, 7.0, 0.6, 1.2, skinD);

    // ---- ЛИЦО ----
    if (blink) {
      px(4.5, 8.7, 1.7, 0.4, skinE); px(7.7, 8.7, 1.7, 0.4, skinE);
      px(4.6, 8.5, 1.5, 0.3, skinE); px(7.8, 8.5, 1.5, 0.3, skinE);
    } else {
      px(4.4, 7.6, 1.9, 2.1, eyeW); px(7.6, 7.6, 1.9, 2.1, eyeW);
      px(4.7, 7.8, 1.4, 1.7, iris); px(7.9, 7.8, 1.4, 1.7, iris);
      px(4.9, 8.0, 1.0, 1.3, pupil); px(8.1, 8.0, 1.0, 1.3, pupil);
      px(5.0, 8.15, 0.45, 0.6, 'rgba(255,255,255,0.92)'); px(8.2, 8.15, 0.45, 0.6, 'rgba(255,255,255,0.92)');
      px(4.4, 7.45, 1.9, 0.35, '#3a3340'); px(7.6, 7.45, 1.9, 0.35, '#3a3340'); // ресничная линия
    }
    // румянец
    ctx.globalAlpha = 0.6; px(3.9, 9.4, 1.3, 0.9, blush); px(8.8, 9.4, 1.3, 0.9, blush); ctx.globalAlpha = 1;
    // носик + ротик
    px(6.75, 9.3, 0.5, 0.4, skinD);
    px(6.5, 10.0, 1.0, 0.35, '#c98a8a'); px(6.7, 10.2, 0.6, 0.25, '#d99a9a');

    // ---- ЧЁЛКА / ПРЯДИ ----
    px(3.2, 3.4, 7.6, 2.4, hair); px(3.2, 3.4, 7.6, 0.6, hairL);
    px(3.0, 5.2, 1.5, 3.6, hairM); px(9.5, 5.2, 1.5, 3.6, hairM);   // боковые пряди у щёк
    px(3.0, 5.2, 0.5, 3.6, hairD); px(10.5, 5.2, 0.5, 3.6, hairD);
    px(3.9, 5.4, 2.3, 2.0, hair); px(7.8, 5.4, 2.3, 2.0, hair);      // чёлка
    px(5.9, 5.4, 2.2, 1.6, hair);
    px(6.85, 5.5, 0.3, 1.6, hairD);                                  // пробор
    px(4.3, 4.1, 0.9, 0.5, hairL); px(8.4, 4.2, 0.9, 0.5, hairL);    // блики
    px(5.6, 3.7, 1.0, 0.5, hairL);

    // ---- БАНТИКИ у основания хвостов ----
    function bowAt(bx) {
      px(bx - 1.05, 4.1, 0.95, 1.0, bow); px(bx + 0.1, 4.1, 0.95, 1.0, bow);
      px(bx - 0.25, 4.35, 0.5, 0.6, bowD);
      px(bx - 1.05, 4.1, 0.95, 0.3, shade(bow, 22)); px(bx + 0.1, 4.1, 0.95, 0.3, shade(bow, 22));
    }
    bowAt(2.0); bowAt(12.0);

    // ---- Zzz во сне ----
    if (sleeping) {
      const p = Math.floor(tick / 26) % 3;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      const zx = ox + 10.6 * u, zy = by - (18 - p) * u - p * 4;
      ctx.fillRect(Math.round(zx), Math.round(zy), Math.round(1.1 * u), Math.round(0.4 * u));
      ctx.fillRect(Math.round(zx), Math.round(zy + 0.9 * u), Math.round(1.1 * u), Math.round(0.4 * u));
    }
  }

  // ===== ОСОБЫЙ CHIBI-СКИН «АРИШЕНЬКА» (модный образ: блонд, платье, кроссовки, сумка) =====

  // feetY = y нижней точки ног; u = размер одной клетки персонажа в пикселях canvas
  function drawHero(ctx, cx, feetY, u, look, o) {

    o = o || {};
    const breath = o.breath || 0;
    const blink = !!o.blink;

    const arm = o.arm || 'idle';

    const skin = look.skin, hair = look.hair, shirt = look.shirt;
    const skinD = shade(skin, -26), skinL = shade(skin, 16);

    const shirtD = shade(shirt, -32), shirtL = shade(shirt, 24);

    const pants = female ? '#5a4a80' : '#3a4a6a', pantsD = shade(pants, -26);

    const shoe = '#2a1e14', shoeL = shade(shoe, 26);

    const ox = Math.round(cx - (GW * u) / 2) + shiver;

    // дробные клетки, но всегда чёткие целые пиксели

    px(4.6, 15.6, 1.7, 2.7, legCol); px(4.6, 15.6, 0.6, 2.7, legColD);

    if (sneakers) {

      T(6.85, 11.2, 0.3, 2.2, '#5a3020'); // корешок
      T(5.0, 11.9, 1.4, 0.25, '#c9b89a'); T(7.6, 11.9, 1.4, 0.25, '#c9b89a');

  function drawPet(ctx, x, groundY, u, pet, tick, level, mood) {
    if (pet === 'none' || !PET_FILL[pet]) return;
    level = level || 1;
    const GW = 18, GH = 14;
    const g = new Array(GW * GH).fill(null);
    const idx = (cx, cy) => cy * GW + cx;
    const s = (cx, cy, c) => { if (cx >= 0 && cx < GW && cy >= 0 && cy < GH && c) g[idx(cx, cy)] = c; };
    const r = (cx, cy, w, h, c) => { for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) s(cx + xx, cy + yy, c); };
    PET_FILL[pet](r, s);

    // контур
    const OL = '#3a2a22';
    const outline = [];
    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
      if (g[idx(cx, cy)]) continue;
      if ((cx > 0 && g[idx(cx - 1, cy)]) || (cx < GW - 1 && g[idx(cx + 1, cy)]) ||
          (cy > 0 && g[idx(cx, cy - 1)]) || (cy < GH - 1 && g[idx(cx, cy + 1)])) outline.push(cx + cy * GW);
    }
    outline.forEach(k => { g[k] = OL; });

    // границы содержимого
    let minX = GW, maxX = 0, minY = GH, maxY = 0;
    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) if (g[idx(cx, cy)]) {
      if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
    }
    const centerX = (minX + maxX + 1) / 2;
    const pu = Math.max(2, Math.round(u * 0.7 * (1 + (level - 1) * 0.22))); // заметный рост по стадиям
    const bob = (Math.floor(tick / 45) % 2 === 0) ? 0 : 1;
    const put = (cx, cy, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x + (cx - centerX) * pu), Math.round(groundY - (maxY - cy + 1) * pu) - bob, pu, pu); };

    // тень
    ctx.fillStyle = 'rgba(40,60,30,0.20)';
    ctx.fillRect(Math.round(x - (maxX - minX + 1) * pu * 0.35), Math.round(groundY - 1), Math.round((maxX - minX + 1) * pu * 0.7), Math.round(pu * 0.8));

    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
      const c = g[idx(cx, cy)]; if (c) put(cx, cy, c);
    }

    // аксессуар за развитие: бантик (ур.2), корона (ур.3)
    const topRow = minY - 1;
    const cx0 = Math.round(centerX);
    if (level >= 3) {
      put(cx0 - 1, topRow - 1, '#f6c453'); put(cx0, topRow - 1, '#f6c453'); put(cx0 + 1, topRow - 1, '#f6c453');
      put(cx0 - 1, topRow - 2, '#f6c453'); put(cx0 + 1, topRow - 2, '#f6c453');
      put(cx0, topRow - 2, '#e0524a');
    } else if (level >= 2) {
      put(cx0 - 1, topRow, '#e88ac0'); put(cx0 + 1, topRow, '#e88ac0');
      put(cx0, topRow, '#c96b9a');
    }

    // настроение: счастливый питомец — сердечко рядом
    if (mood === 'happy' && tick % 120 < 60) {
      put(maxX + 1, minY, '#e0607a'); put(maxX + 2, minY - 1, '#e0607a'); put(maxX + 1, minY - 1, '#e0607a');
    }
    // особая форма: на максимальном уровне — лёгкие искорки
    if (level >= 3) {
      const sp = 'rgba(255,224,138,0.95)';
      if (tick % 50 < 25) { put(minX - 1, minY + 1, sp); put(maxX + 2, maxY - 2, sp); }
      else { put(maxX + 2, minY + 2, sp); put(minX - 1, maxY - 3, sp); }
    } else if (level === 1 && tick % 100 < 8) {
      // детёныш — «только появился»: редкая искорка
      put(maxX + 1, minY, 'rgba(255,255,255,0.9)');
    }
  }

  /* ============================================================
     ХАБ-СЦЕНА (живая поляна + персонаж)
     ============================================================ */
  let hub = null;
  let focusMode = false;
  function setFocus(v) { focusMode = !!v; }
  let reactKind = null, reactTicks = 0;
  function react(kind, ticks) { reactKind = kind; reactTicks = ticks || 150; }

  function initHub(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const st = {
      canvas, ctx, tick: 0, raf: null,
      W: 0, H: 0, groundY: 0, u: 4,
      clouds: [], motes: [], butterflies: [],
      blinkAt: 60, blinking: 0,
      actionUntil: 0, action: 'idle', nextAction: 200, waveT: 0, lookDir: 0,
    };
    hub = st;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const cssW = rect.width || window.innerWidth;
      const cssH = rect.height || window.innerHeight;
      // Ключ к адаптиву: масштаб считаем от ВЫСОТЫ экрана, а не ширины.
      // Тогда персонаж занимает одну и ту же долю высоты на телефоне и на iPad,
      // а лишняя ширина просто заполняется поляной (а не растягивает героя).
      const HCELL = 4;            // арт-пикселей на клетку героя
      const HERO_CELLS = 20;      // высота героя в клетках
      const HERO_FRAC = 0.5;      // доля высоты экрана под героя
      let scale = (cssH * HERO_FRAC) / (HERO_CELLS * HCELL);
      scale = Math.max(3, scale);
      st.scale = scale;
      st.W = Math.max(72, Math.round(cssW / scale));
      st.H = Math.round(cssH / scale);
      canvas.width = st.W; canvas.height = st.H;
      ctx.imageSmoothingEnabled = false;
      st.groundY = Math.round(st.H * 0.86);
      st.u = HCELL;
      // облака
      st.clouds = [
        { x: 20, y: st.H * 0.18, s: 1.0, sp: 0.05 },
        { x: 80, y: st.H * 0.30, s: 0.7, sp: 0.035 },
        { x: 50, y: st.H * 0.10, s: 0.85, sp: 0.045 },
      ];
      st.motes = Array.from({ length: 10 }, () => ({
        x: Math.random() * st.W, y: st.groundY - Math.random() * st.H * 0.4,
        sp: 0.1 + Math.random() * 0.15, ph: Math.random() * 6,
      }));
      st.butterflies = [
        { x: 30, y: st.groundY - 30, t: Math.random() * 6, sp: 0.25 },
      ];
    }
    resize();
    window.addEventListener('resize', resize);
    st._resize = resize;

    loopHub();
    return st;
  }

  function loopHub() {
    if (!hub) return;
    const st = hub, ctx = st.ctx;
    st.tick++;
    const t = st.tick;

    // --- ФОН: локация + время суток ---
    drawEnvironment(ctx, st, t);

    // --- ПЕРСОНАЖ ---
    const look = Game.get().look;
    // дыхание
    const breath = (Math.sin(t / 45) + 1) / 2 > 0.5 ? 1 : 0;

    // моргание
    st.blinkAt--;
    if (st.blinkAt <= 0 && st.blinking === 0) { st.blinking = 8; st.blinkAt = 120 + Math.random() * 220; }
    if (st.blinking > 0) st.blinking--;
    const blink = st.blinking > 0 && st.blinking < 6;

    // редкие действия
    st.nextAction--;
    if (st.nextAction <= 0 && t > st.actionUntil) {
      const night = st._tod === 'night';
      const season = resolveSeason((Game.get().scene || {}).season);
      const roll = Math.random();
      if (night && roll < 0.45) { st.action = 'sleep'; st.actionUntil = t + 280; }
      else if (season === 'winter' && roll < 0.35) { st.action = 'cold'; st.actionUntil = t + 150; }
      else if (roll < 0.2) { st.action = 'wave'; st.actionUntil = t + 90; }
      else if (roll < 0.4) { st.action = 'coffee'; st.actionUntil = t + 160; }
      else if (roll < 0.58) { st.action = 'read'; st.actionUntil = t + 240; }
      else if (roll < 0.74) { st.action = 'stretch'; st.actionUntil = t + 80; }
      else { st.action = 'look'; st.lookDir = Math.random() < 0.5 ? -1 : 1; st.actionUntil = t + 100; }
      st.nextAction = 300 + Math.random() * 300;
    }
    let arm = 'idle', lookDir = 0;
    if (focusMode) { arm = 'coffee'; }
    else if (reactTicks > 0) { arm = reactKind; reactTicks--; }
    else if (t < st.actionUntil) {
      if (st.action === 'look') lookDir = st.lookDir;
      else arm = st.action;
    }
    const wavePhase = (Math.sin(t / 6) + 1) / 2;

    const cx = st.W / 2;
    const feetY = st.groundY + 1;
    // питомец рядом с героем (позиция и размер подстраиваются)
    const petU = 3;
    let petX = cx + 7 * st.u + 4;              // сразу справа от героя
    petX = Math.min(petX, st.W - 8 * petU - 2); // не вылезаем за край
    const ps = Game.get().petStats || { level: 1 };
    drawPet(ctx, petX, feetY, petU, look.pet, t, ps.level, Game.petMood ? Game.petMood() : 'happy');
    drawHero(ctx, cx, feetY, st.u, look, { breath, blink, lookDir, arm, wavePhase, tick: t });

    hub.raf = requestAnimationFrame(loopHub);
  }

  function drawCloud(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    const w = Math.round(16 * s), h = Math.round(6 * s);
    ctx.fillRect(x, y, w, h);
    ctx.fillRect(x + 3, y - 3, w - 6, 3);
    ctx.fillRect(x + 5, y - 5, w - 12, 3);
    ctx.fillStyle = 'rgba(210,225,235,0.9)';
    ctx.fillRect(x, y + h - 1, w, 1);
  }

  function stopHub() { if (hub && hub.raf) cancelAnimationFrame(hub.raf); }
  function resumeHub() { if (hub) loopHub(); }

  /* ============================================================
     ЭКРАН ЗАГРУЗКИ
     ============================================================ */
  let load = null;
  function initLoading(canvas) {
    const ctx = canvas.getContext('2d');
    const st = { canvas, ctx, tick: 0, raf: null, W: 0, H: 0, clouds: [], birds: [] };
    load = st;
    function resize() {
      const r = canvas.getBoundingClientRect();
      const cssW = r.width || window.innerWidth;
      const cssH = r.height || window.innerHeight;
      let scale = Math.max(3, cssH / 190); // ~консистентная плотность пикселей
      st.W = Math.max(72, Math.round(cssW / scale));
      st.H = Math.round(cssH / scale);
      canvas.width = st.W; canvas.height = st.H;
      ctx.imageSmoothingEnabled = false;
      st.clouds = [
        { x: 10, y: st.H * 0.25, s: 1, sp: 0.06 },
        { x: 70, y: st.H * 0.4, s: 0.7, sp: 0.04 },
        { x: 40, y: st.H * 0.15, s: 0.85, sp: 0.05 },
        { x: 95, y: st.H * 0.55, s: 0.6, sp: 0.03 },
      ];
      st.birds = [{ x: 30, y: st.H * 0.3 }, { x: 60, y: st.H * 0.22 }];
    }
    resize(); window.addEventListener('resize', resize); st._resize = resize;
    loopLoading();
  }
  function loopLoading() {
    if (!load) return;
    const st = load, ctx = st.ctx; st.tick++;
    const bands = ['#ffe6bf', '#ffd8a8', '#ffcf9c', '#d8e6c0', '#bfe0d8', '#aad8ea', '#9ccfe6'];
    const bh = st.H / bands.length;
    bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, Math.floor(i * bh), st.W, Math.ceil(bh) + 1); });
    // солнце
    ctx.fillStyle = 'rgba(255,245,200,0.6)'; ctx.fillRect(20, 16, 24, 24);
    ctx.fillStyle = '#ffeaa0'; ctx.fillRect(24, 20, 16, 16);
    // облака
    st.clouds.forEach(c => { c.x += c.sp; if (c.x > st.W + 20) c.x = -24; drawCloud(ctx, Math.round(c.x), Math.round(c.y), c.s); });
    // птицы
    st.birds.forEach((b, i) => {
      b.x += 0.08; if (b.x > st.W + 6) b.x = -6;
      const f = Math.sin(st.tick / 6 + i) > 0 ? 1 : 2;
      ctx.fillStyle = '#5a4632';
      ctx.fillRect(b.x - 2, b.y - f, 2, 1); ctx.fillRect(b.x + 1, b.y - f, 2, 1);
      ctx.fillRect(b.x, b.y, 1, 1);
    });
    // мерцание
    for (let i = 0; i < 5; i++) {
      if ((st.tick + i * 13) % 90 < 20) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect((i * 29 + 15) % st.W, (i * 17 + 30) % (st.H * 0.6), 1, 1);
      }
    }
    load.raf = requestAnimationFrame(loopLoading);
  }
  function stopLoading() {
    if (load && load.raf) cancelAnimationFrame(load.raf);
    if (load && load._resize) window.removeEventListener('resize', load._resize);
    load = null;
  }

  /* ============================================================

  function renderPet(canvas, pet, level) {
    if (!canvas) return;
    const size = 96;
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, size, size);
    if (pet && pet !== 'none') drawPet(ctx, size / 2, Math.round(size * 0.86), 9, pet, 20, level || 1, 'happy');
  }

  function renderAvatar(canvas, look) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // рисуем только голову крупно
    const u = 2, cx = 8, feetY = 30; // хитрость: рисуем героя, но canvas обрезает до головы
    // используем отдельную временную область: просто масштабируем голову
    drawHeadOnly(ctx, look, u);
  }
  function drawHeadOnly(ctx, look, u) {
    const skin = look.skin, hair = look.hair;
    const female = (look.gender || 'm') === 'f';
    const skinD = shade(skin, -28), skinL = shade(skin, 18), hairD = shade(hair, -34), hairL = shade(hair, 32);
    const P = (c, r, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(c * u, r * u, w * u, h * u); };
    // длинные боковые пряди у девушки — рисуем до головы
    if (female) { P(0, 2, 1, 5, hair); P(7, 2, 1, 5, hair); P(0, 2, 1, 5, hairD); }
    // 8x8 голова
    P(1, 2, 6, 5, skin); P(1, 2, 6, 1, skinL); P(1, 6, 6, 1, skinD); P(1, 2, 1, 5, skinD);
    // щёчки
    ctx.globalAlpha = 0.5; P(2, 4, 1, 1, '#e8907e'); P(5, 4, 1, 1, '#e8907e'); ctx.globalAlpha = 1;
    // глаза с бликом
    P(2, 4, 1, 1, '#2a2018'); P(5, 4, 1, 1, '#2a2018');
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect((2) * u, 4 * u, u * 0.4, u * 0.4); ctx.fillRect((5) * u, 4 * u, u * 0.4, u * 0.4);
    P(3, 5, 2, 1, shade(skin, -50)); // рот
    // волосы
    P(1, 1, 6, 2, hair); P(1, 1, 6, 1, hairL);
    P(0, 2, 1, female ? 2 : 3, hair); P(7, 2, 1, female ? 2 : 3, hair);
    if (look.accessory === 'crown') { P(1, 0, 6, 1, '#f6c453'); P(3, 0, 1, 1, '#e0524a'); }
    else if (look.accessory === 'hat') { P(0, 1, 8, 1, '#8a4632'); P(1, 0, 6, 1, '#a85a3f'); }
    else if (look.accessory === 'glasses') { P(1, 4, 6, 1, '#2a2018'); }
  }

  let customRaf = null;
  function renderCustomPreview(canvas, look) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    canvas.width = 48; canvas.height = 48;
    let tick = 0;
    if (customRaf) cancelAnimationFrame(customRaf);
    function loop() {
      tick++;
      ctx.clearRect(0, 0, 48, 48);
      ctx.fillStyle = 'rgba(40,60,30,0.15)'; ctx.fillRect(14, 44, 20, 3);
      const breath = (Math.sin(tick / 45) + 1) / 2 > 0.5 ? 1 : 0;
      const blink = tick % 140 < 8;
      drawHero(ctx, 24, 46, 2, look, { breath, blink, arm: 'idle', tick });
      customRaf = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopCustomPreview() { if (customRaf) cancelAnimationFrame(customRaf); customRaf = null; }

  return {
    initHub, stopHub, resumeHub, setFocus, react,
    initLoading, stopLoading,
    renderAvatar, renderCustomPreview, stopCustomPreview, renderPet,
    drawHero, drawPet, drawEnvironment,
  };
})();

/* --- крошечный хелпер для создания элементов --- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  const tr = (typeof T === 'function') ? T : (x => x);
  if (attrs) for (const k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'html') el.innerHTML = tr(attrs[k]);
    else if (k === 'text') el.textContent = tr(attrs[k]);
    else if (k === 'placeholder') el.setAttribute('placeholder', tr(attrs[k]));
    else if (k.startsWith('on') && typeof attrs[k] === 'function') el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(tr(c))); });
  return el;
}

/* ============================================================
   ЭФФЕКТЫ (частицы, тосты, level up, звук)
   ============================================================ */
const FX = (() => {
  const fxLayer = () => document.getElementById('fxLayer');
  const toastLayer = () => document.getElementById('toastLayer');

  // мягкий пиксельный «блип» через WebAudio
  let actx = null;
  function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.05) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function particles(x, y, glyphs, count) {
    const layer = fxLayer();
    for (let i = 0; i < count; i++) {
      const p = h('span', { class: 'particle', text: glyphs[i % glyphs.length] });
      p.style.left = x + 'px'; p.style.top = y + 'px';
      layer.append(p);
      const ang = (-90 + (Math.random() * 120 - 60)) * Math.PI / 180;
      const dist = 40 + Math.random() * 70;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      const dur = 700 + Math.random() * 500;
      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy - 30}px) scale(0.6)`, opacity: 0 },
      ], { duration: dur, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
    }
  }

  function toast(html) {
    const t = h('div', { class: 'toast', html });
    toastLayer().append(t);
    setTimeout(() => t.remove(), 2700);
  }
  // тост с отменой действия
  function undoToast(message, onUndo) {
    const t = h('div', { class: 'toast toast--undo' });
    let done = false;
    const btn = h('button', { class: 'undo-btn', text: T('Отменить') });
    btn.addEventListener('click', () => { if (done) return; done = true; onUndo(); t.remove(); TG.haptic('light'); });
    t.append(h('span', { text: message }), btn);
    toastLayer().append(t);
    setTimeout(() => t.remove(), 5000);
  }

  function levelUp(level) {
    beep(660, 0.1); setTimeout(() => beep(880, 0.12), 100); setTimeout(() => beep(1046, 0.15), 220);
    TG.haptic('success');
    if (Scene.react) Scene.react('cheer', 160); // персонаж радуется
    const modal = h('div', { class: 'levelup', onclick: () => modal.remove() },
      h('div', { class: 'levelup-card' },
        h('div', { class: 'lu-title', text: 'НОВЫЙ УРОВЕНЬ' }),
        h('div', { class: 'lu-level', text: level }),
        h('div', { class: 'lu-sub', text: 'Персонаж стал сильнее!' }),
      )
    );
    document.body.append(modal);
    // звёздный салют
    const cx = innerWidth / 2, cy = innerHeight / 2;
    particles(cx, cy, ['✦', '★', '✧', '◆'], 18);
    setTimeout(() => modal.remove(), 2600);
  }

  // общий фидбэк за награду; anchorEl — откуда летят частицы
  function rewardBurst(anchorEl, xp, coins, res) {
    let x = innerWidth / 2, y = innerHeight / 2;
    if (anchorEl) { const r = anchorEl.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    particles(x, y, ['✦', '◉', '★'], 10);
    beep(520, 0.06); setTimeout(() => beep(700, 0.06), 60);
    TG.haptic('light');
    toast(`<span class="t-reward">+${xp} XP</span> · <span class="t-reward">+${coins} ◉</span>`);
    if (res && res.leveledTo) setTimeout(() => levelUp(res.leveledTo), 500);
  }

  // универсальная центральная модалка (карточка на затемнении)
  function modal(cardNode, opts) {
    opts = opts || {};
    const m = h('div', { class: 'levelup' + (opts.cls ? ' ' + opts.cls : '') },
      cardNode);
    if (opts.dismiss !== false) m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    document.body.append(m);
    if (opts.autoClose) setTimeout(() => { if (m.parentNode) m.remove(); }, opts.autoClose);
    return () => { if (m.parentNode) m.remove(); };
  }

  function karmaUp(level, xp, coins) {
    if (Scene.react) Scene.react('cheer', 150);
    beep(600, 0.1); setTimeout(() => beep(820, 0.12), 110); setTimeout(() => beep(1000, 0.15), 240);
    TG.haptic('success');
    const card = h('div', { class: 'levelup-card karma-up' },
      h('div', { class: 'lu-title', text: '✨ КАРМА' }),
      h('div', { class: 'lu-level', text: level }),
      h('div', { class: 'lu-sub', text: T('Доброта растёт!') + `  +${xp} XP · +${coins} ◉` }),
    );
    modal(card, { autoClose: 2900 });
    particles(innerWidth / 2, innerHeight / 2, ['✨', '💚', '★', '◉'], 18);
  }

  return { particles, toast, undoToast, levelUp, rewardBurst, beep, modal, karmaUp };
})();

    el.setAttribute('viewBox', '0 0 24 24');
    el.setAttribute('class', cls || 'pix-icon');
    el.innerHTML = inner;
    return el;
  }
  const svgIcon = (key) => makeSvg(ICONS[key] || ICONS.folder, 'micon');
  const flagSvg = (code) => makeSvg(FLAGS[code] || FLAGS.ru, 'pix-flag');

const UI = (() => {
  const root = () => document.getElementById('overlayRoot');
  let current = null;
  let backCb = null;

  function open(title, glyph, bodyEl) {
    close(true); // мгновенно закрыть предыдущее
    const body = h('div', { class: 'sheet-body' }, bodyEl);
    const titleEl = h('div', { class: 'sheet-title' });
    const gs = h('span', { class: 'th-glyph' });
    if (glyph && ICONS[glyph]) gs.append(svgIcon(glyph));
    else gs.textContent = glyph || '';
    titleEl.append(gs, h('span', { text: T(title) }));
    const sheet = h('div', { class: 'sheet' },
      h('div', { class: 'sheet-header' },
        titleEl,
        h('button', { class: 'sheet-close', text: '✕', onclick: () => close() }),
      ),
      body,
    );
    const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) close(); } }, sheet);
    root().append(overlay);
    current = overlay;
    try { document.body.classList.add('sheet-open'); } catch (e) {}

    backCb = () => close();
    TG.showBack(backCb);
    TG.haptic('soft');
    return body;
  }

  function close(instant) {
    if (!current) return;
    const el = current; current = null;
    try { document.body.classList.remove('sheet-open'); } catch (e) {}
    Scene.stopCustomPreview();
    if (backCb) { TG.hideBack(backCb); backCb = null; }
    if (instant) { el.remove(); return; }
    el.classList.add('closing');
    setTimeout(() => el.remove(), 250);
  }

  function isOpen() { return !!current; }
  return { open, close, isOpen };
})();

  const Tutorial = (() => {
    function positionArrow(arrow, target) {
      const r = target.getBoundingClientRect ? target.getBoundingClientRect() : null;
      if (!r || (!r.width && !r.height)) { arrow.remove(); return; }
      const cx = r.left + r.width / 2;
      const mid = (window.innerHeight || 800) / 2;
      if (r.top < mid) { arrow.textContent = '▲'; arrow.style.left = (cx - 10) + 'px'; arrow.style.top = (r.bottom + 2) + 'px'; }
      else { arrow.textContent = '▼'; arrow.style.left = (cx - 10) + 'px'; arrow.style.top = (r.top - 26) + 'px'; }
    }
    function card(step, opts) {
      opts = opts || {};
      const target = step.target ? document.querySelector(step.target) : null;
      let arrow = null;
      if (target) {
        target.classList.add('tut-glow');
        arrow = h('div', { class: 'tut-arrow' });
        document.body.append(arrow);
        positionArrow(arrow, target);
      }
      const isLast = !opts.total || opts.step >= opts.total;
      const overlay = h('div', { class: 'tut-overlay' });
      const cleanup = () => { if (target) target.classList.remove('tut-glow'); if (arrow) arrow.remove(); overlay.remove(); };
      const btn = h('button', { class: 'btn tut-btn', text: isLast ? 'Понятно' : 'Далее' });
      btn.addEventListener('click', () => { TG.haptic('light'); cleanup(); if (opts.onNext) opts.onNext(); });
      const skip = opts.total > 1 && !isLast
        ? h('button', { class: 'tut-skip', text: 'Пропустить', onclick: () => { cleanup(); if (opts.onSkip) opts.onSkip(); } })
        : null;
      const dots = opts.total > 1
        ? h('div', { class: 'tut-dots' }, ...Array.from({ length: opts.total }, (_, i) => h('span', { class: 'tut-dot' + (i < opts.step ? ' on' : '') })))
        : null;
      overlay.append(h('div', { class: 'tut-card' },
        h('div', { class: 'tut-title', text: step.title }),
        h('div', { class: 'tut-text', text: step.text }),
        dots, btn, skip,
      ));
      document.body.append(overlay);
    }
    function welcome() {
      if (Game.tutSeen('welcome')) return;
      const ids = ['w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w7']; let i = 0;
      const finish = () => Game.tutMark('welcome');
      const next = () => {
        if (i >= ids.length) { finish(); return; }
        const s = TUT_STEPS[ids[i]]; i++; card(s, { onNext: next, onSkip: finish, step: i, total: ids.length });
      };
      next();
    }
    function trigger(id) {
      if (!TUT_STEPS[id] || Game.tutSeen(id) || !Game.tutSeen('welcome')) return; // не мешаем во время тура
      Game.tutMark(id);
      setTimeout(() => card(TUT_STEPS[id]), 350);
    }
    return { welcome, trigger };
  })();

  function openTasks() {
    const body = UI.open('Задачи', 'tasks', buildTasks());
    Tutorial.trigger('tasks');
  }
  function buildTasks() {
    const wrap = h('div', {});
    const input = h('input', { class: 'pix-input', type: 'text', placeholder: 'Новая задача…', maxlength: '60' });
    const from = h('input', { class: 'pix-input time-in', type: 'time' });
    const to = h('input', { class: 'pix-input time-in', type: 'time' });

    let days = [], repeat = false;
    const DOW = I18N.dows();
    const dayRow = h('div', { class: 'day-chips hidden' });
    DOW.forEach((d, i) => {
      const wd = i + 1;
      const chip = h('button', { class: 'day-chip', text: d });
      chip.addEventListener('click', () => {
        const j = days.indexOf(wd);
        if (j >= 0) { days.splice(j, 1); chip.classList.remove('on'); }
        else { days.push(wd); chip.classList.add('on'); }
        TG.haptic('light');
      });
      dayRow.append(chip);
    });
    const preset = h('button', { class: 'chip-preset', text: 'Будни Пн–Пт', onclick: () => {
      days = [1, 2, 3, 4, 5]; [...dayRow.children].forEach((c, i) => c.classList.toggle('on', i < 5));
    } });
    const repeatBtn = h('button', { class: 'btn btn--ghost repeat-btn', text: '🔁 Повтор по дням' });
    repeatBtn.addEventListener('click', () => {
      repeat = !repeat; repeatBtn.classList.toggle('active', repeat); dayRow.classList.toggle('hidden', !repeat);
      if (!repeat) { days = []; [...dayRow.children].forEach(c => c.classList.remove('on')); }
    });

    const add = () => {
      if (!input.value.trim()) return;
      const time = from.value ? (to.value ? from.value + '–' + to.value : from.value) : null;
      Game.addTask(input.value, { reward: 15, time, days: repeat ? days : null });
      input.value = ''; from.value = ''; to.value = '';
      repeat = false; repeatBtn.classList.remove('active'); dayRow.classList.add('hidden');
      days = []; [...dayRow.children].forEach(c => c.classList.remove('on'));
      refresh();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

    wrap.append(
      h('p', { class: 'section-hint', text: 'Задача может быть с временем (напр. 15:00–17:00) и повтором по дням недели — удобно для работы, тренировок и т.п.' }),
      h('div', { class: 'add-row' }, input),
      h('div', { class: 'add-row time-row' }, h('span', { class: 'field-lbl', text: '🕒' }), from, h('span', { class: 'dash', text: '–' }), to),
      h('div', { class: 'add-row' }, repeatBtn, preset),
      dayRow,
      h('div', { class: 'add-row' }, h('button', { class: 'btn btn--wide', text: 'Добавить задачу', onclick: add })),
    );
    const list = h('div', { class: 'list' }); wrap.append(list);

    function refresh() {
      list.innerHTML = '';
      const tasks = Game.get().tasks;
      if (!tasks.length) { list.append(empty('📋', 'Пока пусто. Добавь первую задачу!', T('Добавить задачу'), () => input.focus())); return; }
      const today = Game.todayKey();
      [...tasks].sort((a, b) => Game.taskDoneOn(a, today) - Game.taskDoneOn(b, today)).forEach(t => {
        const done = Game.taskDoneOn(t, today);
        const check = h('button', { class: 'row-check' + (done ? ' checked' : ''), text: done ? '✓' : '' });
        const row = h('div', { class: 'card-row' + (done ? ' done' : '') },
          check,
          h('div', { class: 'row-body' },
            h('div', { class: 'row-title', text: t.title }),
            taskMeta(t),
          ),
          h('div', { class: 'row-reward', text: `+${t.reward}` }),
          h('button', { class: 'row-del', text: '🗑', onclick: () => delUndo('tasks', t, () => Game.delTask(t.id), refresh) }),
        );
        check.addEventListener('click', () => {
          const res = Game.toggleTask(t.id);
          if (res) FX.rewardBurst(check, t.reward, Math.ceil(t.reward / 3), res);
          refresh();
        });
        list.append(row);
      });
    }
    refresh();
    return wrap;
  }

  // строка с временем / повтором / датой
  function taskMeta(t) {
    const box = h('div', { class: 'row-sub row-meta' });
    if (t.time) box.append(h('span', { class: 'meta-pill', text: '🕒 ' + t.time }));
    if (t.days) {
      const names = ['', ...I18N.dows()];
      const label = (t.days.length === 5 && [1, 2, 3, 4, 5].every(d => t.days.includes(d))) ? T('Будни')
        : (t.days.length === 7 ? T('Каждый день') : t.days.map(d => names[d]).join(' '));
      box.append(h('span', { class: 'meta-pill repeat', text: '🔁 ' + label }));
    } else if (t.date) {
      box.append(h('span', { class: 'meta-pill', text: '📅 ' + t.date }));
    }
    if (!t.time && !t.days && !t.date) box.append(h('span', { text: ' ' }));
    return box;
  }

  // вид «Месяц» — сетка календаря + панель дня
  function buildMonthView() {
    const cont = h('div', {});
    let view = new Date();
    let selected = Game.todayKey();
    const head = h('div', { class: 'cal-head' });
    const grid = h('div', { class: 'cal-grid' });
    const dayPanel = h('div', { class: 'cal-day' });
    cont.append(head, grid, dayPanel);

    function render() {
      const y = view.getFullYear(), m = view.getMonth();
      const months = I18N.months();
      head.innerHTML = '';
      head.append(
        h('button', { class: 'cal-nav', text: '‹', onclick: () => { view = new Date(y, m - 1, 1); render(); } }),
        h('div', { class: 'cal-month', text: `${months[m]} ${y}` }),
        h('button', { class: 'cal-nav', text: '›', onclick: () => { view = new Date(y, m + 1, 1); render(); } }),
      );
      grid.innerHTML = '';
      I18N.dows().forEach(d => grid.append(h('div', { class: 'cal-dow', text: d })));
      let first = new Date(y, m, 1).getDay(); first = first === 0 ? 6 : first - 1;
      for (let i = 0; i < first; i++) grid.append(h('div', { class: 'cal-cell blank' }));
      const days = new Date(y, m + 1, 0).getDate();
      const today = Game.todayKey();
      for (let d = 1; d <= days; d++) {
        const key = `${y}-${m + 1}-${d}`;
        const count = Game.tasksForDate(key).length;
        const cell = h('div', { class: 'cal-cell' + (key === today ? ' today' : '') + (key === selected ? ' sel' : ''), 'data-key': key },
          h('span', { text: d }),
          count ? h('span', { class: 'cal-dot' }) : null,
        );
        cell.addEventListener('click', () => { selected = key; TG.haptic('light'); render(); });
        grid.append(cell);
      }
      renderDay();
    }

    function renderDay() {
      dayPanel.innerHTML = '';
      const items = Game.tasksForDate(selected);
      const [yy, mm, dd] = selected.split('-').map(Number);
      const label = `${dd}.${String(mm).padStart(2, '0')}.${yy}`;
      dayPanel.append(h('div', { class: 'cal-day-title', text: '📌 ' + label + (selected === Game.todayKey() ? T(' · сегодня') : '') }));
      const title = h('input', { class: 'pix-input', type: 'text', placeholder: 'Добавить дело на этот день…', maxlength: '60' });
      const from = h('input', { class: 'pix-input time-in', type: 'time' });
      const to = h('input', { class: 'pix-input time-in', type: 'time' });
      const addForDay = () => {
        if (!title.value.trim()) return;
        const time = from.value ? (to.value ? from.value + '–' + to.value : from.value) : null;
        Game.addTask(title.value, { reward: 15, date: selected, time });
        title.value = ''; from.value = ''; to.value = '';
        render();
      };
      title.addEventListener('keydown', e => { if (e.key === 'Enter') addForDay(); });
      dayPanel.append(
        h('div', { class: 'add-row' }, title),
        h('div', { class: 'add-row time-row' }, h('span', { class: 'field-lbl', text: '🕒' }), from, h('span', { class: 'dash', text: '–' }), to,
          h('button', { class: 'btn', text: '+', onclick: addForDay })),
      );
      if (!items.length) { dayPanel.append(h('p', { class: 'section-hint', text: 'Пока нет запланированных дел.' })); return; }
      items.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
      const list = h('div', { class: 'list' });
      items.forEach(t => {
        const done = Game.taskDoneOn(t, selected);
        const canCheck = selected === Game.todayKey() || !t.days;
        const check = h('button', { class: 'row-check' + (done ? ' checked' : ''), text: done ? '✓' : '' });
        if (canCheck) check.addEventListener('click', () => {
          const res = Game.toggleTask(t.id);
          if (res) { FX.rewardBurst(check, t.reward, Math.ceil(t.reward / 3), res); Tutorial.trigger('firstTaskDone'); }
          render();
        }); else check.classList.add('locked');
        list.append(h('div', { class: 'card-row' + (done ? ' done' : '') },
          check,
          h('div', { class: 'row-body' }, h('div', { class: 'row-title', text: t.title }), taskMeta(t)),
          h('button', { class: 'row-del', text: '🗑', onclick: () => delUndo('tasks', t, () => Game.delTask(t.id), render) }),
        ));
      });
      dayPanel.append(list);
    }
    render();
    return cont;
  }

  /* ============================================================
     WISHLIST (список желаемого)
     Расширяемо: в будущем легко добавить категории, приоритет,
     изображения, заметки, количество, историю цены.
     ============================================================ */
  const CURRENCIES = ['EUR', 'USD', 'GBP', 'RUB', 'UAH', 'KZT', 'PLN', 'JPY', 'CNY', 'TRY'];
  const CUR_SYM = { EUR: '€', USD: '$', GBP: '£', RUB: '₽', UAH: '₴', KZT: '₸', PLN: 'zł', JPY: '¥', CNY: '¥', TRY: '₺' };
  function plural(n, ru) {
    if (typeof I18N !== 'undefined' && I18N.get && I18N.get() === 'en') return n === 1 ? 'item' : 'items';
    const n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return ru[0];
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return ru[1];
    return ru[2];
  }
  function fmtMoney(amount, cur) {
    const n = Number(amount) || 0;
    const dec = (cur === 'JPY' || cur === 'KZT') ? 0 : 2;
    let str;
    try { str = n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
    catch (e) { str = n.toFixed(dec); }
    const sym = CUR_SYM[cur] || (cur ? cur + ' ' : '');
    return cur === 'PLN' ? (str + ' ' + sym) : (sym + str);
  }
  function openExternal(u) {
    if (!/^https?:\/\//i.test(u || '')) { FX.toast('✖ ' + T('Некорректная ссылка')); return; }
    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.openLink) tg.openLink(u);
      else window.open(u, '_blank', 'noopener');
    } catch (e) { FX.toast('✖ ' + T('Не удалось открыть ссылку')); }
  }

      const curs = Object.keys(by);

  function wishEditor(existing, onDone) {
    const isEdit = !!existing;
    const overlay = h('div', { class: 'wish-overlay' });
    const close = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

    const name = h('input', { class: 'pix-input', type: 'text', maxlength: '80', placeholder: T('Например: Sony WH-1000XM6') });
    const url = h('input', { class: 'pix-input', type: 'url', placeholder: 'https://…', maxlength: '500' });
    const price = h('input', { class: 'pix-input', type: 'text', inputmode: 'decimal', placeholder: T('напр. 399.99') });
    const curSel = h('select', { class: 'pix-input wish-cur' });
    CURRENCIES.forEach(c => curSel.append(h('option', { value: c, text: c + ' ' + (CUR_SYM[c] || '') })));
    let pendingImage = existing ? (existing.image || null) : null;
    const imgPrev = h('div', { class: 'wish-editor-thumb' });
    function renderThumb() { imgPrev.innerHTML = ''; imgPrev.append(wishThumb(pendingImage)); }
    if (existing) { name.value = existing.name; url.value = existing.url || ''; price.value = existing.price != null ? existing.price : ''; curSel.value = existing.currency || 'EUR'; }
    else curSel.value = 'EUR';
    renderThumb();

    const hint = h('div', { class: 'wish-hint' });
    let fetching = false;
    function tryFetch() {
      const u = (url.value || '').trim();
      if (!u) { hint.textContent = ''; return; }
      if (!/^https?:\/\//i.test(u)) { hint.textContent = T('Ссылка должна начинаться с http:// или https://'); return; }
      if (typeof Cloud === 'undefined' || !Cloud.enabled() || !Cloud.fetchPreview) {
        hint.textContent = T('Авто-данные доступны с подключённым сервером — пока введи вручную.'); return;
      }
      if (fetching) return; fetching = true;
      hint.textContent = '⏳ ' + T('Загружаю данные товара…');
      Cloud.fetchPreview(u).then(r => {
        fetching = false;
        if (!r) { hint.textContent = T('Не удалось получить данные — заполни вручную.'); return; }
        const got = [];
        if (r.price != null) { price.value = r.price; if (r.currency && CURRENCIES.indexOf(r.currency) >= 0) curSel.value = r.currency; got.push(T('цена')); }
        if (r.image) { pendingImage = r.image; renderThumb(); got.push(T('картинка')); }
        if (r.title && !name.value.trim()) name.value = r.title;
        hint.textContent = got.length ? ('✓ ' + T('Получено:') + ' ' + got.join(', ') + '. ' + T('Проверь и поправь.')) : T('Не удалось получить данные — заполни вручную.');
      }).catch(() => { fetching = false; hint.textContent = T('Не удалось получить данные — заполни вручную.'); });
    }
    url.addEventListener('change', tryFetch);
    const fetchBtn = h('button', { class: 'btn btn--sm', text: '🔎 ' + T('Загрузить с сайта'), onclick: tryFetch });
    const clearImgBtn = h('button', { class: 'btn btn--sm btn--ghost', text: '🗑 ' + T('Убрать фото'), onclick: () => { pendingImage = null; renderThumb(); } });

    const err = h('div', { class: 'wish-err' });
    function save() {
      err.textContent = '';
      if (!name.value.trim()) { err.textContent = T('Укажи название товара'); name.focus(); return; }
      const u = (url.value || '').trim();
      if (u && !/^https?:\/\//i.test(u)) { err.textContent = T('Ссылка должна начинаться с http:// или https://'); return; }
      const data = { name: name.value, url: u, price: price.value, currency: curSel.value, image: pendingImage };
      try {
        if (isEdit) Game.updateWish(existing.id, data); else Game.addWish(data);
      } catch (e) { err.textContent = T('Не удалось сохранить. Попробуй ещё раз.'); return; }
      TG.haptic('success'); close(); if (onDone) onDone();
      FX.toast('💾 ' + T(isEdit ? 'Сохранено' : 'Добавлено'));
    }

    const card = h('div', { class: 'wish-modal' },
      h('div', { class: 'wish-modal-title', text: T(isEdit ? 'Редактировать товар' : 'Новый товар') }),
      h('div', { class: 'wish-editor-head' }, imgPrev, h('div', { class: 'wish-editor-headfields' }, wishField(T('Название товара') + ' *', name))),
      wishField(T('Ссылка на товар'), url),
      h('div', { class: 'add-row wish-fetch-row' }, fetchBtn, clearImgBtn),
      hint,
      wishField(T('Цена и валюта'), h('div', { class: 'wish-price-row' }, price, curSel)),
      err,
      h('div', { class: 'wish-modal-actions' },
        h('button', { class: 'btn btn--ghost', text: T('Отмена'), onclick: close }),
        h('button', { class: 'btn', text: T('Сохранить'), onclick: save }),
      ),
    );
    overlay.append(card);
    document.body.append(overlay);
    setTimeout(() => name.focus(), 60);
  }

  function confirmModal(message, onYes) {
    const overlay = h('div', { class: 'wish-overlay' });
    const close = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    overlay.append(h('div', { class: 'wish-modal confirm-modal' },
      h('div', { class: 'confirm-msg', text: message }),
      h('div', { class: 'wish-modal-actions' },
        h('button', { class: 'btn btn--ghost', text: T('Отмена'), onclick: close }),
        h('button', { class: 'btn danger-solid', text: T('Удалить'), onclick: () => { close(); TG.haptic('medium'); onYes(); } }),
      ),
    ));
    document.body.append(overlay);
  }

  function openStats() {
    const s = Game.get();
    const { inc, exp } = Game.totals();
    const bestStreak = s.habits.reduce((m, hb) => Math.max(m, hb.streak), 0);
    const wrap = h('div', {});
    UI.open('Статистика', 'stats', wrap);
    const grid = h('div', { class: 'stat-grid' },
      stat('⭐', s.level, 'Уровень'),
      stat('✨', s.xp + ' / ' + Game.xpMax(), 'Опыт'),
      stat('◉', s.coins, 'Монеты'),
      stat('✅', s.stats.tasksDone, 'Задач сделано'),
      stat('🌱', s.stats.habitsDone, 'Привычек отмечено'),
      stat('🔥', s.streak ? s.streak.count : 0, 'Стрик входов'),
      stat('⏱️', s.stats.focusMin, 'Минут фокуса'),
      stat('💰', fmt(inc), 'Всего доход'),
    );
    wrap.append(grid);

    // --- активность за последние 7 дней (график) ---
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(Game.dayKey ? dayKeyLocal(d) : null); }
    function dayKeyLocal(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
    const vals = days.map(k => Game.activityFor(k));
    const maxV = Math.max(1, ...vals);
    const dowShort = I18N.dows();
    const chart = h('div', { class: 'bar-chart' });
    days.forEach((k, i) => {
      const d = new Date(); d.setDate(d.getDate() - (6 - i));
      const wd = (d.getDay() + 6) % 7;
      const col = h('div', { class: 'bar-col' },
        h('div', { class: 'bar-wrap' }, (() => { const b = h('div', { class: 'bar-fill' }); b.style.height = Math.round((vals[i] / maxV) * 100) + '%'; if (vals[i] > 0) b.classList.add('has'); return b; })()),
        h('div', { class: 'bar-lbl', text: dowShort[wd] }),
      );
      chart.append(col);
    });
    wrap.append(h('h4', { class: 'stats-h', text: 'Активность за неделю' }), chart);

    // --- тепловая карта за 5 недель ---
    const heat = h('div', { class: 'heatmap' });
    for (let i = 34; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const v = Game.activityFor(dayKeyLocal(d));
      const lvl = v === 0 ? 0 : v < 2 ? 1 : v < 4 ? 2 : v < 6 ? 3 : 4;
      heat.append(h('div', { class: 'heat-cell heat-' + lvl, title: dayKeyLocal(d) + ': ' + v }));
    }
    wrap.append(h('h4', { class: 'stats-h', text: 'Карта активности (35 дней)' }), heat);

    function stat(g, v, l) {
      return h('div', { class: 'stat-card' },
        h('div', { class: 'st-glyph', text: g }),
        h('div', { class: 'st-value', text: v }),
        h('div', { class: 'st-label', text: l }));
    }
  }

      { title: 'Одежда', key: 'outfit', type: 'opt', opts: [['top', 'верх'], ['dress', 'платье']] },
      { title: 'Обувь', key: 'shoes', type: 'opt', opts: [['default', 'обычная'], ['sneakers', 'кроссовки']] },

          const ownable = ['hairStyle', 'accessory', 'pet', 'frame'].includes(g.key);

          const locked = ownable && !Game.owns(okey);
          const sel = look[g.key] === val;

    }
    function redraw() { Scene.renderCustomPreview(canvas, Game.get().look); App.updateAvatar(); }
    function applyFrame() { App.applyFrame(); }
