/* ============================================================
   PixelQuest — cozy pixel-art RPG productivity mini app
   Палитра: тёплый рассвет над поляной
   ============================================================ */
:root {
  /* дерево / панели интерфейса */
  --wood-dark:   #3b2a1c;
  --wood:        #6b4a2f;
  --wood-light:  #8a6240;
  --parchment:   #f6e6c4;
  --parchment-2: #ecd6a8;
  --ink:         #3a2b1c;
  --ink-soft:    #7a5c3e;

  /* небо / природа */
  --sky-top:     #ffd9a0;
  --sky-mid:     #a9d7e8;
  --grass:       #6bab5b;
  --grass-dark:  #4d8a46;

  /* акценты игры */
  --gold:        #f6c453;
  --gold-deep:   #d9982f;
  --xp:          #7bd06a;
  --xp-deep:     #4fa649;
  --coin:        #ffcf5c;
  --danger:      #d96a5a;
  --danger-deep: #b04434;
  --blue:        #5b8fd0;

  --shadow:      rgba(59, 42, 28, 0.35);
  --page-bg:     #2a1f16;

  /* безопасные зоны Telegram */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tg-top: 0px; /* задаётся из JS (высота хедера Telegram) */
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Pixellari', system-ui, sans-serif;
  color: var(--ink);
  background: var(--page-bg);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.screen { position: fixed; inset: 0; }
.hidden { display: none !important; }

/* ============================================================
   ЭКРАН ЗАГРУЗКИ
   ============================================================ */
.loading-screen { z-index: 100; overflow: hidden; }
#loadingCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.loading-ui {
  position: absolute;
  left: 0; right: 0; bottom: 18%;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 0 32px;
}

.logo { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.logo-pixel {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(18px, 7.5vw, 30px); color: var(--parchment);
  text-shadow: 0 3px 0 var(--wood-dark), 0 4px 0 var(--wood-dark);
  letter-spacing: 1px;
}
.logo-quest {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(14px, 5.5vw, 22px); color: var(--gold);
  text-shadow: 0 3px 0 var(--gold-deep);
  letter-spacing: 5px; margin-top: 10px;
}

.loadbar {
  width: min(280px, 78vw); height: 20px;
  background: var(--wood-dark);
  border: 3px solid var(--wood-light);
  box-shadow: 0 0 0 3px var(--wood-dark), 4px 4px 0 var(--shadow);
  padding: 3px; position: relative;
}
.loadbar-fill {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, var(--gold) 0 8px, var(--gold-deep) 8px 10px);
  transition: width 0.25s steps(6);
}
.loading-tip {
  font-size: 16px; color: var(--parchment);
  text-shadow: 0 2px 0 var(--wood-dark);
  min-height: 20px;
}

/* ============================================================
   ГЛАВНЫЙ ЭКРАН
   ============================================================ */
.hub-screen { z-index: 10; }
#sceneCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* --- Верхняя панель --- */
.top-panel {
  position: absolute;
  top: calc(var(--safe-top) + var(--tg-top) + 8px);
  left: 8px; right: 8px;
  display: flex; align-items: flex-start; gap: 8px;
  z-index: 5;
}

.pixel-panel, .player-card, .coin-badge, .icon-btn {
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 3px 3px 0 var(--shadow);
}

.player-card {
  flex: 1; display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 6px; text-align: left; min-width: 0;
  transition: transform 0.08s;
}
.player-card:active { transform: translate(1px, 1px); }

.avatar-frame {
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--sky-mid);
  border: 3px solid var(--gold-deep);
  box-shadow: inset 0 0 0 2px var(--gold);
  display: grid; place-items: center; overflow: hidden;
}
#avatarCanvas { width: 34px; height: 34px; }

.player-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.player-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.player-name {
  font-weight: 600; font-size: 16px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-level {
  font-size: 12px; color: var(--parchment);
  background: var(--wood); padding: 1px 6px;
  border: 2px solid var(--wood-dark); flex-shrink: 0;
}

.xp-bar {
  position: relative; height: 14px;
  background: var(--wood-dark);
  border: 2px solid var(--wood-light);
  overflow: hidden;
}
.xp-fill {
  height: 100%; width: 0%;
  background: linear-gradient(var(--xp), var(--xp-deep));
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
  transition: width 0.6s cubic-bezier(.5,0,.2,1);
}
.xp-text {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10px; color: #fff; text-shadow: 0 1px 0 var(--wood-dark);
}

.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: grid; place-items: center;
  transition: transform 0.08s;
}
.icon-btn:active { transform: translate(1px, 1px); }
.pix-icon { font-size: 22px; color: var(--gold-deep); }

.coin-badge {
  position: absolute; top: 52px; right: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 7px; font-size: 15px; font-weight: 600;
}
.coin-icon { color: var(--gold-deep); font-size: 15px; }

/* пиксельные флаги */
.pix-flag { width: 34px; height: 24px; display: inline-block; vertical-align: middle; shape-rendering: crispEdges; flex-shrink: 0; }
.lang-opt { display: flex; align-items: center; justify-content: center; gap: 6px; }
.lang-swatch { display: flex; align-items: center; gap: 8px; }

/* --- Реплика персонажа --- */
.speech-bubble {
  position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
  background: var(--parchment); border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 3px 3px 0 var(--shadow);
  padding: 6px 12px; font-size: 15px; z-index: 4;
  max-width: 70vw; text-align: center;
  animation: popIn 0.25s cubic-bezier(.3,1.4,.5,1);
}
.speech-bubble::after {
  content: ''; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border: 6px solid transparent;
  border-top-color: var(--wood-dark);
}

/* --- Нижняя навигация --- */
.bottom-nav {
  position: absolute; left: 0; right: 0;
  bottom: 0;
  padding: 10px 12px calc(10px + var(--safe-bottom));
  display: flex; align-items: flex-end; justify-content: space-around; gap: 8px;
  background: linear-gradient(var(--wood) , var(--wood-dark));
  border-top: 4px solid var(--wood-dark);
  box-shadow: 0 -3px 0 var(--wood-light) inset;
  z-index: 6;
}
.nav-btn {
  flex: 1; max-width: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 0 4px 0 var(--wood-dark);
  transition: transform 0.08s, box-shadow 0.08s;
}
.nav-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--parchment-2), 0 1px 0 var(--wood-dark); }
.nav-btn--center {
  transform: translateY(-8px);
  background: var(--gold);
  box-shadow: inset 0 0 0 2px #ffe28a, 0 5px 0 var(--gold-deep);
}
.nav-btn--center:active { transform: translateY(-4px); box-shadow: inset 0 0 0 2px #ffe28a, 0 1px 0 var(--gold-deep); }
.nav-glyph { font-size: 24px; line-height: 1; color: var(--wood-dark); }
.nav-btn--center .nav-glyph { color: var(--wood-dark); }
.nav-label { font-size: 12px; font-weight: 600; color: var(--ink); }
.nav-btn--active { outline: 0; }
.nav-btn--active .nav-glyph { color: var(--gold-deep); }

/* ============================================================
   МОДАЛЬНЫЕ ОКНА / РАЗДЕЛЫ
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(35, 25, 16, 0.55);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.overlay.closing { animation: fadeOut 0.2s ease forwards; }

.sheet {
  width: 100%; max-width: 560px; max-height: 92vh;
  background: var(--parchment);
  border: 4px solid var(--wood-dark);
  border-bottom: none;
  box-shadow: inset 0 0 0 3px var(--parchment-2), 0 -4px 0 var(--shadow);
  display: flex; flex-direction: column;
  animation: slideUp 0.3s cubic-bezier(.2,1,.3,1);
  padding-bottom: var(--safe-bottom);
}
.overlay.closing .sheet { animation: slideDown 0.25s ease forwards; }

.sheet-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 12px;
  border-bottom: 3px solid var(--wood-dark);
  background: linear-gradient(var(--parchment), var(--parchment-2));
}
.sheet-title { font-size: 22px; font-weight: 700; flex: 1; }
.sheet-title .th-glyph { margin-right: 8px; color: var(--gold-deep); }
.sheet-close {
  width: 36px; height: 36px; display: grid; place-items: center;
  font-size: 20px; font-weight: 700;
  background: var(--danger); color: #fff;
  border: 3px solid var(--danger-deep);
  box-shadow: 0 3px 0 var(--danger-deep);
  transition: transform 0.08s;
}
.sheet-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--danger-deep); }

.sheet-body { padding: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* --- Сетка меню --- */
.menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.menu-tile {
  aspect-ratio: 1 / 0.82;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 0 5px 0 var(--wood);
  transition: transform 0.08s, box-shadow 0.08s;
  position: relative;
}
.menu-tile:active { transform: translateY(4px); box-shadow: inset 0 0 0 2px var(--parchment-2), 0 1px 0 var(--wood); }
.menu-tile .tile-glyph { display: flex; align-items: center; justify-content: center; height: 34px; }
.micon { width: 30px; height: 30px; display: block; color: var(--wood-dark); shape-rendering: crispEdges; }
.menu-tile.pick.picked .micon { color: #fff; }
.tile-emoji { font-size: 28px; line-height: 1; }
.menu-tile .tile-label { font-size: 15px; font-weight: 600; }
.menu-tile--soon { opacity: 0.7; }
.tile-badge {
  position: absolute; top: 6px; right: 6px; font-size: 9px;
  background: var(--blue); color: #fff; padding: 1px 5px; border: 2px solid #3d6ba8;
}

/* --- Общие элементы разделов --- */
.section-hint { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }

.add-row { display: flex; gap: 8px; margin-bottom: 14px; }
.pix-input, .pix-select {
  flex: 1; min-width: 0; padding: 10px; font-family: inherit; font-size: 15px;
  color: var(--ink); background: #fff;
  border: 3px solid var(--wood-dark);
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
}
.pix-input:focus, .pix-select:focus { outline: 3px solid var(--gold); }
.btn {
  padding: 10px 16px; font-size: 15px; font-weight: 600; color: var(--ink);
  background: var(--gold); border: 3px solid var(--gold-deep);
  box-shadow: 0 4px 0 var(--gold-deep); transition: transform 0.08s, box-shadow 0.08s;
  white-space: nowrap;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn--wide { width: 100%; }
.btn--ghost { background: var(--parchment); border-color: var(--wood-dark); box-shadow: 0 4px 0 var(--wood); }
.btn--ghost:active { box-shadow: 0 1px 0 var(--wood); }
.btn--danger { background: var(--danger); color: #fff; border-color: var(--danger-deep); box-shadow: 0 4px 0 var(--danger-deep); }

/* список задач/привычек */
.list { display: flex; flex-direction: column; gap: 10px; }
.card-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: #fff; border: 3px solid var(--wood-dark);
  box-shadow: 2px 2px 0 var(--shadow);
}
.card-row.done { opacity: 0.55; }
.card-row.done .row-title { text-decoration: line-through; }
.row-check {
  width: 30px; height: 30px; flex-shrink: 0;
  border: 3px solid var(--wood-dark); background: var(--parchment);
  display: grid; place-items: center; font-size: 18px; color: var(--xp-deep);
}
.row-check.checked { background: var(--xp); color: #fff; }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 12px; color: var(--ink-soft); }
.row-reward { font-size: 12px; color: var(--gold-deep); font-weight: 600; flex-shrink: 0; }
.row-del {
  width: 28px; height: 28px; flex-shrink: 0; font-size: 16px;
  background: transparent; color: var(--danger); border: 2px solid transparent;
}
.row-del:active { color: var(--danger-deep); }

.empty {
  text-align: center; padding: 30px 16px; color: var(--ink-soft);
}
.empty .empty-glyph { font-size: 44px; display: block; margin-bottom: 8px; }

/* привычки / стрик */
.streak-pill { font-size: 12px; color: var(--gold-deep); font-weight: 700; }

/* финансы */
.wallet-summary {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.wallet-card {
  flex: 1; padding: 12px; text-align: center;
  background: #fff; border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.wallet-card .wc-label { font-size: 12px; color: var(--ink-soft); }
.wallet-card .wc-value { font-size: 20px; font-weight: 700; margin-top: 2px; }
.wc-value.pos { color: var(--xp-deep); }
.wc-value.neg { color: var(--danger-deep); }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab {
  flex: 1; padding: 8px; text-align: center; font-weight: 600; font-size: 14px;
  background: var(--parchment); border: 3px solid var(--wood-dark);
  box-shadow: 0 3px 0 var(--wood);
}
.tab.active { background: var(--gold); box-shadow: 0 3px 0 var(--gold-deep); }

/* календарь */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px;
  background: var(--parchment); border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); }
.cal-month { font-size: 18px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 2px 0; }
.cal-cell {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 14px; background: #fff; border: 2px solid var(--wood-light); position: relative;
}
.cal-cell.blank { background: transparent; border: none; }
.cal-cell.today { background: var(--gold); border-color: var(--gold-deep); font-weight: 700; }
.cal-dot { width: 5px; height: 5px; background: var(--danger); margin-top: 2px; }
.cal-cell.sel { outline: 3px solid var(--gold-deep); outline-offset: -1px; }
.cal-cell { cursor: pointer; }

/* поля времени в задачах */
.time-row { align-items: center; gap: 6px; }
.time-in { flex: 1; min-width: 0; }
.field-lbl { font-size: 18px; flex-shrink: 0; }
.dash { font-weight: 700; color: var(--ink-soft); flex-shrink: 0; }

/* повтор по дням */
.repeat-btn.active { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 4px 0 var(--gold-deep); }
.chip-preset {
  padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink);
  background: var(--parchment); border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); white-space: nowrap;
}
.day-chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.day-chip {
  width: 40px; height: 38px; font-size: 14px; font-weight: 700; color: var(--ink-soft);
  background: #fff; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood);
}
.day-chip.on { background: var(--xp); color: #fff; border-color: var(--xp-deep); box-shadow: 0 3px 0 var(--xp-deep); }

/* мета-строка задачи (время/повтор/дата) */
.row-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.meta-pill {
  font-size: 11px; font-weight: 600; color: var(--ink-soft);
  background: var(--parchment-2); border: 2px solid var(--wood-light); padding: 0 5px;
}
.meta-pill.repeat { color: #fff; background: var(--blue); border-color: #3d6ba8; }

/* панель выбранного дня в календаре */
.cal-day { margin-top: 14px; border-top: 3px dashed var(--wood-light); padding-top: 12px; }
.cal-day-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.row-check.locked { opacity: 0.5; cursor: default; }

/* статистика */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-card {
  padding: 14px; text-align: center; background: #fff;
  border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.stat-card .st-glyph { font-size: 26px; }
.stat-card .st-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-card .st-label { font-size: 12px; color: var(--ink-soft); }

/* кастомизация */
.custom-preview {
  display: grid; place-items: center; padding: 16px;
  background: var(--sky-mid); border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2); margin-bottom: 14px;
}
#customCanvas { width: 120px; height: 120px; }
.custom-group { margin-bottom: 14px; }
.custom-group h4 { font-size: 15px; margin-bottom: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 36px; height: 36px; border: 3px solid var(--wood-dark);
  box-shadow: 2px 2px 0 var(--shadow); position: relative;
}
.swatch.selected { outline: 3px solid var(--gold); outline-offset: 1px; }
.swatch.opt {
  display: grid; place-items: center; font-size: 18px; background: var(--parchment);
  width: auto; padding: 6px 10px; font-weight: 600;
}

/* ============================================================
   ВИДЖЕТЫ ГЛАВНОГО ЭКРАНА
   ============================================================ */
.widget-layer {
  position: absolute; z-index: 3;
  top: calc(var(--safe-top) + var(--tg-top) + 114px);
  left: 10px; right: 10px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 14px; pointer-events: none;
}
/* align-items: flex-start — чтобы карточки были по содержимому, а не растягивались в пустые полосы */
.widget-col { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; max-width: 44%; }
.widget-col--right { align-items: flex-end; margin-top: 8px; }
.widget {
  pointer-events: auto;
  display: flex; align-items: center; gap: 7px;
  padding: 5px 9px 5px 7px; text-align: left;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 2px 2px 0 var(--shadow);
  transition: transform 0.08s;
  max-width: 100%;
}
.widget:active { transform: translate(1px, 1px); }
.widget .w-glyph { font-size: 18px; flex-shrink: 0; }
.widget .w-main { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.widget .w-value { font-size: 15px; font-weight: 700; color: var(--ink); }
.widget .w-label {
  font-size: 10px; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px;
}

/* ============================================================
   КОПИЛКА
   ============================================================ */
.goal-card {
  padding: 12px; background: #fff;
  border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.goal-card.done { background: var(--parchment); border-color: var(--gold-deep); }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.goal-name { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.goal-bar {
  position: relative; height: 18px; margin-bottom: 6px;
  background: var(--wood-dark); border: 2px solid var(--wood-light); overflow: hidden;
}
.goal-fill {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, var(--xp) 0 8px, var(--xp-deep) 8px 10px);
  transition: width 0.5s cubic-bezier(.5,0,.2,1);
}
.goal-pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--wood-dark);
}
.goal-meta { font-size: 13px; color: var(--ink-soft); }
.goal-done-badge { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--xp-deep); }
.goal-add-row { margin-top: 8px; margin-bottom: 0; }
.goal-add { padding: 8px; }

/* ============================================================
   ФОКУС / АНАЛИТИКА
   ============================================================ */
.focus-bar {
  position: absolute; z-index: 6;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-bottom) + 96px);
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--parchment);
  border: 3px solid var(--wood-dark); box-shadow: inset 0 0 0 2px var(--parchment-2), 2px 3px 0 var(--shadow);
}
.focus-ico { font-size: 16px; }
.focus-time { font-family: 'Press Start 2P', monospace; font-size: 15px; color: var(--wood-dark); }
.focus-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.focus-stop {
  width: 22px; height: 22px; font-size: 12px; background: var(--danger); color: #fff;
  border: 2px solid #8a3a2a; box-shadow: 0 2px 0 #8a3a2a; display: grid; place-items: center;
}
.focus-choices { display: flex; gap: 10px; margin-bottom: 14px; }
.focus-choice { flex: 1; font-size: 16px; }

.stats-h { font-size: 15px; margin: 16px 0 8px; color: var(--wood-dark); }
.weekly-hero { font-size: 48px; text-align: center; margin: 4px 0; }
.weekly-big { font-family: 'Pixellari', sans-serif; font-size: 22px; font-weight: 700; text-align: center; color: var(--wood-dark); margin-bottom: 14px; }

/* настроение */
.mood-row { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 16px; }
.mood-btn {
  flex: 1; font-size: 26px; padding: 8px 0; background: #fff;
  border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); transition: transform 0.08s;
}
.mood-btn.sel { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); transform: translateY(1px); }
.mood-hist { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; padding: 6px; background: var(--parchment-2); border: 3px solid var(--wood-light); }
.mood-cell { aspect-ratio: 1; display: grid; place-items: center; font-size: 13px; background: #fff; border: 1px solid rgba(0,0,0,0.06); }

/* капсула времени */
.capsule-locked { opacity: 0.75; background: var(--parchment-2); }
.focus-choice.sel-choice { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); }

/* питомец */
.pet-stage { display: grid; place-items: center; padding: 12px; margin-bottom: 12px; background: linear-gradient(180deg, #bfe0d8, #a9d7c0); border: 3px solid var(--wood-dark); box-shadow: inset 0 0 0 2px var(--parchment-2); }
.pet-canvas { width: 120px; height: 120px; image-rendering: pixelated; }
.pet-lvl { font-size: 16px; font-weight: 700; text-align: center; color: var(--wood-dark); margin-bottom: 6px; }
.pet-mood { font-size: 14px; text-align: center; color: var(--ink-soft); margin: 8px 0 14px; }
.pet-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.pet-swbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; background: #fff; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); }
.pet-swbtn.sel { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); }
.pet-mini { width: 48px; height: 48px; image-rendering: pixelated; }
.pet-swlbl { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.lb-rank { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--wood-dark); width: 40px; flex-shrink: 0; }
/* лига */
.league-badge { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 14px; border: 4px solid var(--wood-dark); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), 3px 4px 0 var(--shadow); }
.lg-emo { font-size: 34px; }
.lg-name { font-family: 'Pixellari', sans-serif; font-size: 20px; font-weight: 700; color: var(--wood-dark); }
.lg-week { font-size: 13px; color: var(--ink-soft); }
.tier-bronze { background: #e2b38a; }
.tier-silver { background: #d6dbe0; }
.tier-gold { background: #f2d777; }
.tier-platinum { background: #bfe3e8; }
.tier-diamond { background: #cdd6f5; }

/* категории меню */
.menu-cat-title { font-size: 12px; font-weight: 700; color: var(--ink-soft); letter-spacing: 1px; text-transform: uppercase; margin: 16px 2px 8px; }
.menu-cats > .menu-cat-title:first-child { margin-top: 0; }
.back-btn { margin-bottom: 12px; font-size: 14px; }
.danger-btn { color: var(--danger); }
.menu-tile.pick { transition: transform 0.08s; }
.menu-tile.pick.picked { background: var(--xp); border-color: var(--xp-deep); box-shadow: 0 4px 0 var(--xp-deep); }
.menu-tile.pick.picked .tile-label, .menu-tile.pick.picked .tile-glyph { color: #fff; }
.emoji-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.emoji-btn { width: 40px; height: 40px; font-size: 20px; background: #fff; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); }
.emoji-btn.sel { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); }

/* ассистент (заготовка) */
.asst-hero { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.asst-avatar { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--wood-dark); background: var(--gold); border: 3px solid var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); }
.asst-hi { font-size: 16px; font-weight: 700; color: var(--wood-dark); }
.asst-log { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; padding: 8px; margin: 10px 0; background: var(--parchment-2); border: 3px solid var(--wood-light); }
.asst-msg { display: flex; }
.asst-msg.asst-me { justify-content: flex-end; }
.asst-bubble { max-width: 82%; padding: 8px 10px; font-size: 14px; line-height: 1.4; background: #fff; border: 3px solid var(--wood-dark); }
.asst-me .asst-bubble { background: var(--xp); color: #fff; border-color: var(--xp-deep); }
.asst-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 90px; padding: 6px; background: var(--parchment-2); border: 3px solid var(--wood-light); }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
.bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.bar-fill { width: 100%; min-height: 2px; background: var(--wood-light); transition: height 0.4s; }
.bar-fill.has { background: repeating-linear-gradient(0deg, var(--xp) 0 4px, var(--xp-deep) 4px 6px); }
.bar-lbl { font-size: 10px; color: var(--ink-soft); margin-top: 4px; }

.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 6px; background: var(--parchment-2); border: 3px solid var(--wood-light); }
.heat-cell { aspect-ratio: 1; border: 1px solid rgba(0,0,0,0.08); }
.heat-0 { background: #e8dcc2; }
.heat-1 { background: #bfe0a8; }
.heat-2 { background: #8fce78; }
.heat-3 { background: #5faf52; }
.heat-4 { background: #3d8a3a; }

/* магазин / замки предметов */
.btn.owned, .shop-buy.owned { background: var(--parchment-2); color: var(--ink-soft); border-color: var(--wood-light); box-shadow: 0 3px 0 var(--wood-light); }
.btn.locked { opacity: 0.55; }
.shop-buy { white-space: nowrap; flex-shrink: 0; }
.swatch.locked-item { position: relative; opacity: 0.9; }
.lock-badge {
  position: absolute; bottom: -7px; right: -6px; font-size: 9px; font-weight: 700;
  background: var(--wood-dark); color: var(--gold); padding: 1px 3px; border: 2px solid var(--parchment); white-space: nowrap;
}

/* достижения */
.ach-glyph { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }

/* переключатель виджета */
.wtoggle {
  flex-shrink: 0; padding: 6px 12px; font-size: 13px; font-weight: 700;
  background: var(--parchment); color: var(--ink-soft);
  border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood);
}
.wtoggle.on { background: var(--xp); color: #fff; border-color: var(--xp-deep); box-shadow: 0 3px 0 var(--xp-deep); }

/* ============================================================
   КАРМА
   ============================================================ */
.karma-bar {
  position: absolute; z-index: 4;

  left: 8px; right: 78px;

  padding: 4px 7px;

  border: 3px solid var(--wood-dark);

}
.karma-spark { font-size: 14px; flex-shrink: 0; }
.karma-label { font-size: 12px; font-weight: 700; color: var(--ink); flex-shrink: 0; }
.karma-track {
  position: relative; flex: 1; min-width: 30px; height: 14px;
  background: var(--wood-dark); border: 2px solid var(--wood-light); overflow: hidden;
}
.karma-fill {
  height: 100%; width: 0%;

}

/* модальные окна кармы (используют базовый .levelup оверлей) */
.levelup.km-scroll { align-items: flex-start; overflow-y: auto; padding: 18px 14px calc(24px + var(--safe-bottom)); }
.karma-intro, .karma-add {
  max-width: 460px; width: 100%; text-align: left;
  padding: 20px; background: var(--parchment); color: var(--ink);
  border: 4px solid var(--wood-dark); box-shadow: inset 0 0 0 3px var(--parchment-2), 4px 6px 0 var(--shadow);
}
.ki-title, .ka-title {

}

}

.ki-cta { margin-top: 16px; }
.ka-desc { font-size: 13px; line-height: 1.5; color: var(--ink-soft); margin-bottom: 12px; }

.ka-actions { display: flex; gap: 10px; margin-top: 14px; }

/* празднование уровня кармы */
.karma-up .lu-title { color: #4aa66c; }

/* журнал */
.karma-summary {
  font-size: 14px; font-weight: 700; color: var(--wood-dark);

  padding: 8px 10px; margin-bottom: 10px;
}
.deed-card {

}

.journal-footer {

  background: #fff7e8; border: 3px dashed var(--wood-light);

/* экран выбора языка */
.lang-screen { align-items: center; z-index: 120; }
.lang-card { max-width: 340px; width: 100%; text-align: center; padding: 26px 22px; background: var(--parchment); border: 4px solid var(--wood-dark); box-shadow: inset 0 0 0 3px var(--parchment-2), 4px 6px 0 var(--shadow); }
.lang-logo { font-size: 40px; margin-bottom: 6px; }
.lang-title { font-family: 'Pixellari', sans-serif; font-size: 22px; font-weight: 700; color: var(--wood-dark); }
.lang-sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 18px; }
.lang-opt { margin-top: 10px; font-size: 17px; }

/* level up modal */
.levelup {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: rgba(35,25,16,0.6); animation: fadeIn 0.2s;
}
.levelup-card {
  background: var(--parchment); border: 4px solid var(--gold-deep);
  box-shadow: inset 0 0 0 3px var(--gold), 0 6px 0 var(--shadow);
  padding: 24px 32px; text-align: center; animation: popIn 0.4s cubic-bezier(.2,1.5,.4,1);
}
.levelup-card .lu-title { font-family: 'Pixellari'; font-size: 16px; color: var(--gold-deep); }
.levelup-card .lu-level { font-family: 'Press Start 2P'; font-size: 40px; color: var(--ink); margin: 12px 0; }
.levelup-card .lu-sub { font-size: 15px; color: var(--ink-soft); }

/* ============================================================
   ЭФФЕКТЫ / ЧАСТИЦЫ / ТОСТЫ
   ============================================================ */
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.particle { position: absolute; font-size: 18px; will-change: transform, opacity; }

.toast-layer {
  position: fixed; left: 0; right: 0; z-index: 60;
  top: calc(var(--safe-top) + var(--tg-top) + 70px);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  background: var(--wood-dark); color: var(--parchment);
  border: 3px solid var(--wood-light);
  box-shadow: 3px 3px 0 var(--shadow);
  padding: 8px 14px; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  animation: toastIn 0.3s cubic-bezier(.2,1.4,.4,1), toastOut 0.3s ease 2.2s forwards;
}
.toast .t-reward { color: var(--gold); }

/* ============================================================
   АНИМАЦИИ
   ============================================================ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes toastIn { from { transform: translateY(-16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateY(-16px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   ОБУЧЕНИЕ (диалоговые окна + подсветка)
   ============================================================ */
.tut-overlay {
  position: fixed; inset: 0; z-index: 110;
  background: rgba(35,25,16,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 16px calc(var(--safe-bottom) + 100px);
  animation: fadeIn 0.2s;
}
.tut-card {
  width: 100%; max-width: 340px;
  background: var(--parchment); border: 4px solid var(--wood-dark);
  box-shadow: inset 0 0 0 3px var(--parchment-2), 4px 6px 0 var(--shadow);
  padding: 16px 18px; animation: popIn 0.3s cubic-bezier(.2,1.4,.4,1);
}
.tut-title { font-family: 'Pixellari', sans-serif; font-size: 18px; font-weight: 700; color: var(--wood-dark); margin-bottom: 6px; }
.tut-text { font-size: 14px; line-height: 1.5; color: var(--ink); margin-bottom: 12px; }
.tut-dots { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
.tut-dot { width: 7px; height: 7px; background: var(--wood-light); }
.tut-dot.on { background: var(--gold-deep); }
.tut-btn { width: 100%; }
.tut-glow { position: relative; z-index: 112; animation: tutPulse 1.2s infinite; }
@keyframes tutPulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--gold), 0 0 8px 3px rgba(246,196,83,0.55); }
  50% { box-shadow: 0 0 0 4px var(--gold), 0 0 18px 7px rgba(246,196,83,0.9); }
}

/* стрелка-указатель обучения */
.tut-arrow {
  position: fixed; z-index: 113; font-size: 18px; color: var(--gold);
  text-shadow: 0 0 3px var(--wood-dark), 1px 1px 0 var(--wood-dark);
  pointer-events: none; animation: tutBounce 0.9s infinite;
}
@keyframes tutBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.tut-skip { display: block; width: 100%; margin-top: 8px; padding: 4px; background: none; border: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; }

/* ============================================================
   Иконки в шапке разделов и виджетах + анимация нажатия плиток
   ============================================================ */
.th-glyph { display: inline-flex; align-items: center; vertical-align: middle; }
.th-glyph .micon { width: 22px; height: 22px; margin-right: 2px; }
.widget .w-glyph { display: flex; align-items: center; justify-content: center; }
.widget .w-glyph .micon { width: 22px; height: 22px; }
.ach-glyph .micon { width: 26px; height: 26px; display: block; }

/* нажатие на плитки меню — мягкое «утапливание» + отклик иконки */
.menu-tile { transition: transform 0.08s ease, box-shadow 0.08s ease; }
.menu-tile .tile-glyph { transition: transform 0.12s cubic-bezier(.2,1.5,.4,1); }
.menu-tile:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--parchment-2), 1px 1px 0 var(--shadow); }
.menu-tile:active .tile-glyph { transform: scale(0.86); }
@keyframes tilePop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.menu-tile:active .micon, .menu-tile:active .tile-emoji { animation: none; }

/* тост с отменой + CTA в пустых состояниях */
.toast--undo { display: inline-flex; align-items: center; gap: 10px; }
.undo-btn { background: var(--gold); border: 2px solid var(--gold-deep); box-shadow: 0 2px 0 var(--gold-deep); padding: 3px 10px; font-family: inherit; font-weight: 700; color: var(--wood-dark); cursor: pointer; }
.undo-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--gold-deep); }
.empty-cta { margin-top: 14px; }

/* сегментный переключатель вида (Месяц/Список) */
.seg { display: flex; gap: 6px; margin-bottom: 12px; }
.seg-btn { flex: 1; padding: 8px; background: var(--parchment-2); border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); font-family: inherit; font-weight: 700; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
.seg-btn.active { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 3px 0 var(--gold-deep); color: var(--wood-dark); }
.seg-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood); }

/* скрываем верхний HUD, когда открыт раздел (меньше визуального шума) */

body.sheet-open .top-panel,
body.sheet-open .karma-bar,
body.sheet-open .widget-layer,
body.sheet-open .coin-badge { opacity: 0; pointer-events: none; }

/* крупнее тап-таргеты (удобнее пальцем) */
.row-del { min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.row-check { min-width: 40px; min-height: 40px; }
.wtoggle { min-height: 40px; min-width: 56px; }
.cal-nav { min-width: 40px; min-height: 40px; }
.seg-btn { min-height: 44px; }
.tab { min-height: 40px; }

   WISHLIST
   ============================================================ */

.wish-modal { width: 100%; max-width: 360px; background: var(--parchment); border: 4px solid var(--wood-dark); box-shadow: inset 0 0 0 3px var(--parchment-2), 4px 6px 0 var(--shadow); padding: 18px; animation: popIn 0.25s cubic-bezier(.2,1.4,.4,1); max-height: 90vh; overflow-y: auto; }

.wish-price-row .pix-input { flex: 1; }

.wish-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }

.theme-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ===== js/telegram.js ===== */
/* ============================================================
   Обёртка над Telegram WebApp SDK.
   Всё работает и вне Telegram (для локальной разработки) —
   тогда используются заглушки.
   ============================================================ */
const TG = (() => {
  const wa = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const inside = !!(wa && wa.initData !== undefined && wa.platform && wa.platform !== 'unknown');

  function init() {
    if (!wa) return;
    try {
      wa.ready();
      wa.expand();
      // современные версии умеют fullscreen
      if (typeof wa.requestFullscreen === 'function' && wa.isVersionAtLeast && wa.isVersionAtLeast('8.0')) {
        try { wa.requestFullscreen(); } catch (e) {}
      }
      if (typeof wa.disableVerticalSwipes === 'function') wa.disableVerticalSwipes();
      wa.setHeaderColor && wa.setHeaderColor('#3b2a1c');
      wa.setBackgroundColor && wa.setBackgroundColor('#2a1f16');

      // высота системной шапки Telegram → в CSS-переменную
      applyInsets();
      wa.onEvent && wa.onEvent('viewportChanged', applyInsets);
      wa.onEvent && wa.onEvent('safeAreaChanged', applyInsets);
    } catch (e) { console.warn('TG init', e); }
  }

  function applyInsets() {
    let top = 0;
    if (wa && wa.safeAreaInset) top = wa.safeAreaInset.top || 0;
    if (wa && wa.contentSafeAreaInset) top += wa.contentSafeAreaInset.top || 0;
    document.documentElement.style.setProperty('--tg-top', top + 'px');
  }

  function haptic(type = 'light') {
    if (!wa || !wa.HapticFeedback) return;
    try {
      if (type === 'success' || type === 'error' || type === 'warning') {
        wa.HapticFeedback.notificationOccurred(type);
      } else {
        wa.HapticFeedback.impactOccurred(type); // light | medium | heavy | rigid | soft
      }
    } catch (e) {}
  }

  function showBack(cb) {
    if (!wa || !wa.BackButton) return;
    try {
      wa.BackButton.show();
      wa.BackButton.onClick(cb);
    } catch (e) {}
  }
  function hideBack(cb) {
    if (!wa || !wa.BackButton) return;
    try {
      cb && wa.BackButton.offClick(cb);
      wa.BackButton.hide();
    } catch (e) {}
  }

  function user() {
    try {
      const u = wa && wa.initDataUnsafe && wa.initDataUnsafe.user;
      if (u) return { id: u.id, name: u.first_name || u.username || 'Герой' };
    } catch (e) {}
    return null;
  }

  return { wa, inside, init, haptic, showBack, hideBack, user };
})();


/* ===== js/cloud.js ===== */
/* ============================================================
   Облако (сервер). ПО УМОЛЧАНИИ ВЫКЛЮЧЕНО.
   Чтобы включить синхронизацию, друзей, рейтинг и напоминания —
   впиши URL своего сервера в SERVER_URL (см. README бэкенда),
   например: 'https://plannersrealm.onrender.com'
   Пока строка пустая — игра работает полностью офлайн, как раньше.
   ============================================================ */
const Cloud = (() => {
  const SERVER_URL = ''; // ← ВСТАВЬ СЮДА URL СВОЕГО СЕРВЕРА

  const tg = () => (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;
  function initData() { const w = tg(); return (w && w.initData) ? w.initData : ''; }
  function enabled() { return !!SERVER_URL && !!initData(); }

  async function api(path, body) {
    const opt = { method: body !== undefined ? 'POST' : 'GET', headers: { 'Authorization': 'tma ' + initData() } };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const r = await fetch(SERVER_URL + path, opt);
    return r.json();
  }

  let pushTimer = null;
  function push(state) {
    if (!enabled()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { api('/api/sync', { state }).catch(() => {}); }, 1500);
  }
  async function pull() {
    if (!enabled()) return null;
    try { const r = await api('/api/sync', { state: null }); return (r && r.ok) ? r.state : null; } catch (e) { return null; }
  }
  async function leaderboard() { if (!enabled()) return null; try { return await api('/api/leaderboard'); } catch (e) { return null; } }
  async function league() { if (!enabled()) return null; try { return await api('/api/league'); } catch (e) { return null; } }
  async function friends() { if (!enabled()) return null; try { return await api('/api/friends'); } catch (e) { return null; } }
  async function friendAdd(username) { if (!enabled()) return { ok: false }; try { return await api('/api/friends/add', { username }); } catch (e) { return { ok: false }; } }
  async function setReminder(time, on) { if (!enabled()) return; try { return await api('/api/reminder', { time, enabled: on, tzOffset: new Date().getTimezoneOffset() }); } catch (e) {} }
  async function assistant(message) { if (!enabled()) return null; try { return await api('/api/assistant', { message }); } catch (e) { return null; } }
  async function fetchPrice(url) { if (!enabled()) return null; try { const r = await api('/api/price', { url }); return (r && r.ok && r.price != null) ? { price: r.price, currency: r.currency } : null; } catch (e) { return null; } }
  async function fetchPreview(url) { if (!enabled()) return null; try { const r = await api('/api/price', { url }); return (r && r.ok) ? { price: r.price, currency: r.currency, image: r.image || null, title: r.title || null } : null; } catch (e) { return null; } }

  return { enabled, push, pull, leaderboard, league, friends, friendAdd, setReminder, assistant, fetchPrice, fetchPreview };
})();

const Store = (() => {
  const KEY = 'pixelquest_save_v1';
  let mem = null; // фолбэк, если localStorage недоступен

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { if (mem) return mem; }
    return null;
  }
  function write(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { mem = data; }
  }
  return { read, write };
})();

  let s = migrate(Store.read() || defaults());
  const listeners = [];

  function save() {

  // применить состояние с сервера (при синхронизации)

  function onChange(cb) { listeners.push(cb); }

  function xpForLevel(lvl) { return 80 + lvl * 40; } // растущая планка

  // добавить опыт + монеты; возвращает {leveledTo|null}
  function reward(xp, coins) {

  function restore(listName, item, index) {

  function sanitizePrice(p) {
    if (p === '' || p == null) return null;
    const n = parseFloat(String(p).replace(',', '.').replace(/[^\d.\-]/g, ''));
    return (isFinite(n) && n >= 0) ? n : null;
  }
  function addWish(data) {

    if (patch.currency != null) w.currency = String(patch.currency).slice(0, 6);
    if (patch.image !== undefined) w.image = (patch.image && /^https?:\/\//i.test(patch.image)) ? String(patch.image).slice(0, 800) : null;

  function wishTotals() {

    s.wishlist.forEach(w => { const c = w.currency || 'EUR'; const p = Number(w.price) || 0; by[c] = (by[c] || 0) + p; });
    return { by, count: s.wishlist.length };
  }
  function reset() {
    try { localStorage.removeItem('pixelquest_save_v1'); } catch (e) {}
    try { location.reload(); } catch (e) {}

  /* --- задачи --- */
  // addTask(title, opts) где opts = {reward, date, time, days}
  // (совместимо со старым addTask(title, reward, date))
  function addTask(title, a, b) {
    if (!title || !title.trim()) return;
    let opts = {};
    if (typeof a === 'object' && a !== null) opts = a;
    else opts = { reward: a, date: b };
    const days = Array.isArray(opts.days) && opts.days.length ? opts.days.slice().sort() : null;
    s.tasks.push({
      id: uid(), title: title.trim(),
      reward: opts.reward || 15,
      date: days ? null : (opts.date || null),
      time: opts.time || null,     // 'HH:MM-HH:MM' | 'HH:MM' | null
      days,                        // [1..7] Пн..Вс | null (еженедельная)
      done: false, lastDone: null,
    });
    save(); emit();
  }
  function toggleTask(id) {
    const t = s.tasks.find(x => x.id === id);
    if (!t) return null;
    if (t.days) {
      // еженедельная — отмечаем выполнение на сегодня (награда раз в день)
      const today = todayKey();
      if (t.lastDone === today) { t.lastDone = null; save(); emit(); return null; } // снять отметку
      t.lastDone = today; s.stats.tasksDone++; bumpActivity();
      const res = reward(t.reward, Math.ceil(t.reward / 3));
      save(); emit(); return res;
    }
    t.done = !t.done;
    let res = null;
    if (t.done) { s.stats.tasksDone++; bumpActivity(); res = reward(t.reward, Math.ceil(t.reward / 3)); }
    save(); emit();
    return t.done ? res : null;
  }
  function delTask(id) { s.tasks = s.tasks.filter(x => x.id !== id); save(); emit(); }

  // Пн=1 .. Вс=7
  function weekdayOf(key) { const [y, m, d] = key.split('-').map(Number); const jd = new Date(y, m - 1, d).getDay(); return ((jd + 6) % 7) + 1; }
  function taskDoneOn(t, key) { return t.days ? (t.lastDone === key) : !!t.done; }
  function tasksForDate(key) {
    const wd = weekdayOf(key);
    return s.tasks.filter(t => (t.days ? t.days.includes(wd) : t.date === key));
  }

  /* --- привычки --- */
  function addHabit(title) {
    if (!title || !title.trim()) return;
    s.habits.push({ id: uid(), title: title.trim(), streak: 0, lastDone: null });
    save(); emit();
  }
  function markHabit(id) {
    const h = s.habits.find(x => x.id === id);
    if (!h) return null;
    const today = todayKey();
    if (h.lastDone === today) return null; // уже сегодня
    const yest = dayKey(Date.now() - 864e5);
    h.streak = h.lastDone === yest ? h.streak + 1 : 1;
    h.lastDone = today;
    s.stats.habitsDone++; bumpActivity();
    const bonus = Math.min(h.streak, 7);
    const res = reward(10 + bonus * 2, 3 + bonus);
    save(); emit();
    return res;
  }
  function delHabit(id) { s.habits = s.habits.filter(x => x.id !== id); save(); emit(); }
  function habitDoneToday(h) { return h.lastDone === todayKey(); }

  /* --- финансы --- */
  function addTxn(type, title, amount, date) {
    const a = parseFloat(amount);
    if (!title || !title.trim() || isNaN(a) || a <= 0) return;
    s.txns.push({ id: uid(), type, title: title.trim(), amount: a, date: date || todayKey() });
    save(); emit();
  }
  function delTxn(id) { s.txns = s.txns.filter(x => x.id !== id); save(); emit(); }
  function balance() {
    return s.txns.reduce((sum, t) => sum + (t.type === 'income' ? t.amount : -t.amount), 0);
  }
  function totals() {
    let inc = 0, exp = 0;
    s.txns.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
    return { inc, exp };
  }

  /* --- копилка (цели по накоплениям) --- */
  function addGoal(name, target, note) {
    const t = parseFloat(target);
    if (!name || !name.trim() || isNaN(t) || t <= 0) return;
    s.goals.push({ id: uid(), name: name.trim(), target: t, saved: 0, note: (note || '').trim(), done: false, createdAt: Date.now() });
    save(); emit();
  }
  function addToGoal(id, amount) {
    const g = s.goals.find(x => x.id === id);
    if (!g || g.done) return null;
    const a = parseFloat(amount);
    if (isNaN(a) || a <= 0) return null;
    g.saved += a;
    let completed = null;
    if (g.saved >= g.target) {
      g.saved = g.target; g.done = true;
      s.stats.goalsDone++;
      // игровая награда за достижение цели
      const bonusXp = 120, bonusCoins = 80;
      const res = reward(bonusXp, bonusCoins);
      const ach = pushAchievement('🎯', `Цель достигнута: ${g.name}`);
      completed = { goal: g, xp: bonusXp, coins: bonusCoins, res, ach };
    }
    save(); emit();
    return completed;
  }
  function delGoal(id) { s.goals = s.goals.filter(x => x.id !== id); save(); emit(); }

  /* --- карма (доброта в реальной жизни) --- */
  // сколько добрых дел нужно, чтобы достичь уровня n (1-based)
  function karmaNeed(n) {
    const table = [3, 5, 7, 10, 15];
    if (n <= 0) return table[0];
    if (n <= table.length) return table[n - 1];
    return 15 + (n - 5) * 6; // дальше плавно растёт
  }
  function karmaNext() { return karmaNeed(s.karma.level + 1); }
  function addDeed(text) {
    const t = (text || '').trim();
    if (!t) return null;
    s.deeds.unshift({ id: uid(), text: t, date: todayKey(), karmaLevel: s.karma.level }); bumpActivity();
    s.karma.progress++;
    let leveled = null;
    const need = karmaNeed(s.karma.level + 1);
    if (s.karma.progress >= need) {
      s.karma.progress = 0; s.karma.level++;
      const xp = 30 + s.karma.level * 20, coins = 20 + s.karma.level * 15; // награда растёт с уровнем
      const res = reward(xp, coins);
      pushAchievement('✨', `Карма ур. ${s.karma.level}`);
      leveled = { level: s.karma.level, xp, coins, res };
    }
    save(); emit();
    return leveled;
  }
  function delDeed(id) { s.deeds = s.deeds.filter(d => d.id !== id); save(); emit(); }
  function setFlag(k, v) { s.flags[k] = v; save(); emit(); }

  /* --- достижения --- */
  function pushAchievement(glyph, title) {
    const a = { id: uid(), glyph, title, date: todayKey() };
    s.achievements.unshift(a);
    return a;
  }

  /* --- виджеты главной --- */
  function toggleWidget(id) {
    const i = s.widgets.indexOf(id);
    if (i >= 0) s.widgets.splice(i, 1); else s.widgets.push(id);
    save(); emit();
  }
  function hasWidget(id) { return s.widgets.includes(id); }

  /* --- утилиты --- */
  /* --- активность (для тепловой карты и графиков) --- */
  function bumpActivity(n) { const k = todayKey(); s.activity[k] = (s.activity[k] || 0) + (n || 1); }
  function activityFor(key) { return s.activity[key] || 0; }

  /* --- фокус-сессия (Помодоро) --- */
  function finishFocus(minutes) {
    const m = Math.max(0, Math.round(minutes));
    if (m <= 0) return null;
    s.stats.focusMin += m;
    bumpActivity(1);
    const xp = m * 2, coins = Math.floor(m / 2);
    const res = reward(xp, coins);
    save(); emit();
    return { minutes: m, xp, coins, res };
  }

  /* --- питомец: кормёжка и развитие --- */
  function petNeed(level) { return level === 1 ? 5 : 12; }
  function petMood() { return s.petStats.lastFed === todayKey() ? 'happy' : 'hungry'; }
  function daysSince(key) { if (!key) return 999; const [y, m, d] = key.split('-').map(Number); return Math.floor((new Date() - new Date(y, m - 1, d)) / 86400000); }
  function petMoodFace() {
    const d = daysSince(s.petStats.lastFed);
    if (d <= 0) return { emo: '😊', label: 'Сыт и доволен' };
    if (d <= 2) return { emo: '🙂', label: 'В порядке' };
    return { emo: '😢', label: 'Скучает и голоден' };
  }
  function setPetName(n) { s.petStats.name = String(n || '').slice(0, 16); save(); emit(); }
  function petStage(level) { return ['', 'Детёныш', 'Подросток', 'Особая форма'][level] || 'Детёныш'; }
  function feedPet() {
    const cost = 8;
    if (s.coins < cost) return { ok: false, need: cost - s.coins };
    s.coins -= cost;
    s.petStats.lastFed = todayKey();
    let leveledTo = null;
    if (s.petStats.level < 3) {
      s.petStats.growth += 1;
      if (s.petStats.growth >= petNeed(s.petStats.level)) { s.petStats.growth = 0; s.petStats.level++; leveledTo = s.petStats.level; }
    }
    save(); emit();
    return { ok: true, cost, leveledTo };
  }

  /* --- трекер настроения (1 запись в день) --- */
  function setMood(mood) {
    const today = todayKey();
    const ex = s.moods.find(m => m.date === today);
    if (ex) ex.mood = mood; else s.moods.unshift({ date: today, mood });
    save(); emit();
  }
  function moodToday() { const today = todayKey(); const m = s.moods.find(x => x.date === today); return m ? m.mood : null; }
  function moodOn(key) { const m = s.moods.find(x => x.date === key); return m ? m.mood : null; }

  /* --- дневник благодарности --- */
  function addGratitude(text) {
    const t = (text || '').trim(); if (!t) return null;
    s.gratitude.unshift({ id: uid(), date: todayKey(), text: t });
    bumpActivity(1);
    save(); emit();
    return true;
  }
  function delGratitude(id) { s.gratitude = s.gratitude.filter(x => x.id !== id); save(); emit(); }

  /* --- капсула времени --- */
  function addCapsule(text, days) {
    const t = (text || '').trim(); if (!t) return null;
    const now = Date.now();
    s.capsules.unshift({ id: uid(), created: now, openAt: now + days * 86400000, text: t, opened: false });
    save(); emit();
    return true;
  }
  function delCapsule(id) { s.capsules = s.capsules.filter(x => x.id !== id); save(); emit(); }
  // сколько капсул только что открылись (для уведомления)
  function unlockedCapsules() {
    const now = Date.now();
    let n = 0;
    s.capsules.forEach(c => { if (!c.opened && now >= c.openAt) { c.opened = true; n++; } });
    if (n) save();
    return n;
  }

  /* --- ежедневный стрик входов --- */
  function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d.getTime()); }
  function streakCheckin() {
    const today = todayKey();
    if (s.streak.last === today) return null;
    if (s.streak.last === yesterdayKey()) s.streak.count += 1; else s.streak.count = 1;
    s.streak.last = today;
    const coins = 10 + Math.min(s.streak.count, 10) * 3;
    reward(0, coins);
    save(); emit();
    return { count: s.streak.count, coins };
  }

  /* --- магазин --- */
  function owns(key) { return FREE_MODE || s.owned.includes(key); }
  function priceOf(key) { return PRICE[key] || 0; }
  function buy(key) {
    if (owns(key)) return { ok: true, already: true };
    const price = PRICE[key]; if (price == null) return { ok: false };
    if (s.coins < price) return { ok: false, need: price - s.coins };
    s.coins -= price; s.owned.push(key); save(); emit();
    return { ok: true, price };
  }
  function shopItems() { return SHOP.map(i => ({ ...i, owned: owns(i.key) })); }

  /* --- свои категории меню --- */
  function addCustomCat(name, items, glyph) {
    const id = 'c' + uid();
    s.customCats.push({ id, name: (name || 'Моя категория').slice(0, 24), glyph: glyph || '📁', items: Array.isArray(items) ? items.slice() : [] });
    save(); emit(); return id;
  }
  function updateCat(id, patch) {
    const c = s.customCats.find(x => x.id === id); if (!c) return;
    if (patch.name != null) c.name = String(patch.name).slice(0, 24);
    if (patch.glyph != null) c.glyph = patch.glyph;
    if (patch.pinned != null) c.pinned = !!patch.pinned;
    if (patch.items) c.items = patch.items.slice();
    save(); emit();
  }
  function delCat(id) { s.customCats = s.customCats.filter(x => x.id !== id); save(); emit(); }

  /* --- декор сцены --- */
  function decorList() { return DECOR.map(d => ({ ...d, owned: owns(d.key), placed: s.decor.includes(d.key) })); }
  function toggleDecor(key) {
    if (!owns(key)) return false;
    const i = s.decor.indexOf(key);
    if (i >= 0) s.decor.splice(i, 1); else s.decor.push(key);
    save(); emit();
    return true;
  }

  /* --- ежедневные квесты --- */
  const QUEST_DEFS = [
    { id: 'q_task', glyph: '📋', title: 'Выполни задачу', goal: 1, stat: 'tasksDone' },
    { id: 'q_habit', glyph: '🌱', title: 'Отметь привычку', goal: 1, stat: 'habitsDone' },
    { id: 'q_deed', glyph: '✨', title: 'Соверши доброе дело', goal: 1, stat: 'deeds' },
  ];
  function statVal(name) { return name === 'deeds' ? s.deeds.length : (s.stats[name] || 0); }
  function ensureQuests() {
    const today = todayKey();
    if (!s.quests || s.quests.date !== today) {
      const baseline = {}; QUEST_DEFS.forEach(q => baseline[q.stat] = statVal(q.stat));
      s.quests = { date: today, baseline, claimed: [] };
      save();
    }
    return s.quests;
  }
  function questProgress(q) { ensureQuests(); return Math.max(0, statVal(q.stat) - (s.quests.baseline[q.stat] || 0)); }
  function questList() {
    ensureQuests();
    return QUEST_DEFS.map(q => ({ ...q, progress: Math.min(q.goal, questProgress(q)), done: questProgress(q) >= q.goal, claimed: s.quests.claimed.includes(q.id) }));
  }
  function claimQuest(id) {
    ensureQuests();
    const q = QUEST_DEFS.find(x => x.id === id); if (!q) return null;
    if (s.quests.claimed.includes(id) || questProgress(q) < q.goal) return null;
    s.quests.claimed.push(id);
    const xp = 20, coins = 15; reward(xp, coins);
    save(); emit();
    return { xp, coins };
  }

  /* --- утилиты --- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayKey() { return dayKey(Date.now()); }
  function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

  function get() { return s; }
  function xpMax() { return xpForLevel(s.level); }

  return {
    get, save, onChange, emit, reward, setName, setLook, grantOwn, setScene, setLang, reset, replaceState, tutSeen, tutMark, tutReset, getSound, setSound, getTheme, setTheme, restore, addWish, updateWish, delWish, wishTotals,
    addTask, toggleTask, delTask, tasksForDate, taskDoneOn, weekdayOf,
    addHabit, markHabit, delHabit, habitDoneToday,
    addTxn, delTxn, balance, totals,
    addGoal, addToGoal, delGoal,
    karmaNeed, karmaNext, addDeed, delDeed, setFlag,
    pushAchievement, toggleWidget, hasWidget,
    streakCheckin, owns, priceOf, buy, shopItems, decorList, toggleDecor,
    addCustomCat, updateCat, delCat,
    questList, claimQuest, ensureQuests,
    activityFor, finishFocus,
    setMood, moodToday, moodOn, addGratitude, delGratitude,
    addCapsule, delCapsule, unlockedCapsules,
    feedPet, petNeed, petMood, petMoodFace, setPetName, petStage,
    xpMax, todayKey, dayKey,
  };
})();


/* ===== js/scene.js ===== */
/* ============================================================
   Пиксельная графика: персонаж, живая сцена, экран загрузки.
   Рисуем в маленький canvas и растягиваем CSS'ом (image-rendering:pixelated),
   чтобы получить чёткие крупные пиксели.
   ============================================================ */
const Scene = (() => {

  /* --- работа с цветом --- */
  function shade(col, amt) {
    let r, g, b;
    if (col[0] === '#') { const n = parseInt(col.slice(1), 16); r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255; }
    else { const m = col.match(/\d+/g) || [0, 0, 0]; r = +m[0]; g = +m[1]; b = +m[2]; }
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  /* ============================================================
     ОКРУЖЕНИЯ И ВРЕМЯ СУТОК
     Палитры подобраны так, чтобы легко привязать к реальному времени.
     ============================================================ */
  const PALETTES = {
    dawn:   { sky: ['#f8cda2', '#f6bda9', '#f2cabe', '#e2d2c6', '#cfe0dd'], grass: '#6ea85c', grassD: '#4f8a48', hill: '#8fc07a', mote: 'rgba(255,240,210,0.85)', wall: '#e7cba6', wallLo: '#caa079', floor: '#b98a5a', floorD: '#9a6f45', celest: '#ffd6a0', night: false, overlay: 'rgba(255,190,150,0.10)' },
    day:    { sky: ['#ffe0b0', '#ffd0a0', '#d8e6c0', '#bfe0d8', '#a9d7e8'], grass: '#6bab5b', grassD: '#4d8a46', hill: '#8fc27a', mote: 'rgba(255,255,220,0.75)', wall: '#ecd2a8', wallLo: '#cda67c', floor: '#bd8f5e', floorD: '#9c7146', celest: '#ffe9a0', night: false, overlay: null },
    sunset: { sky: ['#ffb070', '#ff8f5e', '#ef7d63', '#b06a83', '#5f5790'], grass: '#5f8a52', grassD: '#3f6a40', hill: '#6f9560', mote: 'rgba(255,215,175,0.85)', wall: '#dcae86', wallLo: '#b07d58', floor: '#a5744c', floorD: '#835a3a', celest: '#ff9a5a', night: false, overlay: 'rgba(255,120,80,0.12)' },
    night:  { sky: ['#10163a', '#171e46', '#202a58', '#2a3668', '#39466e'], grass: '#2f5a3f', grassD: '#204630', hill: '#274c39', mote: 'rgba(255,235,150,0.95)', wall: '#3a3358', wallLo: '#2a2542', floor: '#4a3a30', floorD: '#33271f', celest: '#eaf0ff', night: true, overlay: 'rgba(20,30,80,0.22)' },
  };

  function resolveTime(mode) {
    if (mode && mode !== 'auto') return mode;
    const hr = new Date().getHours();
    if (hr >= 5 && hr < 8) return 'dawn';
    if (hr >= 8 && hr < 17) return 'day';
    if (hr >= 17 && hr < 20) return 'sunset';
    return 'night';
  }

  function drawEnvironment(ctx, st, t) {
    const sc = (Game.get().scene) || { env: 'meadow', time: 'auto', season: 'auto' };
    const tod = resolveTime(sc.time);
    const P = PALETTES[tod] || PALETTES.day;
    st._tod = tod;
    const outdoor = sc.env !== 'room';
    if (sc.env === 'room') drawRoom(ctx, st, t, P, tod);
    else if (sc.env === 'park') drawPark(ctx, st, t, P, tod);
    else drawMeadow(ctx, st, t, P, tod);
    drawDecor(ctx, st, t, P);
    if (outdoor) {
      const season = resolveSeason(sc.season);
      drawHolidayProp(ctx, st, t);
      drawSeasonOverlay(ctx, st, t, season);
    }
    if (P.overlay) { ctx.fillStyle = P.overlay; ctx.fillRect(0, 0, st.W, st.H); }
  }

  /* --- декор сцены (мебель/растения/украшения из магазина) --- */
  const DECOR_DRAW = {
    'decor:room_shelf'(ctx, st, rc, night) {
      const x = Math.round(st.W * 0.8), y = Math.round(st.groundY - 42);
      rc(x, y, 26, 4, '#7a5334'); rc(x, y + 14, 26, 4, '#7a5334'); rc(x, y + 28, 26, 4, '#7a5334');
      rc(x, y, 2, 32, '#6b4a2f'); rc(x + 24, y, 2, 32, '#6b4a2f');
      const bk = ['#d96a5a', '#5b8fd0', '#e0b45a', '#7a5cc0', '#4a8f68'];
      for (let i = 0; i < 6; i++) { rc(x + 3 + i * 3.5, y - 8, 3, 8, bk[(i + Math.floor(x)) % bk.length]); rc(x + 3 + i * 3.5, y + 6, 3, 8, bk[(i + 2) % bk.length]); }
    },
    'decor:room_poster'(ctx, st, rc) {
      const x = Math.round(st.W * 0.16), y = 16;
      rc(x, y, 22, 28, '#6b4a2f'); rc(x + 2, y + 2, 18, 24, '#bfe0d8');
      rc(x + 5, y + 16, 12, 8, '#8fc27a'); rc(x + 13, y + 6, 4, 4, '#f6c453'); rc(x + 4, y + 10, 3, 3, '#fff');
    },
    'decor:room_lamp'(ctx, st, rc, night) {
      const x = Math.round(st.W * 0.9), gy = st.groundY;
      rc(x, gy - 30, 2, 30, '#5a4634'); rc(x - 4, gy - 1, 10, 2, '#5a4634');
      rc(x - 5, gy - 40, 12, 10, night ? '#ffe08a' : '#efe0b0');
      if (night) { ctx.fillStyle = 'rgba(255,220,140,0.25)'; ctx.fillRect(Math.round(x - 12), Math.round(gy - 46), 26, 24); }
    },
    'decor:room_plant'(ctx, st, rc) {
      const x = Math.round(st.W * 0.08), gy = st.groundY;
      rc(x, gy - 10, 12, 10, '#c07a4a'); rc(x, gy - 10, 12, 2, '#d68f5a');
      rc(x + 2, gy - 22, 4, 13, '#4d8a46'); rc(x - 3, gy - 18, 5, 7, '#5aa055'); rc(x + 8, gy - 20, 5, 9, '#4d8a46'); rc(x + 3, gy - 27, 4, 7, '#5aa055');
    },
    'decor:out_fence'(ctx, st, rc) {
      const gy = st.groundY, W = st.W;
      for (let x = 4; x < W; x += 12) { rc(x, gy - 10, 3, 10, '#a9784f'); rc(x, gy - 10, 3, 1, '#c0916a'); }
      rc(0, gy - 8, W, 2, '#8a5f3c'); rc(0, gy - 4, W, 2, '#8a5f3c');
    },
    'decor:out_lantern'(ctx, st, rc, night) {
      const x = Math.round(st.W * 0.13), gy = st.groundY;
      rc(x, gy - 16, 2, 16, '#3a3630'); rc(x - 3, gy - 22, 8, 7, '#3a3630');
      rc(x - 2, gy - 21, 6, 5, night ? '#ffcf6a' : '#cfe0dd');
      if (night) { ctx.fillStyle = 'rgba(255,200,110,0.28)'; ctx.fillRect(Math.round(x - 8), Math.round(gy - 27), 18, 16); }
    },
    'decor:out_flowers'(ctx, st, rc) {
      const x = Math.round(st.W * 0.84), gy = st.groundY;
      const pc = ['#f28ab5', '#ffd24a', '#c58ee0', '#ff9ec2'];
      for (let i = 0; i < 5; i++) {
        const fx = x + i * 4, fy = gy - 2 - (i % 2) * 2;
        rc(fx, fy - 1, 1, 4, '#4d8a46');
        rc(fx - 1, fy - 2, 1, 1, pc[i % 4]); rc(fx + 1, fy - 2, 1, 1, pc[i % 4]); rc(fx, fy - 3, 1, 1, pc[i % 4]); rc(fx, fy - 2, 1, 1, '#ffd24a');
      }
    },
    'decor:out_birdhouse'(ctx, st, rc) {
      const x = Math.round(st.W * 0.2), gy = st.groundY;
      rc(x, gy - 22, 2, 22, '#8a5f3c');
      rc(x - 4, gy - 32, 10, 8, '#c07a4a'); rc(x - 5, gy - 34, 12, 3, '#8a4632');
      rc(x, gy - 29, 2, 2, '#3a2418');
    },
    'decor:room_clock'(ctx, st, rc) {
      const x = Math.round(st.W * 0.86), y = 16;
      rc(x, y, 12, 12, '#7a5334'); rc(x + 1, y + 1, 10, 10, '#f0e6d0');
      rc(x + 5, y + 2, 1, 4, '#3a2a20'); rc(x + 6, y + 6, 3, 1, '#3a2a20'); rc(x + 5, y + 5, 1, 1, '#c0492f');
    },
    'decor:room_chair'(ctx, st, rc) {
      const x = Math.round(st.W * 0.82), gy = st.groundY, c = '#b06a72', cd = '#96545d';
      rc(x - 8, gy - 15, 16, 13, c); rc(x - 8, gy - 15, 16, 3, shade(c, 14));

    'decor:room_wallplants'(ctx, st, rc) {

    'decor:room_garland'(ctx, st, rc, night, t) {

      for (let x = 6; x < W - 6; x += 12) {
        const dip = Math.round(Math.sin(x * 0.4) * 2);
        rc(x, y + dip + 2, 2, 3, cols[(x / 12) % cols.length]);
        const glow = night && ((Math.floor(t / 20) + x) % 2 === 0);
        if (glow) rc(x - 1, y + dip + 1, 4, 5, 'rgba(255,220,140,0.35)');
      }
      // провод
      for (let x = 0; x < W; x++) { const dip = Math.round(Math.sin(x * 0.4) * 2); rc(x, y + dip, 1, 1, '#3a3630'); }
    },
    'decor:room_fireplace'(ctx, st, rc, night, t) {
      const x = Math.round(st.W * 0.82), gy = st.groundY;
      rc(x - 10, gy - 16, 20, 16, '#8a5f3c'); rc(x - 10, gy - 16, 20, 2, '#a5744a'); // кирпич
      for (let i = 0; i < 3; i++) rc(x - 10, gy - 12 + i * 5, 20, 1, '#6b4a2f');
      rc(x - 6, gy - 10, 12, 10, '#2a2018'); // топка
      // огонь (мерцает)
      const f = (Math.floor(t / 8) % 2);
      rc(x - 3, gy - 6 - f, 6, 6 + f, '#e0603a');
      rc(x - 2, gy - 8 - f, 4, 5 + f, '#f6a83a');
