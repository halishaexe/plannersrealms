<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Planners Realms</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Пиксельные шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
/* ============================================================
   PixelQuest — cozy pixel-art RPG productivity mini app
   Палитра: тёплый рассвет над поляной
   ============================================================ */
:root {
  /* дерево / панели интерфейса */
  --wood-dark:   #3b2a1c;
  --wood:        #6b4a2f;
  --wood-light:  #8a6240;
  --parchment:   #f6e6c4;
  --parchment-2: #ecd6a8;
  --ink:         #3a2b1c;
  --ink-soft:    #7a5c3e;

  /* небо / природа */
  --sky-top:     #ffd9a0;
  --sky-mid:     #a9d7e8;
  --grass:       #6bab5b;
  --grass-dark:  #4d8a46;

  /* акценты игры */
  --gold:        #f6c453;
  --gold-deep:   #d9982f;
  --xp:          #7bd06a;
  --xp-deep:     #4fa649;
  --coin:        #ffcf5c;
  --danger:      #d96a5a;
  --danger-deep: #b04434;
  --blue:        #5b8fd0;

  --shadow:      rgba(59, 42, 28, 0.35);

  /* безопасные зоны Telegram */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tg-top: 0px; /* задаётся из JS (высота хедера Telegram) */
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Pixelify Sans', system-ui, sans-serif;
  color: var(--ink);
  background: #2a1f16;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.screen { position: fixed; inset: 0; }
.hidden { display: none !important; }

/* ============================================================
   ЭКРАН ЗАГРУЗКИ
   ============================================================ */
.loading-screen { z-index: 100; overflow: hidden; }
#loadingCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.loading-ui {
  position: absolute;
  left: 0; right: 0; bottom: 18%;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 0 32px;
}

.logo { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.logo-pixel {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(18px, 7.5vw, 30px); color: var(--parchment);
  text-shadow: 0 3px 0 var(--wood-dark), 0 4px 0 var(--wood-dark);
  letter-spacing: 1px;
}
.logo-quest {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(14px, 5.5vw, 22px); color: var(--gold);
  text-shadow: 0 3px 0 var(--gold-deep);
  letter-spacing: 5px; margin-top: 10px;
}

.loadbar {
  width: min(280px, 78vw); height: 20px;
  background: var(--wood-dark);
  border: 3px solid var(--wood-light);
  box-shadow: 0 0 0 3px var(--wood-dark), 4px 4px 0 var(--shadow);
  padding: 3px; position: relative;
}
.loadbar-fill {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, var(--gold) 0 8px, var(--gold-deep) 8px 10px);
  transition: width 0.25s steps(6);
}
.loading-tip {
  font-size: 16px; color: var(--parchment);
  text-shadow: 0 2px 0 var(--wood-dark);
  min-height: 20px;
}

/* ============================================================
   ГЛАВНЫЙ ЭКРАН
   ============================================================ */
.hub-screen { z-index: 10; }
#sceneCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* --- Верхняя панель --- */
.top-panel {
  position: absolute;
  top: calc(var(--safe-top) + var(--tg-top) + 8px);
  left: 8px; right: 8px;
  display: flex; align-items: flex-start; gap: 8px;
  z-index: 5;
}

.pixel-panel, .player-card, .coin-badge, .icon-btn {
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 3px 3px 0 var(--shadow);
}

.player-card {
  flex: 1; display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 6px 6px; text-align: left; min-width: 0;
  transition: transform 0.08s;
}
.player-card:active { transform: translate(1px, 1px); }

.avatar-frame {
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--sky-mid);
  border: 3px solid var(--gold-deep);
  box-shadow: inset 0 0 0 2px var(--gold);
  display: grid; place-items: center; overflow: hidden;
}
#avatarCanvas { width: 34px; height: 34px; }

.player-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.player-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.player-name {
  font-weight: 600; font-size: 16px; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-level {
  font-size: 12px; color: var(--parchment);
  background: var(--wood); padding: 1px 6px;
  border: 2px solid var(--wood-dark); flex-shrink: 0;
}

.xp-bar {
  position: relative; height: 14px;
  background: var(--wood-dark);
  border: 2px solid var(--wood-light);
  overflow: hidden;
}
.xp-fill {
  height: 100%; width: 0%;
  background: linear-gradient(var(--xp), var(--xp-deep));
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
  transition: width 0.6s cubic-bezier(.5,0,.2,1);
}
.xp-text {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10px; color: #fff; text-shadow: 0 1px 0 var(--wood-dark);
}

.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: grid; place-items: center;
  transition: transform 0.08s;
}
.icon-btn:active { transform: translate(1px, 1px); }
.pix-icon { font-size: 22px; color: var(--gold-deep); }

.coin-badge {
  position: absolute; top: 52px; right: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 7px; font-size: 15px; font-weight: 600;
}
.coin-icon { color: var(--gold-deep); font-size: 15px; }

/* --- Реплика персонажа --- */
.speech-bubble {
  position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
  background: var(--parchment); border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 3px 3px 0 var(--shadow);
  padding: 6px 12px; font-size: 15px; z-index: 4;
  max-width: 70vw; text-align: center;
  animation: popIn 0.25s cubic-bezier(.3,1.4,.5,1);
}
.speech-bubble::after {
  content: ''; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border: 6px solid transparent;
  border-top-color: var(--wood-dark);
}

/* --- Нижняя навигация --- */
.bottom-nav {
  position: absolute; left: 0; right: 0;
  bottom: 0;
  padding: 10px 12px calc(10px + var(--safe-bottom));
  display: flex; align-items: flex-end; justify-content: space-around; gap: 8px;
  background: linear-gradient(var(--wood) , var(--wood-dark));
  border-top: 4px solid var(--wood-dark);
  box-shadow: 0 -3px 0 var(--wood-light) inset;
  z-index: 6;
}
.nav-btn {
  flex: 1; max-width: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 0 4px 0 var(--wood-dark);
  transition: transform 0.08s, box-shadow 0.08s;
}
.nav-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px var(--parchment-2), 0 1px 0 var(--wood-dark); }
.nav-btn--center {
  transform: translateY(-8px);
  background: var(--gold);
  box-shadow: inset 0 0 0 2px #ffe28a, 0 5px 0 var(--gold-deep);
}
.nav-btn--center:active { transform: translateY(-4px); box-shadow: inset 0 0 0 2px #ffe28a, 0 1px 0 var(--gold-deep); }
.nav-glyph { font-size: 24px; line-height: 1; color: var(--wood-dark); }
.nav-btn--center .nav-glyph { color: var(--wood-dark); }
.nav-label { font-size: 12px; font-weight: 600; color: var(--ink); }
.nav-btn--active { outline: 0; }
.nav-btn--active .nav-glyph { color: var(--gold-deep); }

/* ============================================================
   МОДАЛЬНЫЕ ОКНА / РАЗДЕЛЫ
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(35, 25, 16, 0.55);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.overlay.closing { animation: fadeOut 0.2s ease forwards; }

.sheet {
  width: 100%; max-width: 560px; max-height: 92vh;
  background: var(--parchment);
  border: 4px solid var(--wood-dark);
  border-bottom: none;
  box-shadow: inset 0 0 0 3px var(--parchment-2), 0 -4px 0 var(--shadow);
  display: flex; flex-direction: column;
  animation: slideUp 0.3s cubic-bezier(.2,1,.3,1);
  padding-bottom: var(--safe-bottom);
}
.overlay.closing .sheet { animation: slideDown 0.25s ease forwards; }

.sheet-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 12px;
  border-bottom: 3px solid var(--wood-dark);
  background: linear-gradient(var(--parchment), var(--parchment-2));
}
.sheet-title { font-size: 22px; font-weight: 700; flex: 1; }
.sheet-title .th-glyph { margin-right: 8px; color: var(--gold-deep); }
.sheet-close {
  width: 36px; height: 36px; display: grid; place-items: center;
  font-size: 20px; font-weight: 700;
  background: var(--danger); color: #fff;
  border: 3px solid var(--danger-deep);
  box-shadow: 0 3px 0 var(--danger-deep);
  transition: transform 0.08s;
}
.sheet-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--danger-deep); }

.sheet-body { padding: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* --- Сетка меню --- */
.menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.menu-tile {
  aspect-ratio: 1 / 0.82;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 0 5px 0 var(--wood);
  transition: transform 0.08s, box-shadow 0.08s;
  position: relative;
}
.menu-tile:active { transform: translateY(4px); box-shadow: inset 0 0 0 2px var(--parchment-2), 0 1px 0 var(--wood); }
.menu-tile .tile-glyph { font-size: 36px; }
.menu-tile .tile-label { font-size: 15px; font-weight: 600; }
.menu-tile--soon { opacity: 0.7; }
.tile-badge {
  position: absolute; top: 6px; right: 6px; font-size: 9px;
  background: var(--blue); color: #fff; padding: 1px 5px; border: 2px solid #3d6ba8;
}

/* --- Общие элементы разделов --- */
.section-hint { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }

.add-row { display: flex; gap: 8px; margin-bottom: 14px; }
.pix-input, .pix-select {
  flex: 1; min-width: 0; padding: 10px; font-family: inherit; font-size: 15px;
  color: var(--ink); background: #fff;
  border: 3px solid var(--wood-dark);
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
}
.pix-input:focus, .pix-select:focus { outline: 3px solid var(--gold); }
.btn {
  padding: 10px 16px; font-size: 15px; font-weight: 600; color: var(--ink);
  background: var(--gold); border: 3px solid var(--gold-deep);
  box-shadow: 0 4px 0 var(--gold-deep); transition: transform 0.08s, box-shadow 0.08s;
  white-space: nowrap;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn--wide { width: 100%; }
.btn--ghost { background: var(--parchment); border-color: var(--wood-dark); box-shadow: 0 4px 0 var(--wood); }
.btn--ghost:active { box-shadow: 0 1px 0 var(--wood); }
.btn--danger { background: var(--danger); color: #fff; border-color: var(--danger-deep); box-shadow: 0 4px 0 var(--danger-deep); }

/* список задач/привычек */
.list { display: flex; flex-direction: column; gap: 10px; }
.card-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: #fff; border: 3px solid var(--wood-dark);
  box-shadow: 2px 2px 0 var(--shadow);
}
.card-row.done { opacity: 0.55; }
.card-row.done .row-title { text-decoration: line-through; }
.row-check {
  width: 30px; height: 30px; flex-shrink: 0;
  border: 3px solid var(--wood-dark); background: var(--parchment);
  display: grid; place-items: center; font-size: 18px; color: var(--xp-deep);
}
.row-check.checked { background: var(--xp); color: #fff; }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 12px; color: var(--ink-soft); }
.row-reward { font-size: 12px; color: var(--gold-deep); font-weight: 600; flex-shrink: 0; }
.row-del {
  width: 28px; height: 28px; flex-shrink: 0; font-size: 16px;
  background: transparent; color: var(--danger); border: 2px solid transparent;
}
.row-del:active { color: var(--danger-deep); }

.empty {
  text-align: center; padding: 30px 16px; color: var(--ink-soft);
}
.empty .empty-glyph { font-size: 44px; display: block; margin-bottom: 8px; }

/* привычки / стрик */
.streak-pill { font-size: 12px; color: var(--gold-deep); font-weight: 700; }

/* финансы */
.wallet-summary {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.wallet-card {
  flex: 1; padding: 12px; text-align: center;
  background: #fff; border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.wallet-card .wc-label { font-size: 12px; color: var(--ink-soft); }
.wallet-card .wc-value { font-size: 20px; font-weight: 700; margin-top: 2px; }
.wc-value.pos { color: var(--xp-deep); }
.wc-value.neg { color: var(--danger-deep); }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab {
  flex: 1; padding: 8px; text-align: center; font-weight: 600; font-size: 14px;
  background: var(--parchment); border: 3px solid var(--wood-dark);
  box-shadow: 0 3px 0 var(--wood);
}
.tab.active { background: var(--gold); box-shadow: 0 3px 0 var(--gold-deep); }

/* календарь */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px;
  background: var(--parchment); border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); }
.cal-month { font-size: 18px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 2px 0; }
.cal-cell {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 14px; background: #fff; border: 2px solid var(--wood-light); position: relative;
}
.cal-cell.blank { background: transparent; border: none; }
.cal-cell.today { background: var(--gold); border-color: var(--gold-deep); font-weight: 700; }
.cal-dot { width: 5px; height: 5px; background: var(--danger); margin-top: 2px; }
.cal-cell.sel { outline: 3px solid var(--gold-deep); outline-offset: -1px; }
.cal-cell { cursor: pointer; }

/* поля времени в задачах */
.time-row { align-items: center; gap: 6px; }
.time-in { flex: 1; min-width: 0; }
.field-lbl { font-size: 18px; flex-shrink: 0; }
.dash { font-weight: 700; color: var(--ink-soft); flex-shrink: 0; }

/* повтор по дням */
.repeat-btn.active { background: var(--gold); border-color: var(--gold-deep); box-shadow: 0 4px 0 var(--gold-deep); }
.chip-preset {
  padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink);
  background: var(--parchment); border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood); white-space: nowrap;
}
.day-chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.day-chip {
  width: 40px; height: 38px; font-size: 14px; font-weight: 700; color: var(--ink-soft);
  background: #fff; border: 3px solid var(--wood-dark); box-shadow: 0 3px 0 var(--wood);
}
.day-chip.on { background: var(--xp); color: #fff; border-color: var(--xp-deep); box-shadow: 0 3px 0 var(--xp-deep); }

/* мета-строка задачи (время/повтор/дата) */
.row-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.meta-pill {
  font-size: 11px; font-weight: 600; color: var(--ink-soft);
  background: var(--parchment-2); border: 2px solid var(--wood-light); padding: 0 5px;
}
.meta-pill.repeat { color: #fff; background: var(--blue); border-color: #3d6ba8; }

/* панель выбранного дня в календаре */
.cal-day { margin-top: 14px; border-top: 3px dashed var(--wood-light); padding-top: 12px; }
.cal-day-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.row-check.locked { opacity: 0.5; cursor: default; }

/* статистика */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-card {
  padding: 14px; text-align: center; background: #fff;
  border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.stat-card .st-glyph { font-size: 26px; }
.stat-card .st-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-card .st-label { font-size: 12px; color: var(--ink-soft); }

/* кастомизация */
.custom-preview {
  display: grid; place-items: center; padding: 16px;
  background: var(--sky-mid); border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2); margin-bottom: 14px;
}
#customCanvas { width: 120px; height: 120px; }
.custom-group { margin-bottom: 14px; }
.custom-group h4 { font-size: 15px; margin-bottom: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 36px; height: 36px; border: 3px solid var(--wood-dark);
  box-shadow: 2px 2px 0 var(--shadow); position: relative;
}
.swatch.selected { outline: 3px solid var(--gold); outline-offset: 1px; }
.swatch.opt {
  display: grid; place-items: center; font-size: 18px; background: var(--parchment);
  width: auto; padding: 6px 10px; font-weight: 600;
}

/* ============================================================
   ВИДЖЕТЫ ГЛАВНОГО ЭКРАНА
   ============================================================ */
.widget-layer {
  position: absolute; z-index: 3;
  top: calc(var(--safe-top) + var(--tg-top) + 92px);
  left: 8px; right: 8px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; pointer-events: none;
}
/* align-items: flex-start — чтобы карточки были по содержимому, а не растягивались в пустые полосы */
.widget-col { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 44%; }
.widget-col--right { align-items: flex-end; }
.widget {
  pointer-events: auto;
  display: flex; align-items: center; gap: 7px;
  padding: 5px 9px 5px 7px; text-align: left;
  background: var(--parchment);
  border: 3px solid var(--wood-dark);
  box-shadow: inset 0 0 0 2px var(--parchment-2), 2px 2px 0 var(--shadow);
  transition: transform 0.08s;
  max-width: 100%;
}
.widget:active { transform: translate(1px, 1px); }
.widget .w-glyph { font-size: 18px; flex-shrink: 0; }
.widget .w-main { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.widget .w-value { font-size: 15px; font-weight: 700; color: var(--ink); }
.widget .w-label {
  font-size: 10px; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px;
}

/* ============================================================
   КОПИЛКА
   ============================================================ */
.goal-card {
  padding: 12px; background: #fff;
  border: 3px solid var(--wood-dark); box-shadow: 2px 2px 0 var(--shadow);
}
.goal-card.done { background: var(--parchment); border-color: var(--gold-deep); }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.goal-name { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.goal-bar {
  position: relative; height: 18px; margin-bottom: 6px;
  background: var(--wood-dark); border: 2px solid var(--wood-light); overflow: hidden;
}
.goal-fill {
  height: 100%; width: 0%;
  background: repeating-linear-gradient(90deg, var(--xp) 0 8px, var(--xp-deep) 8px 10px);
  transition: width 0.5s cubic-bezier(.5,0,.2,1);
}
.goal-pct {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--wood-dark);
}
.goal-meta { font-size: 13px; color: var(--ink-soft); }

/* ===== js/telegram.js ===== */
/* ============================================================
   Обёртка над Telegram WebApp SDK.
   Всё работает и вне Telegram (для локальной разработки) —
   тогда используются заглушки.
   ============================================================ */
const TG = (() => {
  const wa = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const inside = !!(wa && wa.initData !== undefined && wa.platform && wa.platform !== 'unknown');

  function init() {
    if (!wa) return;
    try {
      wa.ready();
      wa.expand();
      // современные версии умеют fullscreen
      if (typeof wa.requestFullscreen === 'function' && wa.isVersionAtLeast && wa.isVersionAtLeast('8.0')) {
        try { wa.requestFullscreen(); } catch (e) {}
      }
      if (typeof wa.disableVerticalSwipes === 'function') wa.disableVerticalSwipes();
      wa.setHeaderColor && wa.setHeaderColor('#3b2a1c');
      wa.setBackgroundColor && wa.setBackgroundColor('#2a1f16');

      // высота системной шапки Telegram → в CSS-переменную
      applyInsets();
      wa.onEvent && wa.onEvent('viewportChanged', applyInsets);
      wa.onEvent && wa.onEvent('safeAreaChanged', applyInsets);
    } catch (e) { console.warn('TG init', e); }
  }

  function applyInsets() {
    let top = 0;
    if (wa && wa.safeAreaInset) top = wa.safeAreaInset.top || 0;
    if (wa && wa.contentSafeAreaInset) top += wa.contentSafeAreaInset.top || 0;
    document.documentElement.style.setProperty('--tg-top', top + 'px');
  }

  function haptic(type = 'light') {
    if (!wa || !wa.HapticFeedback) return;
    try {
      if (type === 'success' || type === 'error' || type === 'warning') {
        wa.HapticFeedback.notificationOccurred(type);
      } else {
        wa.HapticFeedback.impactOccurred(type); // light | medium | heavy | rigid | soft
      }
    } catch (e) {}
  }

  function showBack(cb) {
    if (!wa || !wa.BackButton) return;
    try {
      wa.BackButton.show();
      wa.BackButton.onClick(cb);
    } catch (e) {}
  }
  function hideBack(cb) {
    if (!wa || !wa.BackButton) return;
    try {
      cb && wa.BackButton.offClick(cb);
      wa.BackButton.hide();
    } catch (e) {}
  }

  function user() {
    try {
      const u = wa && wa.initDataUnsafe && wa.initDataUnsafe.user;
      if (u) return { id: u.id, name: u.first_name || u.username || 'Герой' };
    } catch (e) {}
    return null;
  }

  return { wa, inside, init, haptic, showBack, hideBack, user };
})();

/* ===== js/state.js ===== */
/* ============================================================
   Состояние игры + сохранение.
   Хранится в localStorage; при недоступности — в памяти.
   ============================================================ */
const Store = (() => {
  const KEY = 'pixelquest_save_v1';
  let mem = null; // фолбэк, если localStorage недоступен

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { if (mem) return mem; }
    return null;
  }
  function write(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { mem = data; }
  }
  return { read, write };
})();

const Game = (() => {
  const defaults = () => ({
    name: 'Герой',
    level: 1,
    xp: 0,
    coins: 0,
    look: {
      gender: 'm',         // m | f
      skin: '#f2c9a0',
      hair: '#6b4a2f',
      hairStyle: 'auto',   // auto | short | messy | long | ponytail | bun | buzz | curly
      shirt: '#4a8f68',
      accessory: 'none',   // none | hat | glasses | crown
      pet: 'none',         // none | slime | cat | bird | capybara
      frame: 'gold',       // gold | wood | leaf | royal
    },
    tasks: [],     // {id, title, reward, date, done}
    habits: [],    // {id, title, streak, lastDone}
    txns: [],      // {id, type:'income'|'expense', title, amount, date}
    goals: [],     // {id, name, target, saved, done}
    achievements: [], // {id, title, glyph, date}
    widgets: ['today', 'habits', 'goal'], // виджеты на главной
    scene: { env: 'meadow', time: 'auto' }, // локация + время суток (auto = по реальному времени)
    karma: { level: 0, progress: 0 },   // карма — доброта в реальной жизни
    deeds: [],                          // журнал добрых дел {id, text, date, karmaLevel}
    flags: { karmaIntro: false },       // показанные обучалки (легко расширять)
    lang: null,                         // null = язык ещё не выбран
    stats: { tasksDone: 0, habitsDone: 0, goalsDone: 0 },
    createdAt: Date.now(),
  });

  // мягкая миграция старых сохранений: добавляем недостающие поля
  function migrate(s) {
    const d = defaults();
    if (!s.look) s.look = {};
    for (const k in d.look) if (s.look[k] === undefined) s.look[k] = d.look[k];
    if (!Array.isArray(s.goals)) s.goals = [];
    if (!Array.isArray(s.achievements)) s.achievements = [];
    if (!Array.isArray(s.widgets)) s.widgets = d.widgets.slice();
    if (!s.scene) s.scene = { env: 'meadow', time: 'auto' };
    if (!s.scene.env) s.scene.env = 'meadow';
    if (!s.scene.time) s.scene.time = 'auto';
    if (!s.karma) s.karma = { level: 0, progress: 0 };
    if (typeof s.karma.level !== 'number') s.karma.level = 0;
    if (typeof s.karma.progress !== 'number') s.karma.progress = 0;
    if (!Array.isArray(s.deeds)) s.deeds = [];
    if (!s.flags) s.flags = { karmaIntro: false };
    if (!s.stats) s.stats = {};
    if (s.stats.tasksDone === undefined) s.stats.tasksDone = 0;
    if (s.stats.habitsDone === undefined) s.stats.habitsDone = 0;
    if (s.stats.goalsDone === undefined) s.stats.goalsDone = 0;
    return s;
  }

  let s = migrate(Store.read() || defaults());
  const listeners = [];

  function save() { Store.write(s); }
  function onChange(cb) { listeners.push(cb); }
  function emit() { listeners.forEach(cb => cb(s)); }

  function xpForLevel(lvl) { return 80 + lvl * 40; } // растущая планка

  // добавить опыт + монеты; возвращает {leveledTo|null}
  function reward(xp, coins) {
    let leveledTo = null;
    s.xp += xp;
    s.coins += coins;
    while (s.xp >= xpForLevel(s.level)) {
      s.xp -= xpForLevel(s.level);
      s.level += 1;
      leveledTo = s.level;
    }
    save(); emit();
    return { leveledTo };
  }

  function setName(n) { s.name = (n || 'Герой').slice(0, 16); save(); emit(); }
  function setLook(patch) { Object.assign(s.look, patch); save(); emit(); }
  function setScene(patch) { Object.assign(s.scene, patch); save(); emit(); }
  function setLang(l) { s.lang = (l === 'en') ? 'en' : 'ru'; save(); emit(); }
  function reset() {
    try { localStorage.removeItem('pixelquest_save_v1'); } catch (e) {}
    try { location.reload(); } catch (e) {}
  }

  /* --- задачи --- */
  // addTask(title, opts) где opts = {reward, date, time, days}
  // (совместимо со старым addTask(title, reward, date))
  function addTask(title, a, b) {
    if (!title || !title.trim()) return;
    let opts = {};
    if (typeof a === 'object' && a !== null) opts = a;
    else opts = { reward: a, date: b };
    const days = Array.isArray(opts.days) && opts.days.length ? opts.days.slice().sort() : null;
    s.tasks.push({
      id: uid(), title: title.trim(),
      reward: opts.reward || 15,
      date: days ? null : (opts.date || null),
      time: opts.time || null,     // 'HH:MM-HH:MM' | 'HH:MM' | null
      days,                        // [1..7] Пн..Вс | null (еженедельная)
      done: false, lastDone: null,
    });
    save(); emit();
  }
  function toggleTask(id) {
    const t = s.tasks.find(x => x.id === id);
    if (!t) return null;
    if (t.days) {
      // еженедельная — отмечаем выполнение на сегодня (награда раз в день)
      const today = todayKey();
      if (t.lastDone === today) { t.lastDone = null; save(); emit(); return null; } // снять отметку
      t.lastDone = today; s.stats.tasksDone++;
      const res = reward(t.reward, Math.ceil(t.reward / 3));
      save(); emit(); return res;
    }
    t.done = !t.done;
    let res = null;
    if (t.done) { s.stats.tasksDone++; res = reward(t.reward, Math.ceil(t.reward / 3)); }
    save(); emit();
    return t.done ? res : null;
  }
  function delTask(id) { s.tasks = s.tasks.filter(x => x.id !== id); save(); emit(); }

  // Пн=1 .. Вс=7
  function weekdayOf(key) { const [y, m, d] = key.split('-').map(Number); const jd = new Date(y, m - 1, d).getDay(); return ((jd + 6) % 7) + 1; }
  function taskDoneOn(t, key) { return t.days ? (t.lastDone === key) : !!t.done; }
  function tasksForDate(key) {
    const wd = weekdayOf(key);
    return s.tasks.filter(t => (t.days ? t.days.includes(wd) : t.date === key));
  }

  /* --- привычки --- */
  function addHabit(title) {
    if (!title || !title.trim()) return;
    s.habits.push({ id: uid(), title: title.trim(), streak: 0, lastDone: null });
    save(); emit();
  }
  function markHabit(id) {
    const h = s.habits.find(x => x.id === id);
    if (!h) return null;
    const today = todayKey();
    if (h.lastDone === today) return null; // уже сегодня
    const yest = dayKey(Date.now() - 864e5);
    h.streak = h.lastDone === yest ? h.streak + 1 : 1;
    h.lastDone = today;
    s.stats.habitsDone++;
    const bonus = Math.min(h.streak, 7);
    const res = reward(10 + bonus * 2, 3 + bonus);
    save(); emit();
    return res;
  }
  function delHabit(id) { s.habits = s.habits.filter(x => x.id !== id); save(); emit(); }
  function habitDoneToday(h) { return h.lastDone === todayKey(); }

  /* --- финансы --- */
  function addTxn(type, title, amount, date) {
    const a = parseFloat(amount);
    if (!title || !title.trim() || isNaN(a) || a <= 0) return;
    s.txns.push({ id: uid(), type, title: title.trim(), amount: a, date: date || todayKey() });
    save(); emit();
  }
  function delTxn(id) { s.txns = s.txns.filter(x => x.id !== id); save(); emit(); }
  function balance() {
    return s.txns.reduce((sum, t) => sum + (t.type === 'income' ? t.amount : -t.amount), 0);
  }
  function totals() {
    let inc = 0, exp = 0;
    s.txns.forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount);
    return { inc, exp };
  }

  /* --- копилка (цели по накоплениям) --- */
  function addGoal(name, target, note) {
    const t = parseFloat(target);
    if (!name || !name.trim() || isNaN(t) || t <= 0) return;
    s.goals.push({ id: uid(), name: name.trim(), target: t, saved: 0, note: (note || '').trim(), done: false, createdAt: Date.now() });
    save(); emit();
  }
  function addToGoal(id, amount) {
    const g = s.goals.find(x => x.id === id);
    if (!g || g.done) return null;
    const a = parseFloat(amount);
    if (isNaN(a) || a <= 0) return null;
    g.saved += a;
    let completed = null;
    if (g.saved >= g.target) {
      g.saved = g.target; g.done = true;
      s.stats.goalsDone++;
      // игровая награда за достижение цели
      const bonusXp = 120, bonusCoins = 80;
      const res = reward(bonusXp, bonusCoins);
      const ach = pushAchievement('🎯', `Цель достигнута: ${g.name}`);
      completed = { goal: g, xp: bonusXp, coins: bonusCoins, res, ach };
    }
    save(); emit();
    return completed;
  }
  function delGoal(id) { s.goals = s.goals.filter(x => x.id !== id); save(); emit(); }

  /* --- карма (доброта в реальной жизни) --- */
  // сколько добрых дел нужно, чтобы достичь уровня n (1-based)
  function karmaNeed(n) {
    const table = [3, 5, 7, 10, 15];
    if (n <= 0) return table[0];
    if (n <= table.length) return table[n - 1];
    return 15 + (n - 5) * 6; // дальше плавно растёт
  }
  function karmaNext() { return karmaNeed(s.karma.level + 1); }
  function addDeed(text) {
    const t = (text || '').trim();
    if (!t) return null;
    s.deeds.unshift({ id: uid(), text: t, date: todayKey(), karmaLevel: s.karma.level });
    s.karma.progress++;
    let leveled = null;
    const need = karmaNeed(s.karma.level + 1);
    if (s.karma.progress >= need) {
      s.karma.progress = 0; s.karma.level++;
      const xp = 30 + s.karma.level * 20, coins = 20 + s.karma.level * 15; // награда растёт с уровнем
      const res = reward(xp, coins);
      pushAchievement('✨', `Карма ур. ${s.karma.level}`);
      leveled = { level: s.karma.level, xp, coins, res };
    }
    save(); emit();
    return leveled;
  }
  function delDeed(id) { s.deeds = s.deeds.filter(d => d.id !== id); save(); emit(); }
  function setFlag(k, v) { s.flags[k] = v; save(); emit(); }

  /* --- достижения --- */
  function pushAchievement(glyph, title) {
    const a = { id: uid(), glyph, title, date: todayKey() };
    s.achievements.unshift(a);
    return a;
  }

  /* --- виджеты главной --- */
  function toggleWidget(id) {
    const i = s.widgets.indexOf(id);
    if (i >= 0) s.widgets.splice(i, 1); else s.widgets.push(id);
    save(); emit();
  }
  function hasWidget(id) { return s.widgets.includes(id); }

  /* --- утилиты --- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayKey() { return dayKey(Date.now()); }
  function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

  function get() { return s; }
  function xpMax() { return xpForLevel(s.level); }

  return {
    get, save, onChange, emit, reward, setName, setLook, setScene, setLang, reset,
    addTask, toggleTask, delTask, tasksForDate, taskDoneOn, weekdayOf,
    addHabit, markHabit, delHabit, habitDoneToday,
    addTxn, delTxn, balance, totals,
    addGoal, addToGoal, delGoal,
    karmaNeed, karmaNext, addDeed, delDeed, setFlag,
    pushAchievement, toggleWidget, hasWidget,
    xpMax, todayKey, dayKey,
  };
})();


/* ===== js/scene.js ===== */
/* ============================================================
   Пиксельная графика: персонаж, живая сцена, экран загрузки.
   Рисуем в маленький canvas и растягиваем CSS'ом (image-rendering:pixelated),
   чтобы получить чёткие крупные пиксели.
   ============================================================ */
const Scene = (() => {

  /* --- работа с цветом --- */
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  /* ============================================================
     ОКРУЖЕНИЯ И ВРЕМЯ СУТОК
     Палитры подобраны так, чтобы легко привязать к реальному времени.
     ============================================================ */
  const PALETTES = {
    dawn:   { sky: ['#f8cda2', '#f6bda9', '#f2cabe', '#e2d2c6', '#cfe0dd'], grass: '#6ea85c', grassD: '#4f8a48', hill: '#8fc07a', mote: 'rgba(255,240,210,0.85)', wall: '#e7cba6', wallLo: '#caa079', floor: '#b98a5a', floorD: '#9a6f45', celest: '#ffd6a0', night: false, overlay: 'rgba(255,190,150,0.10)' },
    day:    { sky: ['#ffe0b0', '#ffd0a0', '#d8e6c0', '#bfe0d8', '#a9d7e8'], grass: '#6bab5b', grassD: '#4d8a46', hill: '#8fc27a', mote: 'rgba(255,255,220,0.75)', wall: '#ecd2a8', wallLo: '#cda67c', floor: '#bd8f5e', floorD: '#9c7146', celest: '#ffe9a0', night: false, overlay: null },
    sunset: { sky: ['#ffb070', '#ff8f5e', '#ef7d63', '#b06a83', '#5f5790'], grass: '#5f8a52', grassD: '#3f6a40', hill: '#6f9560', mote: 'rgba(255,215,175,0.85)', wall: '#dcae86', wallLo: '#b07d58', floor: '#a5744c', floorD: '#835a3a', celest: '#ff9a5a', night: false, overlay: 'rgba(255,120,80,0.12)' },
    night:  { sky: ['#10163a', '#171e46', '#202a58', '#2a3668', '#39466e'], grass: '#2f5a3f', grassD: '#204630', hill: '#274c39', mote: 'rgba(255,235,150,0.95)', wall: '#3a3358', wallLo: '#2a2542', floor: '#4a3a30', floorD: '#33271f', celest: '#eaf0ff', night: true, overlay: 'rgba(20,30,80,0.22)' },
  };

  function resolveTime(mode) {
    if (mode && mode !== 'auto') return mode;
    const hr = new Date().getHours();
    if (hr >= 5 && hr < 8) return 'dawn';
    if (hr >= 8 && hr < 17) return 'day';
    if (hr >= 17 && hr < 20) return 'sunset';
    return 'night';
  }

  function drawEnvironment(ctx, st, t) {
    const sc = (Game.get().scene) || { env: 'meadow', time: 'auto' };
    const tod = resolveTime(sc.time);
    const P = PALETTES[tod] || PALETTES.day;
    st._tod = tod;
    if (sc.env === 'room') drawRoom(ctx, st, t, P, tod);
    else drawMeadow(ctx, st, t, P, tod);
    if (P.overlay) { ctx.fillStyle = P.overlay; ctx.fillRect(0, 0, st.W, st.H); }
  }

  function ensureStars(st) {
    if (st._stars && st._starsW === st.W) return;
    st._starsW = st.W;
    st._stars = Array.from({ length: 26 }, () => ({
      x: Math.random() * st.W, y: Math.random() * st.groundY * 0.8, ph: Math.random() * 6,
    }));
  }

  function drawCelestial(ctx, st, t, P, cx, cy) {
    if (P.night) {
      // луна
      ctx.fillStyle = 'rgba(240,245,255,0.35)'; ctx.fillRect(cx - 3, cy - 3, 20, 20);
      ctx.fillStyle = P.celest; ctx.fillRect(cx, cy, 14, 14);
      ctx.fillStyle = 'rgba(200,210,235,0.6)'; ctx.fillRect(cx + 9, cy + 2, 4, 4); ctx.fillRect(cx + 4, cy + 8, 3, 3);
    } else {
      const glow = 0.45 + Math.sin(t / 60) * 0.1;
      ctx.fillStyle = `rgba(255,240,190,${glow})`; ctx.fillRect(cx - 4, cy - 4, 24, 24);
      ctx.fillStyle = P.celest; ctx.fillRect(cx, cy, 15, 15);
    }
  }

  function drawMeadow(ctx, st, t, P, tod) {
    // небо
    const bh = st.groundY / P.sky.length;
    P.sky.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, Math.floor(i * bh), st.W, Math.ceil(bh) + 1); });
    // светило (справа сверху)
    drawCelestial(ctx, st, t, P, st.W - 34, 12);
    // звёзды ночью
    if (P.night) {
      ensureStars(st);
      st._stars.forEach(s => {
        s.ph += 0.04;
        const a = 0.4 + Math.abs(Math.sin(s.ph)) * 0.6;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
      });
    } else {
      // облака (днём)
      st.clouds.forEach(cl => { cl.x += cl.sp; if (cl.x > st.W + 20) cl.x = -20; drawCloud(ctx, Math.round(cl.x), Math.round(cl.y), cl.s); });
    }
    // холмы
    ctx.fillStyle = P.hill;
    const hy = st.groundY - 10;
    for (let x = 0; x < st.W; x += 24) { const hh = 8 + ((x / 24) % 2) * 4; ctx.fillRect(x, hy - hh + 10, 24, hh); }
    ctx.fillStyle = P.grassD; ctx.fillRect(0, hy + 4, st.W, 6);
    // земля
    ctx.fillStyle = P.grass; ctx.fillRect(0, st.groundY, st.W, st.H - st.groundY);
    ctx.fillStyle = shade(P.grass, -14); ctx.fillRect(0, st.groundY, st.W, 3);
    ctx.fillStyle = P.grassD; ctx.fillRect(0, st.H - 6, st.W, 6);
    // травинки
    ctx.fillStyle = P.grassD;
    for (let i = 0; i < 14; i++) {
      const gx = (i * 9 + 4) % st.W; const sway = Math.round(Math.sin(t / 40 + i) * 1);
      ctx.fillRect(gx + sway, st.groundY - 3, 1, 3); ctx.fillRect(gx + 3 - sway, st.groundY - 2, 1, 2);
    }
    // частицы / светлячки
    st.motes.forEach(m => {
      m.x += m.sp; m.ph += 0.05; if (m.x > st.W) m.x = 0;
      const fy = m.y + Math.sin(m.ph) * 3;
      if (P.night) { const a = 0.3 + Math.abs(Math.sin(m.ph)) * 0.7; ctx.fillStyle = `rgba(255,235,140,${a})`; ctx.fillRect(Math.round(m.x), Math.round(fy), 1, 1); }
      else { ctx.fillStyle = P.mote; ctx.fillRect(Math.round(m.x), Math.round(fy), 1, 1); }
    });
    // бабочка (день/рассвет)
    if (!P.night && tod !== 'sunset') {
      st.butterflies.forEach(b => {
        b.t += 0.02; b.x = st.W * 0.5 + Math.sin(b.t) * st.W * 0.35; b.y = st.groundY - 34 + Math.cos(b.t * 1.6) * 12;
        const flap = Math.sin(t / 4) > 0; ctx.fillStyle = '#e88ac0';
        if (flap) { ctx.fillRect(b.x - 2, b.y, 2, 2); ctx.fillRect(b.x + 1, b.y, 2, 2); }
        else { ctx.fillRect(b.x - 1, b.y, 1, 2); ctx.fillRect(b.x + 1, b.y, 1, 2); }
        ctx.fillStyle = '#2a2018'; ctx.fillRect(b.x, b.y, 1, 2);
      });
    }
  }

  function drawRoom(ctx, st, t, P, tod) {
    const W = st.W, H = st.H, floorY = st.groundY;
    const night = P.night;
    const rc = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

    // ----- СТЕНА (тёплый градиент) -----
    const wall = night ? ['#5a4a63', '#514257', '#48394d'] : ['#f3cfac', '#eec09a', '#e6b48c'];
    const wbh = floorY / wall.length;
    wall.forEach((c, i) => rc(0, i * wbh, W, wbh + 1, c));
    // мягкое пятно света в центре
    ctx.fillStyle = night ? 'rgba(255,220,180,0.05)' : 'rgba(255,240,210,0.14)';
    ctx.fillRect(W * 0.5 - 34, 0, 68, floorY);

    // ----- ПОЛ (дерево) -----
    const floorC = night ? '#5a4634' : '#c78b54', floorD = shade(floorC, -16), floorL = shade(floorC, 14);
    rc(0, floorY, W, H - floorY, floorC);
    rc(0, floorY, W, 2, floorL);
    ctx.fillStyle = floorD;
    for (let x = -((t * 0) % 18); x < W; x += 18) ctx.fillRect(Math.round(x), floorY + 2, 1, H - floorY);
    // плинтус
    rc(0, floorY - 4, W, 4, night ? '#3f3348' : '#c98f63');
    rc(0, floorY - 4, W, 1, shade(night ? '#3f3348' : '#c98f63', 20));

    // ----- ОКНО (по центру сверху) -----
    const ww = Math.min(58, Math.round(W * 0.42)), wh = Math.min(46, Math.round(floorY * 0.62));
    const wx = Math.round(W / 2 - ww / 2), wy = 10;
    // рама
    rc(wx - 4, wy - 4, ww + 8, wh + 8, '#7a5334');
    rc(wx - 4, wy - 4, ww + 8, 2, '#9a6f45');
    // небо в окне
    const sbh = wh / P.sky.length;
    P.sky.forEach((c, i) => rc(wx, wy + i * sbh, ww, sbh + 1, c));
    // луна/солнце + звёзды
    drawCelestial(ctx, st, t, P, wx + ww - 20, wy + 5);
    if (night) {
      const stars = [[8, 10], [18, 6], [26, 16], [36, 9], [44, 20], [14, 24], [50, 12], [30, 28]];
      stars.forEach(([sxp, syp], i) => {
        if (sxp < ww - 2 && syp < wh - 2) {
          const a = 0.4 + Math.abs(Math.sin(t / 30 + i)) * 0.6;
          rc(wx + sxp, wy + syp, 1, 1, `rgba(255,255,255,${a})`);
        }
      });
    } else {
      // облачко
      rc(wx + 8, wy + 10, 14, 4, 'rgba(255,255,255,0.85)'); rc(wx + 11, wy + 7, 8, 3, 'rgba(255,255,255,0.85)');
    }
    // перекладины рамы
    rc(wx + ww / 2 - 1, wy, 2, wh, '#7a5334');
    rc(wx, wy + wh / 2 - 1, ww, 2, '#7a5334');
    rc(wx - 1, wy - 1, ww + 2, 1, '#8a6040');

    // ----- ГИРЛЯНДА (тёплые огоньки над окном) -----
    const lights = Math.floor(ww / 6) + 2;
    for (let i = 0; i <= lights; i++) {
      const lx = wx - 2 + (i / lights) * (ww + 4);
      const ly = wy - 3 + Math.sin(i * 0.9) * 2 + Math.sin(i) * 1;
      rc(lx, ly - 2, 1, 2, '#7a6a4a'); // проводок
      const tw = 0.55 + Math.abs(Math.sin(t / 22 + i * 1.3)) * 0.45;
      rc(lx - 0.5, ly, 2, 2, `rgba(255,208,120,${tw})`);
      ctx.fillStyle = `rgba(255,180,90,${tw * 0.4})`; ctx.fillRect(Math.round(lx - 1), Math.round(ly - 1), 4, 4);
    }

    // ----- ШТОРЫ (по бокам окна) -----
    const curt = night ? ['#b06a72', '#96545d'] : ['#e79aa2', '#d97f89'];
    function curtain(cxx, dir) {
      for (let f = 0; f < 3; f++) {
        const fx = cxx + dir * f * 4;
        rc(fx, wy - 4, 4, wh + 8, curt[f % 2]);
        rc(fx, wy - 4, 1, wh + 8, shade(curt[f % 2], -18));
      }
      // подхват
      rc(cxx - (dir < 0 ? 6 : 0), wy + wh - 6, 12, 2, shade(curt[1], -25));
    }
    curtain(wx - 12, 1);
    curtain(wx + ww, 1);

    // ----- СТОЛ с ноутбуком (слева, если хватает места сбоку) -----
    const dx = Math.round(W * 0.14), dtopY = floorY - 26, dtopW = 46;
    const showDesk = dx + dtopW < W * 0.52;
    if (showDesk) {
      rc(dx, dtopY, dtopW, 4, '#b07a44');           // столешница
      rc(dx, dtopY, dtopW, 1, '#c89058');
      rc(dx, dtopY + 4, dtopW, 1, '#8a5c30');
      rc(dx + 3, dtopY + 4, 3, 22, '#96652f');      // ножки
      rc(dx + dtopW - 6, dtopY + 4, 3, 22, '#96652f');
      // ноутбук
      const nx = dx + 16;
      rc(nx, dtopY - 9, 15, 9, '#5a6b7a');          // экран
      rc(nx + 1, dtopY - 8, 13, 7, night ? '#9fd4e8' : '#bfe6f2'); // свечение экрана
      rc(nx + 2, dtopY - 7, 5, 2, '#e8f6ff');
      rc(nx - 1, dtopY - 1, 17, 2, '#7a8894');      // основание
      if (night) { ctx.fillStyle = 'rgba(160,220,240,0.25)'; ctx.fillRect(nx - 2, dtopY - 10, 19, 12); }
      // стопка книг
      rc(dx + dtopW - 12, dtopY - 6, 9, 2, '#d97f6a');
      rc(dx + dtopW - 11, dtopY - 8, 8, 2, '#7aa6d0');
      rc(dx + dtopW - 13, dtopY - 4, 10, 2, '#e0b45a');
      // горшок с растением
      rc(dx + 2, dtopY - 8, 6, 6, '#c07a4a');
      rc(dx + 1, dtopY - 12, 3, 5, '#4d8a46'); rc(dx + 4, dtopY - 14, 3, 6, '#5aa055'); rc(dx + 6, dtopY - 11, 3, 4, '#4d8a46');
    } else {
      // напольное растение слева
      const plx = Math.round(W * 0.12), ply = floorY - 2;
      rc(plx, ply - 8, 8, 8, '#c07a4a'); rc(plx, ply - 8, 8, 1, '#d68f5a');
      rc(plx + 1, ply - 16, 3, 9, '#4d8a46'); rc(plx - 2, ply - 12, 4, 5, '#5aa055'); rc(plx + 5, ply - 13, 4, 6, '#4d8a46'); rc(plx + 2, ply - 19, 3, 5, '#5aa055');
    }

    // ----- КАРТИНА / ПОЛКА (справа, если есть место) -----
    if (W > 130) {
      const px = Math.round(W * 0.8);
      rc(px, 18, 22, 16, '#7a5334');
      rc(px + 2, 20, 18, 12, night ? '#3a4a6a' : '#bfe0d8');
      rc(px + 2, 27, 18, 5, night ? '#2f5a3f' : '#8fc27a');
      rc(px + 14, 22, 3, 3, night ? '#eaf0ff' : '#f6c453');
    }

    // ----- КОВЁР (под персонажем) -----
    const rugC = night ? '#8a5560' : '#e79aa2', rugC2 = night ? '#6f4650' : '#d97f89';
    const rw = Math.min(70, Math.round(W * 0.5));
    for (let i = 0; i < 4; i++) {
      const iw = rw - i * 10, iy = floorY + 4 + i * 2;
      rc(W / 2 - iw / 2, iy, iw, 3, i % 2 ? rugC2 : rugC);
    }

    // ----- пылинки -----
    st.motes.forEach(m => {
      m.x += m.sp * 0.4; m.ph += 0.03; if (m.x > W) m.x = 0;
      const fy = m.y + Math.sin(m.ph) * 2;
      rc(Math.round(m.x), Math.round(fy), 1, 1, night ? 'rgba(255,225,150,0.5)' : 'rgba(255,255,240,0.55)');
    });
  }


  /* --- причёски (T рисует клетками относительно головы) --- */
  function drawHair(T, hair, hairL, hairD, style) {
    const cap = () => { T(3.4, 1.3, 7.2, 1.8, hair); T(3.4, 1.3, 7.2, 0.5, hairL); };
    if (style === 'buzz') {
      T(3.6, 1.6, 6.8, 1.2, hair); T(3.6, 1.6, 6.8, 0.4, hairL);
      T(3.5, 2.2, 0.7, 1.3, hairD); T(10.3, 2.2, 0.7, 1.3, hairD);
    } else if (style === 'messy') {
      cap();
      T(3.7, 0.4, 1.2, 1.1, hair); T(5.3, 0.1, 1.2, 1.4, hair); T(6.9, 0.2, 1.2, 1.3, hair); T(8.6, 0.5, 1.2, 1.0, hair);
      T(3.3, 1.9, 0.9, 2.4, hair); T(10.2, 1.9, 0.9, 2.4, hair);
      T(4.0, 3.0, 1.4, 0.7, hair); T(8.6, 3.0, 1.4, 0.7, hair);
    } else if (style === 'long') {
      T(3.4, 1.3, 7.2, 1.8, hair); T(3.4, 1.3, 7.2, 0.5, hairL);
      T(3.2, 1.9, 1.2, 7.2, hair); T(10.2, 1.9, 1.2, 7.2, hair);
      T(3.2, 1.9, 0.5, 7.2, hairD); T(10.9, 1.9, 0.5, 7.2, hairD);
      T(3.9, 2.6, 1.4, 1.2, hair); T(9.1, 2.6, 1.4, 1.2, hair);
      T(6.2, 2.5, 1.6, 0.7, hair);
    } else if (style === 'ponytail') {
      cap();
      T(3.4, 1.9, 0.9, 2.6, hair); T(10.1, 1.9, 0.9, 2.6, hair);
      T(4.2, 3.0, 1.4, 0.6, hair); T(8.4, 3.0, 1.4, 0.6, hair);
      // хвост сбоку
      T(10.6, 2.0, 1.2, 5.4, hair); T(10.6, 2.0, 0.5, 5.4, hairD); T(10.4, 2.1, 0.7, 0.8, hairL);
    } else if (style === 'bun') {
      cap();
      T(6.0, -0.3, 2.0, 1.8, hair); T(6.0, -0.3, 2.0, 0.5, hairL); // пучок
      T(3.4, 1.9, 1.0, 3.6, hair); T(10.0, 1.9, 1.0, 3.6, hair);
      T(4.2, 3.2, 1.2, 0.6, hair); T(8.6, 3.2, 1.2, 0.6, hair);
    } else if (style === 'curly') {
      T(3.2, 1.4, 7.6, 2.0, hair);
      T(3.0, 0.8, 1.7, 1.3, hair); T(4.9, 0.5, 1.7, 1.4, hair); T(7.1, 0.6, 1.7, 1.3, hair); T(9.1, 0.9, 1.5, 1.2, hair);
      T(3.1, 2.0, 1.2, 3.4, hair); T(10.1, 2.0, 1.2, 3.4, hair);
      T(3.4, 0.9, 0.7, 0.7, hairL); T(7.4, 0.8, 0.7, 0.7, hairL);
    } else { // short
      T(3.4, 1.3, 7.2, 1.9, hair); T(3.4, 1.3, 7.2, 0.5, hairL);
      T(3.3, 1.9, 1.0, 3.0, hair); T(10.1, 1.9, 1.0, 3.0, hair); T(3.3, 1.9, 1.0, 3.0, hairD);
      T(4.0, 3.0, 1.6, 0.7, hair); T(8.4, 3.0, 1.6, 0.7, hair); T(6.0, 2.9, 2.0, 0.6, hair);
    }
  }

  // feetY = y нижней точки ног; u = размер одной клетки персонажа в пикселях canvas
  function drawHero(ctx, cx, feetY, u, look, o) {
    o = o || {};
    const breath = o.breath || 0;
    const blink = !!o.blink;
    const lookDir = o.lookDir || 0;
    const arm = o.arm || 'idle';
    const female = (look.gender || 'm') === 'f';

    const skin = look.skin, hair = look.hair, shirt = look.shirt;
    const skinD = shade(skin, -26), skinL = shade(skin, 16);
    const hairD = shade(hair, -34), hairL = shade(hair, 36);
    const shirtD = shade(shirt, -32), shirtL = shade(shirt, 24);
    const pants = female ? '#5a4a80' : '#3a4a6a', pantsD = shade(pants, -26);
    const shoe = '#2a1e14', shoeL = shade(shoe, 26);

    const GW = 14;
    const ox = Math.round(cx - (GW * u) / 2);
    const by = Math.round(feetY);

    // дробные клетки, но всегда чёткие целые пиксели
    const px = (c, r, w, h, col) => {
      const x1 = Math.round(ox + c * u), x2 = Math.round(ox + (c + w) * u);
      const y1 = Math.round(by - (20 - r) * u), y2 = Math.round(by - (20 - (r + h)) * u);
      ctx.fillStyle = col; ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    };
    const bo = breath ? 0.2 : 0;
    const T = (c, r, w, h, col) => px(c, r - bo, w, h, col);

    // ТЕНЬ
    ctx.fillStyle = 'rgba(40,60,30,0.20)';
    ctx.fillRect(Math.round(ox + 3 * u), Math.round(by - 0.4 * u), Math.round(8 * u), Math.round(1.0 * u));

    // ---- НОГИ + ОБУВЬ (короткие, чиби) ----
    px(4.6, 15.6, 1.7, 2.7, pants); px(4.6, 15.6, 0.6, 2.7, pantsD);
    px(7.7, 15.6, 1.7, 2.7, pants); px(7.7, 15.6, 0.6, 2.7, pantsD);
    px(4.4, 18.3, 2.0, 1.7, shoe); px(4.4, 18.3, 2.0, 0.5, shoeL);
    px(7.5, 18.3, 2.0, 1.7, shoe); px(7.5, 18.3, 2.0, 0.5, shoeL);

    // ---- РУКИ (короткие) ----
    if (arm === 'wave') {
      T(3.4, 10.4, 1.6, 3.0, shirt); T(3.4, 10.4, 0.6, 3.0, shirtD); T(3.6, 13.1, 1.3, 0.9, skin);
      const up = o.wavePhase > 0.5 ? 0 : 1.0;
      T(9.0, 7.0 + up, 1.6, 3.0, shirt); T(9.2, 6.2 + up, 1.3, 0.9, skin);
    } else if (arm === 'coffee') {
      T(3.4, 10.4, 1.6, 3.0, shirt); T(3.6, 13.1, 1.3, 0.9, skin);
      T(8.8, 9.9, 1.7, 2.2, shirt); T(9.1, 9.2, 1.3, 0.9, skin);
      T(9.4, 7.6, 1.9, 1.7, '#c96b4a'); T(11.1, 7.9, 0.7, 1.0, '#8a4632'); T(9.5, 7.6, 1.7, 0.4, '#e08a63');
      if (o.tick % 40 < 20) T(10.3, 6.0, 0.7, 0.8, 'rgba(255,255,255,0.6)');
    } else if (arm === 'stretch') {
      T(3.3, 6.2, 1.6, 4.2, shirt); T(3.5, 5.3, 1.3, 1.0, skin);
      T(9.1, 6.2, 1.6, 4.2, shirt); T(9.3, 5.3, 1.3, 1.0, skin);
    } else {
      T(3.4, 10.4, 1.5, 3.6, shirt); T(3.4, 10.4, 0.6, 3.6, shirtD); T(3.6, 13.6, 1.2, 0.9, skin);
      T(9.1, 10.4, 1.5, 3.6, shirt); T(9.4, 13.6, 1.2, 0.9, skin);
    }

    // ---- ТЕЛО (компактное) ----
    T(4.2, 10.0, 5.6, 5.6, shirt);
    T(4.2, 10.0, 5.6, 0.7, shirtL);
    T(4.2, 14.7, 5.6, 0.9, shirtD);
    T(4.2, 10.0, 0.7, 5.6, shirtD);
    T(9.1, 10.0, 0.7, 5.6, shirtD);
    if (female) T(5.6, 12.6, 2.8, 1.2, shirtL);
    // воротник
    T(5.6, 9.7, 2.8, 0.7, shirtD); T(6.3, 9.7, 1.4, 0.6, skinD);

    // ---- ШЕЯ ----
    T(6.3, 9.1, 1.4, 0.8, skinD);

    // ---- ГОЛОВА (крупная, округлая) ----
    T(3.5, 2.2, 7.0, 6.6, skin);       // основа
    T(3.9, 1.6, 6.2, 0.7, skin);       // макушка
    T(4.4, 8.5, 5.2, 0.7, skin);       // округлый подбородок
    T(3.9, 1.7, 6.2, 0.6, skinL);      // блик на лбу
    T(3.5, 2.2, 0.7, 6.3, skinD);      // левая тень
    T(9.8, 2.2, 0.7, 6.3, skinD);      // правая тень
    T(4.4, 8.5, 5.2, 0.5, skinD);      // тень подбородка
    // ушки
    T(3.1, 5.4, 0.7, 1.4, skin); T(10.2, 5.4, 0.7, 1.4, skin);
    T(3.1, 5.4, 0.5, 1.4, skinD); T(10.4, 5.4, 0.5, 1.4, skinD);
    // щёчки
    ctx.globalAlpha = 0.55; T(4.5, 6.6, 1.2, 0.9, '#e8907e'); T(8.3, 6.6, 1.2, 0.9, '#e8907e'); ctx.globalAlpha = 1;
    // нос
    T(6.7, 6.6, 0.6, 0.7, skinD);

    // ---- ГЛАЗА (крупные, милые) ----
    const e = lookDir;
    if (blink) {
      T(4.7, 5.7, 1.6, 0.4, shade(skin, -55)); T(7.7, 5.7, 1.6, 0.4, shade(skin, -55));
    } else {
      T(4.7, 4.9, 1.6, 1.9, '#fff'); T(7.7, 4.9, 1.6, 1.9, '#fff');
      const pupX = e > 0 ? 0.55 : (e < 0 ? -0.05 : 0.25);
      T(4.9 + pupX, 5.2, 0.95, 1.3, '#3a2a20'); T(7.9 + pupX, 5.2, 0.95, 1.3, '#3a2a20');
      T(5.05 + pupX, 5.35, 0.35, 0.45, 'rgba(255,255,255,0.95)');
      T(8.05 + pupX, 5.35, 0.35, 0.45, 'rgba(255,255,255,0.95)');
      if (female) { T(4.55, 4.6, 1.9, 0.35, shade(skin, -60)); T(7.55, 4.6, 1.9, 0.35, shade(skin, -60)); }
    }
    // рот
    T(6.3, 7.7, 1.4, 0.4, shade(skin, -55)); T(6.6, 8.0, 0.8, 0.3, '#c96b6b');

    // ---- ВОЛОСЫ ----
    const hStyle = (look.hairStyle && look.hairStyle !== 'auto') ? look.hairStyle : (female ? 'long' : 'short');
    drawHair(T, hair, hairL, hairD, hStyle);

    // ---- АКСЕССУАРЫ ----
    if (look.accessory === 'hat') {
      T(3.2, 0.7, 7.6, 1.2, '#8a4632'); T(3.2, 1.6, 7.6, 0.4, '#6e3626');
      T(4.4, -0.4, 5.2, 1.2, '#a85a3f'); T(4.4, -0.4, 5.2, 0.4, '#c06a4a');
    } else if (look.accessory === 'crown') {
      T(4.2, 0.7, 5.6, 1.1, '#f6c453'); T(4.2, 0.7, 5.6, 0.35, '#ffe08a');
      T(4.3, -0.3, 0.9, 1.1, '#f6c453'); T(6.6, -0.5, 0.9, 1.3, '#f6c453'); T(8.9, -0.3, 0.9, 1.1, '#f6c453');
      T(6.7, 0.0, 0.7, 0.7, '#e0524a');
    } else if (look.accessory === 'glasses') {
      const fr = '#2c2420', gl = 'rgba(150,205,235,0.35)';
      // дужки к ушам
      T(3.2, 5.5, 1.4, 0.4, fr); T(9.4, 5.5, 1.4, 0.4, fr);
      // левая линза
      T(4.4, 4.7, 2.2, 2.2, fr); T(4.75, 5.05, 1.5, 1.5, gl);
      // правая линза
      T(7.4, 4.7, 2.2, 2.2, fr); T(7.75, 5.05, 1.5, 1.5, gl);
      // переносица
      T(6.5, 5.3, 1.0, 0.5, fr);
      // блик на стекле
      T(4.9, 5.1, 0.5, 0.5, 'rgba(255,255,255,0.6)'); T(7.9, 5.1, 0.5, 0.5, 'rgba(255,255,255,0.6)');
    }
  }

  /* --- питомец: рисуется на пиксель-сетке с авто-контуром (чисто, без пропущенных линий) --- */
  const PET_FILL = {
    capybara(r, s) {
      const b = '#b07d52', d = '#8a5f3c', l = '#c69468', n = '#5b3d28', e = '#2a2018';
      r(3, 6, 9, 5, b); r(3, 6, 9, 1, l); r(3, 10, 9, 1, d);
      r(11, 4, 4, 4, b); r(11, 4, 4, 1, l);              // голова справа
      s(11, 3, b); s(13, 3, b);                          // ушки
      r(14, 5, 1, 2, n);                                 // нос
      s(12, 5, e);                                       // глаз
      r(4, 11, 2, 2, d); r(7, 11, 2, 2, d); r(10, 11, 2, 2, d);
    },
    cat(r, s) {
      const c = '#e6ab6a', d = '#c98a52', e = '#2a2018', p = '#d98a86';
      r(6, 6, 6, 6, c); r(6, 6, 6, 1, d);
      r(5, 3, 7, 4, c); r(5, 3, 7, 1, d);
      s(5, 1, c); s(5, 2, c); s(11, 1, c); s(11, 2, c);  // ушки
      s(6, 2, d); s(10, 2, d);
      s(7, 5, e); s(10, 5, e);                            // глаза
      s(8, 6, p);                                         // нос
      r(12, 7, 2, 4, c); s(12, 6, c);                     // хвост
      r(6, 11, 2, 1, d); r(9, 11, 2, 1, d);
      s(6, 4, d); s(8, 4, d); s(11, 4, d);                // полоски
    },
    dog(r, s) {
      const c = '#c99a63', d = '#a97f4f', m = '#e8d0a2', e = '#2a2018';
      r(6, 6, 6, 6, c); r(6, 6, 6, 1, d);
      r(5, 3, 7, 4, c); r(5, 3, 7, 1, m);
      r(4, 3, 2, 4, d); r(11, 3, 2, 4, d);               // висячие уши
      r(7, 5, 3, 2, m);                                   // мордочка
      s(8, 6, e);                                         // нос
      s(6, 4, e); s(10, 4, e);                            // глаза
      r(12, 7, 2, 3, c); s(12, 6, c);                     // хвост
      r(6, 11, 2, 1, d); r(9, 11, 2, 1, d);
    },
    fox(r, s) {
      const c = '#e07a3f', w = '#f5e6d0', e = '#2a2018';
      r(6, 6, 6, 5, c); r(6, 6, 6, 1, c);
      r(5, 3, 7, 4, c);
      s(5, 1, c); s(5, 2, c); s(11, 1, c); s(11, 2, c);   // острые уши
      s(5, 1, e); s(11, 1, e);                            // чёрные кончики
      r(6, 5, 5, 2, w);                                   // белая мордочка
      s(8, 6, e);                                         // нос
      s(6, 4, e); s(10, 4, e);
      r(12, 5, 2, 4, c); r(13, 8, 1, 2, w);              // пышный хвост с белым
      r(6, 11, 2, 1, e); r(9, 11, 2, 1, e);              // тёмные лапки
    },
    rabbit(r, s) {
      const c = '#eae6de', d = '#cfc9bf', pk = '#e7a6b0', e = '#2a2018';
      r(6, 7, 5, 4, c); r(6, 7, 5, 1, d);
      r(5, 4, 6, 4, c);
      r(6, 1, 1, 4, c); r(9, 1, 1, 4, c);                // длинные уши
      s(6, 2, pk); s(6, 3, pk); s(9, 2, pk); s(9, 3, pk);
      s(6, 6, e); s(9, 6, e);                            // глаза
      s(7, 7, pk);                                       // носик
      r(11, 9, 1, 1, c);                                 // хвостик
      r(6, 11, 2, 1, d); r(9, 11, 2, 1, d);
    },
    panda(r, s) {
      const w = '#f4f2ec', k = '#2f2a26', e = '#2a2018';
      r(6, 6, 6, 6, w); r(6, 6, 6, 1, '#e6e2da');
      r(5, 3, 7, 4, w);
      r(5, 2, 2, 2, k); r(10, 2, 2, 2, k);               // чёрные ушки
      r(6, 4, 2, 2, k); r(9, 4, 2, 2, k);                // пятна у глаз
      s(7, 5, w); s(10, 5, w);
      s(8, 6, k);                                        // нос
      r(5, 7, 2, 3, k); r(10, 7, 2, 3, k);               // чёрные лапки
      r(6, 11, 2, 1, k); r(9, 11, 2, 1, k);
    },
    bird(r, s) {
      const b = '#f2c94c', o = '#e0902f', e = '#2a2018';
      r(6, 5, 6, 6, b); r(6, 5, 6, 1, '#ffe08a');
      r(5, 4, 7, 3, b);
      r(4, 8, 2, 2, b); r(12, 8, 2, 2, b);              // крылышки
      r(12, 6, 2, 1, o);                                // клюв
      s(10, 5, e); s(7, 5, e);
      r(6, 11, 1, 1, o); r(9, 11, 1, 1, o);             // лапки
      s(11, 6, o);
    },
    slime(r, s) {
      const g = '#6bcf8a', d = '#4fae6c', L = '#9fe6b4', e = '#2a2018';
      r(4, 6, 8, 5, g); r(5, 4, 6, 2, g); r(6, 3, 4, 1, g);
      r(4, 10, 8, 1, d); r(5, 4, 2, 1, L);
      s(6, 7, e); s(9, 7, e);                            // глаза
      r(7, 8, 2, 1, d);                                 // улыбка
    },
  };

  function drawPet(ctx, x, groundY, u, pet, tick) {
    if (pet === 'none' || !PET_FILL[pet]) return;
    const GW = 18, GH = 14;
    const g = new Array(GW * GH).fill(null);
    const idx = (cx, cy) => cy * GW + cx;
    const s = (cx, cy, c) => { if (cx >= 0 && cx < GW && cy >= 0 && cy < GH && c) g[idx(cx, cy)] = c; };
    const r = (cx, cy, w, h, c) => { for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) s(cx + xx, cy + yy, c); };
    PET_FILL[pet](r, s);

    // контур: пустая клетка рядом с заполненной → тёмная обводка
    const OL = '#3a2a22';
    const outline = [];
    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
      if (g[idx(cx, cy)]) continue;
      if ((cx > 0 && g[idx(cx - 1, cy)]) || (cx < GW - 1 && g[idx(cx + 1, cy)]) ||
          (cy > 0 && g[idx(cx, cy - 1)]) || (cy < GH - 1 && g[idx(cx, cy + 1)])) outline.push(cx + cy * GW);
    }
    outline.forEach(k => { g[k] = OL; });

    // границы содержимого
    let minX = GW, maxX = 0, maxY = 0;
    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) if (g[idx(cx, cy)]) {
      if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy > maxY) maxY = cy;
    }
    const centerX = (minX + maxX + 1) / 2;
    const pu = Math.max(2, Math.round(u * 0.72));
    const bob = (Math.floor(tick / 45) % 2 === 0) ? 0 : 1; // тихое покачивание

    // тень
    ctx.fillStyle = 'rgba(40,60,30,0.20)';
    ctx.fillRect(Math.round(x - (maxX - minX + 1) * pu * 0.35), Math.round(groundY - 1), Math.round((maxX - minX + 1) * pu * 0.7), Math.round(pu * 0.8));

    for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
      const c = g[idx(cx, cy)]; if (!c) continue;
      const X = Math.round(x + (cx - centerX) * pu);
      const Y = Math.round(groundY - (maxY - cy + 1) * pu) - bob;
      ctx.fillStyle = c; ctx.fillRect(X, Y, pu, pu);
    }
  }

  /* ============================================================
     ХАБ-СЦЕНА (живая поляна + персонаж)
     ============================================================ */
  let hub = null;

  function initHub(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const st = {
      canvas, ctx, tick: 0, raf: null,
      W: 0, H: 0, groundY: 0, u: 4,
      clouds: [], motes: [], butterflies: [],
      blinkAt: 60, blinking: 0,
      actionUntil: 0, action: 'idle', nextAction: 200, waveT: 0, lookDir: 0,
    };
    hub = st;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const cssW = rect.width || window.innerWidth;
      const cssH = rect.height || window.innerHeight;
      // Ключ к адаптиву: масштаб считаем от ВЫСОТЫ экрана, а не ширины.
      // Тогда персонаж занимает одну и ту же долю высоты на телефоне и на iPad,
      // а лишняя ширина просто заполняется поляной (а не растягивает героя).
      const HCELL = 4;            // арт-пикселей на клетку героя
      const HERO_CELLS = 20;      // высота героя в клетках
      const HERO_FRAC = 0.5;      // доля высоты экрана под героя
      let scale = (cssH * HERO_FRAC) / (HERO_CELLS * HCELL);
      scale = Math.max(3, scale);
      st.scale = scale;
      st.W = Math.max(72, Math.round(cssW / scale));
      st.H = Math.round(cssH / scale);
      canvas.width = st.W; canvas.height = st.H;
      ctx.imageSmoothingEnabled = false;
      st.groundY = Math.round(st.H * 0.86);
      st.u = HCELL;
      // облака
      st.clouds = [
        { x: 20, y: st.H * 0.18, s: 1.0, sp: 0.05 },
        { x: 80, y: st.H * 0.30, s: 0.7, sp: 0.035 },
        { x: 50, y: st.H * 0.10, s: 0.85, sp: 0.045 },
      ];
      st.motes = Array.from({ length: 10 }, () => ({
        x: Math.random() * st.W, y: st.groundY - Math.random() * st.H * 0.4,
        sp: 0.1 + Math.random() * 0.15, ph: Math.random() * 6,
      }));
      st.butterflies = [
        { x: 30, y: st.groundY - 30, t: Math.random() * 6, sp: 0.25 },
      ];
    }
    resize();
    window.addEventListener('resize', resize);
    st._resize = resize;

    loopHub();
    return st;
  }

  function loopHub() {
    if (!hub) return;
    const st = hub, ctx = st.ctx;
    st.tick++;
    const t = st.tick;

    // --- ФОН: локация + время суток ---
    drawEnvironment(ctx, st, t);

    // --- ПЕРСОНАЖ ---
    const look = Game.get().look;
    // дыхание
    const breath = (Math.sin(t / 45) + 1) / 2 > 0.5 ? 1 : 0;

    // моргание
    st.blinkAt--;
    if (st.blinkAt <= 0 && st.blinking === 0) { st.blinking = 8; st.blinkAt = 120 + Math.random() * 220; }
    if (st.blinking > 0) st.blinking--;
    const blink = st.blinking > 0 && st.blinking < 6;

    // редкие действия
    st.nextAction--;
    if (st.nextAction <= 0 && t > st.actionUntil) {
      const roll = Math.random();
      if (roll < 0.3) { st.action = 'wave'; st.actionUntil = t + 90; }
      else if (roll < 0.55) { st.action = 'coffee'; st.actionUntil = t + 160; }
      else if (roll < 0.75) { st.action = 'stretch'; st.actionUntil = t + 80; }
      else { st.action = 'look'; st.lookDir = Math.random() < 0.5 ? -1 : 1; st.actionUntil = t + 100; }
      st.nextAction = 300 + Math.random() * 300;
    }
    let arm = 'idle', lookDir = 0;
    if (t < st.actionUntil) {
      if (st.action === 'look') lookDir = st.lookDir;
      else arm = st.action;
    }
    const wavePhase = (Math.sin(t / 6) + 1) / 2;

    const cx = st.W / 2;
    const feetY = st.groundY + 1;
    // питомец рядом с героем (позиция и размер подстраиваются)
    const petU = 3;
    let petX = cx + 7 * st.u + 4;              // сразу справа от героя
    petX = Math.min(petX, st.W - 8 * petU - 2); // не вылезаем за край
    drawPet(ctx, petX, feetY, petU, look.pet, t);
    drawHero(ctx, cx, feetY, st.u, look, { breath, blink, lookDir, arm, wavePhase, tick: t });

    hub.raf = requestAnimationFrame(loopHub);
  }

  function drawCloud(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    const w = Math.round(16 * s), h = Math.round(6 * s);
    ctx.fillRect(x, y, w, h);
    ctx.fillRect(x + 3, y - 3, w - 6, 3);
    ctx.fillRect(x + 5, y - 5, w - 12, 3);
    ctx.fillStyle = 'rgba(210,225,235,0.9)';
    ctx.fillRect(x, y + h - 1, w, 1);
  }

  function stopHub() { if (hub && hub.raf) cancelAnimationFrame(hub.raf); }
  function resumeHub() { if (hub) loopHub(); }

  /* ============================================================
     ЭКРАН ЗАГРУЗКИ
     ============================================================ */
  let load = null;
  function initLoading(canvas) {
    const ctx = canvas.getContext('2d');
    const st = { canvas, ctx, tick: 0, raf: null, W: 0, H: 0, clouds: [], birds: [] };
    load = st;
    function resize() {
      const r = canvas.getBoundingClientRect();
      const cssW = r.width || window.innerWidth;
      const cssH = r.height || window.innerHeight;
      let scale = Math.max(3, cssH / 190); // ~консистентная плотность пикселей
      st.W = Math.max(72, Math.round(cssW / scale));
      st.H = Math.round(cssH / scale);
      canvas.width = st.W; canvas.height = st.H;
      ctx.imageSmoothingEnabled = false;
      st.clouds = [
        { x: 10, y: st.H * 0.25, s: 1, sp: 0.06 },
        { x: 70, y: st.H * 0.4, s: 0.7, sp: 0.04 },
        { x: 40, y: st.H * 0.15, s: 0.85, sp: 0.05 },
        { x: 95, y: st.H * 0.55, s: 0.6, sp: 0.03 },
      ];
      st.birds = [{ x: 30, y: st.H * 0.3 }, { x: 60, y: st.H * 0.22 }];
    }
    resize(); window.addEventListener('resize', resize); st._resize = resize;
    loopLoading();
  }
  function loopLoading() {
    if (!load) return;
    const st = load, ctx = st.ctx; st.tick++;
    const bands = ['#ffe6bf', '#ffd8a8', '#ffcf9c', '#d8e6c0', '#bfe0d8', '#aad8ea', '#9ccfe6'];
    const bh = st.H / bands.length;
    bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, Math.floor(i * bh), st.W, Math.ceil(bh) + 1); });
    // солнце
    ctx.fillStyle = 'rgba(255,245,200,0.6)'; ctx.fillRect(20, 16, 24, 24);
    ctx.fillStyle = '#ffeaa0'; ctx.fillRect(24, 20, 16, 16);
    // облака
    st.clouds.forEach(c => { c.x += c.sp; if (c.x > st.W + 20) c.x = -24; drawCloud(ctx, Math.round(c.x), Math.round(c.y), c.s); });
    // птицы
    st.birds.forEach((b, i) => {
      b.x += 0.08; if (b.x > st.W + 6) b.x = -6;
      const f = Math.sin(st.tick / 6 + i) > 0 ? 1 : 2;
      ctx.fillStyle = '#5a4632';
      ctx.fillRect(b.x - 2, b.y - f, 2, 1); ctx.fillRect(b.x + 1, b.y - f, 2, 1);
      ctx.fillRect(b.x, b.y, 1, 1);
    });
    // мерцание
    for (let i = 0; i < 5; i++) {
      if ((st.tick + i * 13) % 90 < 20) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect((i * 29 + 15) % st.W, (i * 17 + 30) % (st.H * 0.6), 1, 1);
      }
    }
    load.raf = requestAnimationFrame(loopLoading);
  }
  function stopLoading() {
    if (load && load.raf) cancelAnimationFrame(load.raf);
    if (load && load._resize) window.removeEventListener('resize', load._resize);
    load = null;
  }

  /* ============================================================
     МАЛЕНЬКИЕ РЕНДЕРЫ (аватар, превью кастомизации)
     ============================================================ */
  function renderAvatar(canvas, look) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // рисуем только голову крупно
    const u = 2, cx = 8, feetY = 30; // хитрость: рисуем героя, но canvas обрезает до головы
    // используем отдельную временную область: просто масштабируем голову
    drawHeadOnly(ctx, look, u);
  }
  function drawHeadOnly(ctx, look, u) {
    const skin = look.skin, hair = look.hair;
    const female = (look.gender || 'm') === 'f';
    const skinD = shade(skin, -28), skinL = shade(skin, 18), hairD = shade(hair, -34), hairL = shade(hair, 32);
    const P = (c, r, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(c * u, r * u, w * u, h * u); };
    // длинные боковые пряди у девушки — рисуем до головы
    if (female) { P(0, 2, 1, 5, hair); P(7, 2, 1, 5, hair); P(0, 2, 1, 5, hairD); }
    // 8x8 голова
    P(1, 2, 6, 5, skin); P(1, 2, 6, 1, skinL); P(1, 6, 6, 1, skinD); P(1, 2, 1, 5, skinD);
    // щёчки
    ctx.globalAlpha = 0.5; P(2, 4, 1, 1, '#e8907e'); P(5, 4, 1, 1, '#e8907e'); ctx.globalAlpha = 1;
    // глаза с бликом
    P(2, 4, 1, 1, '#2a2018'); P(5, 4, 1, 1, '#2a2018');
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect((2) * u, 4 * u, u * 0.4, u * 0.4); ctx.fillRect((5) * u, 4 * u, u * 0.4, u * 0.4);
    P(3, 5, 2, 1, shade(skin, -50)); // рот
    // волосы
    P(1, 1, 6, 2, hair); P(1, 1, 6, 1, hairL);
    P(0, 2, 1, female ? 2 : 3, hair); P(7, 2, 1, female ? 2 : 3, hair);
    if (look.accessory === 'crown') { P(1, 0, 6, 1, '#f6c453'); P(3, 0, 1, 1, '#e0524a'); }
    else if (look.accessory === 'hat') { P(0, 1, 8, 1, '#8a4632'); P(1, 0, 6, 1, '#a85a3f'); }
    else if (look.accessory === 'glasses') { P(1, 4, 6, 1, '#2a2018'); }
  }

  let customRaf = null;
  function renderCustomPreview(canvas, look) {
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    canvas.width = 48; canvas.height = 48;
    let tick = 0;
    if (customRaf) cancelAnimationFrame(customRaf);
    function loop() {
      tick++;
      ctx.clearRect(0, 0, 48, 48);
      ctx.fillStyle = 'rgba(40,60,30,0.15)'; ctx.fillRect(14, 44, 20, 3);
      const breath = (Math.sin(tick / 45) + 1) / 2 > 0.5 ? 1 : 0;
      const blink = tick % 140 < 8;
      drawHero(ctx, 24, 46, 2, look, { breath, blink, arm: 'idle', tick });
      customRaf = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopCustomPreview() { if (customRaf) cancelAnimationFrame(customRaf); customRaf = null; }

  return {
    initHub, stopHub, resumeHub,
    initLoading, stopLoading,
    renderAvatar, renderCustomPreview, stopCustomPreview,
    drawHero, drawPet, drawEnvironment,
  };
})();

/* ============================================================
   UI-разделы + игровые эффекты.
   ============================================================ */

/* --- крошечный хелпер для создания элементов --- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  const tr = (typeof T === 'function') ? T : (x => x);
  if (attrs) for (const k in attrs) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'html') el.innerHTML = tr(attrs[k]);
    else if (k === 'text') el.textContent = tr(attrs[k]);
    else if (k === 'placeholder') el.setAttribute('placeholder', tr(attrs[k]));
    else if (k.startsWith('on') && typeof attrs[k] === 'function') el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(tr(c))); });
  return el;
}

/* ============================================================
   ЭФФЕКТЫ (частицы, тосты, level up, звук)
   ============================================================ */
const FX = (() => {
  const fxLayer = () => document.getElementById('fxLayer');
  const toastLayer = () => document.getElementById('toastLayer');

  // мягкий пиксельный «блип» через WebAudio
  let actx = null;
  function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.05) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  function particles(x, y, glyphs, count) {
    const layer = fxLayer();
    for (let i = 0; i < count; i++) {
      const p = h('span', { class: 'particle', text: glyphs[i % glyphs.length] });
      p.style.left = x + 'px'; p.style.top = y + 'px';
      layer.append(p);
      const ang = (-90 + (Math.random() * 120 - 60)) * Math.PI / 180;
      const dist = 40 + Math.random() * 70;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      const dur = 700 + Math.random() * 500;
      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy - 30}px) scale(0.6)`, opacity: 0 },
      ], { duration: dur, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
    }
  }

  function toast(html) {
    const t = h('div', { class: 'toast', html });
    toastLayer().append(t);
    setTimeout(() => t.remove(), 2700);
  }

  function levelUp(level) {
    beep(660, 0.1); setTimeout(() => beep(880, 0.12), 100); setTimeout(() => beep(1046, 0.15), 220);
    TG.haptic('success');
    const modal = h('div', { class: 'levelup', onclick: () => modal.remove() },
      h('div', { class: 'levelup-card' },
        h('div', { class: 'lu-title', text: 'НОВЫЙ УРОВЕНЬ' }),
        h('div', { class: 'lu-level', text: level }),
        h('div', { class: 'lu-sub', text: 'Персонаж стал сильнее!' }),
      )
    );
    document.body.append(modal);
    // звёздный салют
    const cx = innerWidth / 2, cy = innerHeight / 2;
    particles(cx, cy, ['✦', '★', '✧', '◆'], 18);
    setTimeout(() => modal.remove(), 2600);
  }

  // общий фидбэк за награду; anchorEl — откуда летят частицы
  function rewardBurst(anchorEl, xp, coins, res) {
    let x = innerWidth / 2, y = innerHeight / 2;
    if (anchorEl) { const r = anchorEl.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    particles(x, y, ['✦', '◉', '★'], 10);
    beep(520, 0.06); setTimeout(() => beep(700, 0.06), 60);
    TG.haptic('light');
    toast(`<span class="t-reward">+${xp} XP</span> · <span class="t-reward">+${coins} ◉</span>`);
    if (res && res.leveledTo) setTimeout(() => levelUp(res.leveledTo), 500);
  }

  // универсальная центральная модалка (карточка на затемнении)
  function modal(cardNode, opts) {
    opts = opts || {};
    const m = h('div', { class: 'levelup' + (opts.cls ? ' ' + opts.cls : '') },
      cardNode);
    if (opts.dismiss !== false) m.addEventListener('click', e => { if (e.target === m) m.remove(); });
    document.body.append(m);
    if (opts.autoClose) setTimeout(() => { if (m.parentNode) m.remove(); }, opts.autoClose);
    return () => { if (m.parentNode) m.remove(); };
  }

  function karmaUp(level, xp, coins) {
    beep(600, 0.1); setTimeout(() => beep(820, 0.12), 110); setTimeout(() => beep(1000, 0.15), 240);
    TG.haptic('success');
    const card = h('div', { class: 'levelup-card karma-up' },
      h('div', { class: 'lu-title', text: '✨ КАРМА' }),
      h('div', { class: 'lu-level', text: level }),
      h('div', { class: 'lu-sub', text: T('Доброта растёт!') + `  +${xp} XP · +${coins} ◉` }),
    );
    modal(card, { autoClose: 2900 });
    particles(innerWidth / 2, innerHeight / 2, ['✨', '💚', '★', '◉'], 18);
  }

  return { particles, toast, levelUp, rewardBurst, beep, modal, karmaUp };
})();

/* ============================================================
   СИСТЕМА ОКОН (bottom sheet)
   ============================================================ */
const UI = (() => {
  const root = () => document.getElementById('overlayRoot');
  let current = null;
  let backCb = null;

  function open(title, glyph, bodyEl) {
    close(true); // мгновенно закрыть предыдущее
    const body = h('div', { class: 'sheet-body' }, bodyEl);
    const sheet = h('div', { class: 'sheet' },
      h('div', { class: 'sheet-header' },
        h('div', { class: 'sheet-title', html: `<span class="th-glyph">${glyph}</span>${T(title)}` }),
        h('button', { class: 'sheet-close', text: '✕', onclick: () => close() }),
      ),
      body,
    );
    const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) close(); } }, sheet);
    root().append(overlay);
    current = overlay;

    backCb = () => close();
    TG.showBack(backCb);
    TG.haptic('soft');
    return body;
  }

  function close(instant) {
    if (!current) return;
    const el = current; current = null;
    Scene.stopCustomPreview();
    if (backCb) { TG.hideBack(backCb); backCb = null; }
    if (instant) { el.remove(); return; }
    el.classList.add('closing');
    setTimeout(() => el.remove(), 250);
  }

  function isOpen() { return !!current; }
  return { open, close, isOpen };
})();

  function openCalendar() {
    let view = new Date();

    function render() {
      const y = view.getFullYear(), m = view.getMonth();
      const months = I18N.months();
      head.innerHTML = '';
      head.append(
        h('button', { class: 'cal-nav', text: '‹', onclick: () => { view = new Date(y, m - 1, 1); render(); } }),
        h('div', { class: 'cal-month', text: `${months[m]} ${y}` }),

      );

      const days = new Date(y, m + 1, 0).getDate();
      const today = Game.todayKey();
      for (let d = 1; d <= days; d++) {
        const key = `${y}-${m + 1}-${d}`;
        const count = Game.tasksForDate(key).length;
        const cell = h('div', { class: 'cal-cell' + (key === today ? ' today' : '') + (key === selected ? ' sel' : ''), 'data-key': key },
          h('span', { text: d }),

        );
        cell.addEventListener('click', () => { selected = key; TG.haptic('light'); render(); });
        grid.append(cell);
      }

    }

    function renderDay() {
      dayPanel.innerHTML = '';
      const items = Game.tasksForDate(selected);
      const [yy, mm, dd] = selected.split('-').map(Number);
      const label = `${dd}.${String(mm).padStart(2, '0')}.${yy}`;
      dayPanel.append(h('div', { class: 'cal-day-title', text: '📌 ' + label + (selected === Game.todayKey() ? T(' · сегодня') : '') }));

      if (!dated.length) { list.append(empty('🗺️', 'Пока нет запланированных дел.')); return; }
      dated.sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(t => {
        const check = h('button', { class: 'row-check' + (t.done ? ' checked' : ''), text: t.done ? '✓' : '' });
        check.addEventListener('click', () => {
          const res = Game.toggleTask(t.id);
          if (res) FX.rewardBurst(check, t.reward, Math.ceil(t.reward / 3), res);
          refresh();
        });
        list.append(h('div', { class: 'card-row' + (t.done ? ' done' : '') },
          check,
          h('div', { class: 'row-body' },
            h('div', { class: 'row-title', text: t.title }),
            taskMeta(t),
          ),
          h('button', { class: 'row-del', text: '🗑', onclick: () => { Game.delTask(t.id); refresh(); } }),
        ));
      });
    }
    refresh();
  }
