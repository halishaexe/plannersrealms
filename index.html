  function openGoals() {
    const wrap = h('div', {});
    UI.open('Копилка', 'goal', wrap);
    Tutorial.trigger('goal');

    const name = h('input', { class: 'pix-input', type: 'text', placeholder: 'На что копим (напр. велосипед)…', maxlength: '40' });
    const target = h('input', { class: 'pix-input', type: 'number', placeholder: 'Сумма цели', min: '1' });
    const add = () => { Game.addGoal(name.value, target.value); name.value = ''; target.value = ''; refresh(); };

    wrap.append(
      h('p', { class: 'section-hint', text: 'Поставь реальную цель — коплю на… Дойдёшь до 100% → получишь достижение и игровую награду (+120 XP, +80 ◉).' }),
      h('div', { class: 'add-row' }, name),
      h('div', { class: 'add-row' }, target, h('button', { class: 'btn', text: '+', onclick: add })),
    );
    const list = h('div', { class: 'list' }); wrap.append(list);

    function refresh() {
      list.innerHTML = '';
      const goals = Game.get().goals;
      if (!goals.length) { list.append(empty('🐷', 'Пока нет целей. Создай первую копилку!', T('Создать копилку'), () => name.focus())); return; }
      goals.forEach(g => {
        const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
        const fill = h('div', { class: 'goal-fill' }); fill.style.width = pct + '%';
        const amount = h('input', { class: 'pix-input goal-add', type: 'number', placeholder: '+ сумма', min: '1' });
        const put = () => {
          const done = Game.addToGoal(g.id, amount.value);
          amount.value = '';
          if (done) {
            FX.particles(innerWidth / 2, innerHeight / 2, ['🎉', '★', '✦', '◉'], 16);
            FX.toast('🏆 ' + T('Цель достигнута: ') + g.name + '!'); if (Scene.react) Scene.react('cheer', 150);
            FX.beep(660, 0.1); setTimeout(() => FX.beep(880, 0.12), 120);
            TG.haptic('success');
            if (done.res && done.res.leveledTo) setTimeout(() => FX.levelUp(done.res.leveledTo), 600);
          }
          refresh();
        };
        amount.addEventListener('keydown', e => { if (e.key === 'Enter') put(); });

        const card = h('div', { class: 'goal-card' + (g.done ? ' done' : '') },
          h('div', { class: 'goal-head' },
            h('div', { class: 'goal-name', text: g.name }),
            h('button', { class: 'row-del', text: '🗑', onclick: () => delUndo('goals', g, () => Game.delGoal(g.id), refresh) }),
          ),
          h('div', { class: 'goal-bar' }, fill, h('span', { class: 'goal-pct', text: pct + '%' })),
          h('div', { class: 'goal-meta', text: `${fmt(g.saved)} / ${fmt(g.target)}` }),
          g.done
            ? h('div', { class: 'goal-done-badge', text: '✓ Цель достигнута!' })
            : h('div', { class: 'add-row goal-add-row' }, amount, h('button', { class: 'btn', text: '↑', onclick: put })),
        );
        list.append(card);
      });
    }
    refresh();
  }

        h('p', { text: 'Постепенно твоя Карма будет расти, а вместе с ней — небольшие игровые награды: опыт и монеты. Но самое главное — ты будешь видеть, сколько хорошего уже сделал.' }),

      h('div', { class: 'ki-warm' },
        h('p', { text: '❤️ Если никто не заметил твоё доброе дело — не переживай. Ты всегда можешь рассказать о нём здесь, и мы искренне порадуемся за тебя.' }),

      ),

    card.append(h('button', {
      class: 'btn btn--wide ki-cta', text: 'Начать путь добра',
      onclick: () => { Game.setFlag('karmaIntro', true); overlay.remove(); FX.beep(560, 0.08); TG.haptic('light'); },

  function openKarmaAdd() {
    const ta = h('textarea', { class: 'pix-input karma-ta', rows: '5', maxlength: '300', placeholder: DEED_PLACEHOLDER });
    const card = h('div', { class: 'levelup-card karma-add' },
      h('div', { class: 'ka-title', text: '✨ Расскажи о своём добром деле' }),
      h('div', { class: 'ka-desc', text: 'Какое доброе дело ты сегодня сделал? Не обязательно писать много — иногда даже одна строчка станет приятным воспоминанием спустя месяцы.' }),
      ta,
    );
    const overlay = h('div', { class: 'levelup km-scroll' }, card);
    const close = () => overlay.remove();
    const save = () => {
      const txt = ta.value.trim();
      if (!txt) { ta.focus(); return; }
      const leveled = Game.addDeed(txt);
      close();
      FX.toast(I18N.get() === 'en' ? '✨ <b>+1</b> Karma · good deed saved' : '✨ <b>+1</b> к карме · доброе дело сохранено');

      FX.beep(560, 0.07); TG.haptic('light');

      if (leveled) setTimeout(() => FX.karmaUp(leveled.level, leveled.xp, leveled.coins), 360);

      h('button', { class: 'btn btn--ghost', text: 'Отмена', onclick: close }),
      h('button', { class: 'btn', text: 'Сохранить', onclick: save }),

    document.body.append(overlay);
    setTimeout(() => ta.focus(), 60);

     ============================================================ */
  const MOODS = [['great', '😄', 'Отлично'], ['good', '🙂', 'Хорошо'], ['ok', '😐', 'Нормально'], ['low', '😔', 'Грустно'], ['bad', '😢', 'Тяжело']];

  function openMood() {
    const wrap = h('div', {});
    UI.open('Настроение', 'mood', wrap);
    const cur = Game.moodToday();
    wrap.append(h('p', { class: 'section-hint', text: 'Как ты сегодня? Отметь одним тапом — без оценок и обязательств.' }));
    const row = h('div', { class: 'mood-row' });
    MOODS.forEach(([id, emo, lbl]) => {
      const b = h('button', { class: 'mood-btn' + (cur === id ? ' sel' : ''), text: emo, title: lbl });
      b.addEventListener('click', () => { Game.setMood(id); TG.haptic('light'); FX.toast(emo + ' ' + T(lbl)); openMood(); });
      row.append(b);
    });
    wrap.append(row);
    const hist = h('div', { class: 'mood-hist' });
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
      const m = Game.moodOn(k); const emo = (MOODS.find(x => x[0] === m) || [])[1] || '·';
      hist.append(h('div', { class: 'mood-cell', text: emo }));
    }
    wrap.append(h('h4', { class: 'stats-h', text: 'Последние 2 недели' }), hist);
  }

/* ============================================================
   Точка входа приложения.
   ============================================================ */
const App = (() => {
  let refs = {};

  /* --- тихий эмбиент (WebAudio, без файлов) --- */
  const Ambient = (() => {
    let actx = null, master = null, drone = [], melTimer = null, running = false, step = 0;
    function ensure() {
      if (actx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC(); master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
    }
    function start() {
      ensure(); if (!actx || running) return; running = true; step = 0;
      if (actx.state === 'suspended') actx.resume();
      // мягкая подложка (пэд)
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480; lp.connect(master);
      [110, 110.5, 165].forEach(f => { const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f; const g = actx.createGain(); g.gain.value = 0.08; o.connect(g); g.connect(lp); o.start(); drone.push(o); });
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setValueAtTime(0, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.10, actx.currentTime + 2);
      scheduleMelody();
    }
    // спокойная зацикленная мелодия (пентатоника до-мажор), -1 = пауза
    const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const PHRASE = [0, 2, 4, 3, 4, 5, -1, 4, 2, 3, 1, 0, -1, 2, -1, -1];
    function scheduleMelody() {
      if (!running) return;
      const idx = PHRASE[step % PHRASE.length];
      if (idx >= 0) note(SCALE[idx], idx >= 4 ? 0.045 : 0.055);
      step++;
      melTimer = setTimeout(scheduleMelody, 640);
    }
    function note(freq, vol) {
      if (!actx) return;
      const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
      const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
      const g = actx.createGain(); g.gain.value = 0; o.connect(g); const g2 = actx.createGain(); g2.gain.value = 0; o2.connect(g2);
      g.connect(master); g2.connect(master);
      const now = actx.currentTime;
      g.gain.linearRampToValueAtTime(vol, now + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
      g2.gain.linearRampToValueAtTime(vol * 0.35, now + 0.04);
      g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
      o.start(now); o.stop(now + 1.15); o2.start(now); o2.stop(now + 0.85);
    }
    function stop() {
      running = false; if (melTimer) clearTimeout(melTimer);
      if (actx && master) { master.gain.cancelScheduledValues(actx.currentTime); master.gain.linearRampToValueAtTime(0, actx.currentTime + 0.5); }
      setTimeout(() => { drone.forEach(o => { try { o.stop(); } catch (e) {} }); drone = []; }, 600);
    }
    return { start, stop };
  })();
  function setAmbient(on) { Game.setSound(on); if (on) Ambient.start(); else Ambient.stop(); }

    const overlay = h('div', { class: 'levelup lang-screen' },
      h('div', { class: 'levelup-card lang-card' },
        h('div', { class: 'lang-logo', text: '✦' }),
        h('div', { class: 'lang-title', text: 'Выбери язык' }),
        h('div', { class: 'lang-sub', text: 'Choose your language' }),
        h('button', { class: 'btn btn--wide lang-opt', text: 'Русский', onclick: () => pick('ru') }),
        h('button', { class: 'btn btn--wide lang-opt', text: 'English', onclick: () => pick('en') }),
      ),
    );
    document.body.append(overlay);
  }

  /* --- экран загрузки --- */
  const TIPS = [
    'Просыпается мир…', 'Расставляем облака…', 'Завариваем кофе герою…',
    'Сажаем траву…', 'Будим бабочек…', 'Почти готово!',
  ];
  function runLoading() {
    let p = 0, ti = 0;
    refs.loadingTip.textContent = T(TIPS[0]);
    const timer = setInterval(() => {
      p += 6 + Math.random() * 12;
      if (p >= 100) p = 100;
      refs.loadbarFill.style.width = p + '%';
      const idx = Math.min(TIPS.length - 1, Math.floor(p / (100 / TIPS.length)));
      if (idx !== ti) { ti = idx; refs.loadingTip.textContent = T(TIPS[idx]); }
      if (p >= 100) {
        clearInterval(timer);
        setTimeout(() => {
          // Всегда показываем игру — так экран загрузки не может «зависнуть».
          try { revealHub(); } catch (e) { console.error(e); refs.loading.classList.add('hidden'); refs.hub.classList.remove('hidden'); }
          // Выбор языка (если ещё не выбран) — поверх игры.
          if (!Game.get().lang) { try { showLangChooser(() => { setTimeout(() => Sections.Tutorial.welcome(), 500); }); } catch (e) { console.error(e); } }
        }, 500);
      }
    }, 220);
  }

  function revealHub() {
    Scene.stopLoading();
    refs.loading.classList.add('hidden');
    refs.hub.classList.remove('hidden');
    Scene.initHub(document.getElementById('sceneCanvas'));
    wireHub();
    applyStaticLang();
    refreshTop();
    updateAvatar();
    applyFrame();
    renderWidgets();
    refreshKarma();
    // ежедневный стрик входов
    const stk = Game.streakCheckin();
    if (stk) setTimeout(() => {
      FX.toast('🔥 ' + stk.count + ' ' + T('дней подряд') + ' · +' + stk.coins + ' ◉');
      FX.particles(innerWidth / 2, innerHeight * 0.3, ['🔥', '◉', '★'], 10);
      TG.haptic('success');
    }, 900);
    // открытие капсул времени
    const caps = Game.unlockedCapsules();
    if (caps) setTimeout(() => { FX.toast('📬 ' + T('Капсула времени открылась!')); FX.particles(innerWidth / 2, innerHeight * 0.35, ['📬', '✨', '★'], 12); TG.haptic('success'); }, 1800);
    // мысль дня в виде реплики
    setTimeout(() => showSpeech(quoteOfDay(), 4200), 700);
    // первый показ механики Кармы — только когда язык уже выбран
    if (Game.get().lang && !Game.tutSeen('welcome')) setTimeout(() => Sections.Tutorial.welcome(), 800);
    else if (Game.get().lang && !Game.get().flags.karmaIntro) setTimeout(() => Sections.openKarmaIntro(), 1100);
  }

  /* --- верхняя панель --- */
  function refreshTop() {
    const s = Game.get();
    refs.playerName.textContent = (s.name === 'Герой') ? T('Герой') : s.name;
    refs.playerLevel.textContent = T('ур. ') + s.level;
    const max = Game.xpMax();
    refs.xpFill.style.width = Math.min(100, (s.xp / max) * 100) + '%';
    refs.xpText.textContent = `${s.xp} / ${max}`;
    if (refs.coinCount.textContent !== String(s.coins)) {
      refs.coinCount.textContent = s.coins;
      pulse(refs.coinBadge);
    }
    updateAvatar();
    renderWidgets();
    refreshKarma();
  }

  function refreshKarma() {
    if (!refs.karmaFill) return;
    const s = Game.get();
    const need = Game.karmaNext();
    refs.karmaFill.style.width = Math.min(100, (s.karma.progress / need) * 100) + '%';
    refs.karmaText.textContent = `${s.karma.progress} / ${need}`;
    refs.karmaLvl.textContent = T('ур.') + s.karma.level;
  }

  /* --- виджеты главного экрана --- */
  function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
  function buildWidget(id) {
    const s = Game.get();
    let glyph = '•', value = '', label = '', action = null;
    if (id === 'today') {
      const left = s.tasks.filter(t => !t.done).length;
      glyph = '📋'; value = String(left); label = left === 1 ? 'задача' : 'задач'; action = () => Sections.openTasks();
    } else if (id === 'habits') {
      const total = s.habits.length;
      const done = s.habits.filter(hb => Game.habitDoneToday(hb)).length;
      glyph = '🌱'; value = `${done}/${total}`; label = 'привычки'; action = () => Sections.openHabits();
    } else if (id === 'calendar') {
      const key = Game.todayKey();
      const n = s.tasks.filter(t => t.date === key).length;
      glyph = '📅'; value = String(n); label = 'на сегодня'; action = () => Sections.openCalendar();
    } else if (id === 'finance') {
      glyph = '💰'; value = fmt(Game.balance()); label = 'баланс'; action = () => Sections.openFinance('expense');
    } else if (id === 'goal') {
      const g = s.goals.find(x => !x.done) || s.goals[s.goals.length - 1];
      glyph = '🐷';
      if (g) { value = Math.min(100, Math.round((g.saved / g.target) * 100)) + '%'; label = g.name; }
      else { value = '—'; label = 'копилка'; }
      action = () => Sections.openGoals();
    } else if (id === 'karma') {
      glyph = '✨'; value = `${s.karma.progress}/${Game.karmaNext()}`; label = T('карма ур.') + s.karma.level;
      action = () => Sections.openKarmaJournal();
    } else if (id === 'streak') {
      glyph = '🔥'; value = String(s.streak ? s.streak.count : 0); label = 'дней';
      action = () => Sections.openQuests();
    } else if (id === 'quests') {
      const ql = Game.questList();
      glyph = '⚔️'; value = ql.filter(q => q.claimed).length + '/' + ql.length; label = 'квесты';
      action = () => Sections.openQuests();
    } else return null;

    const WICON = { today: 'tasks', habits: 'habits', calendar: 'calendar', finance: 'finance', goal: 'goal', karma: 'karma', streak: 'streak', quests: 'quests' };
    const gspan = h('span', { class: 'w-glyph' });
    if (Sections.svgIcon) gspan.append(Sections.svgIcon(WICON[id] || 'folder')); else gspan.textContent = glyph;
    const card = h('button', { class: 'widget' },
      gspan,
      h('span', { class: 'w-main' },
        h('span', { class: 'w-value', text: value }),
        h('span', { class: 'w-label', text: label }),
      ),
    );
    card.addEventListener('click', () => { TG.haptic('light'); if (action) action(); });
    return card;
  }
  function renderWidgets() {
    const layer = refs.widgetLayer;
    if (!layer) return;
    layer.innerHTML = '';
    const ids = Game.get().widgets || [];
    const left = h('div', { class: 'widget-col widget-col--left' });
    const right = h('div', { class: 'widget-col widget-col--right' });
    ids.forEach((id, i) => {
      const w = buildWidget(id);
      if (w) (i % 2 === 0 ? left : right).append(w);
    });
    layer.append(left, right);
  }

  function pulse(el) {
    if (!el || typeof el.animate !== 'function') return;
    el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }],
      { duration: 300, easing: 'ease-out' });
  }

  /* --- фокус-сессия (Помодоро) --- */
  let focus = { active: false, endsAt: 0, durationMin: 0, timer: null };
  function startFocus(min) {
    if (focus.active) return;
    focus.active = true; focus.durationMin = min; focus.endsAt = Date.now() + min * 60000;
    Scene.setFocus(true);
    refs.focusBar.classList.remove('hidden');
    refs.focusLabel.textContent = T('Фокус');
    tickFocus();
    focus.timer = setInterval(tickFocus, 1000);
    showSpeech(T('Время фокуса! Я поработаю рядом. 💪'), 3200);
    TG.haptic('medium');
  }
  function tickFocus() {
    const rem = Math.max(0, focus.endsAt - Date.now());
    const secs = Math.ceil(rem / 1000);
    const mm = Math.floor(secs / 60), ss = secs % 60;
    refs.focusTime.textContent = `${mm}:${String(ss).padStart(2, '0')}`;
    if (rem <= 0) endFocus(true);
  }
  function endFocus(completed) {
    if (!focus.active) return;
    clearInterval(focus.timer); focus.timer = null;
    const elapsedMin = completed ? focus.durationMin
      : Math.floor((focus.durationMin * 60000 - Math.max(0, focus.endsAt - Date.now())) / 60000);
    focus.active = false;
    Scene.setFocus(false);
    refs.focusBar.classList.add('hidden');
    const r = Game.finishFocus(completed ? focus.durationMin : elapsedMin);
    if (r && r.minutes > 0) {
      FX.toast('⏱️ ' + T('Фокус') + ' ' + r.minutes + ' ' + T('мин') + ' · +' + r.xp + ' XP · +' + r.coins + ' ◉');
      FX.particles(innerWidth / 2, innerHeight * 0.4, ['⭐', '◉', '✨'], 12);
      TG.haptic('success');
      if (r.res && r.res.leveledTo) setTimeout(() => FX.levelUp(r.res.leveledTo), 500);
    }
    refreshTop();
  }
  function focusActive() { return focus.active; }

  function updateAvatar() { Scene.renderAvatar(refs.avatarCanvas, Game.get().look); }

  function applyFrame() {
    const map = {
      gold:  ['#d9982f', '#f6c453'],
      wood:  ['#3b2a1c', '#8a6240'],
      leaf:  ['#4d8a46', '#8fc27a'],
      royal: ['#5b3a8f', '#a87ad0'],
    };
    const [b, inner] = map[Game.get().look.frame] || map.gold;
    refs.avatarFrame.style.borderColor = b;
    refs.avatarFrame.style.boxShadow = `inset 0 0 0 2px ${inner}`;
  }

  /* --- реплики персонажа --- */
  // мысли дня — собственные короткие фразы (RU/EN), выбираются по дате
  const QUOTES = [
    { ru: 'Маленький шаг сегодня — большая перемена завтра.', en: 'A small step today is a big change tomorrow.' },
    { ru: 'Ты не обязан быть идеальным, чтобы двигаться вперёд.', en: 'You don’t have to be perfect to move forward.' },
    { ru: 'Сделай одно доброе дело — и день уже не зря.', en: 'Do one kind thing and the day already counts.' },
    { ru: 'Прогресс важнее совершенства.', en: 'Progress matters more than perfection.' },
    { ru: 'Отдых — это тоже часть пути.', en: 'Rest is part of the journey too.' },
    { ru: 'Начни с малого. Просто начни.', en: 'Start small. Just start.' },
    { ru: 'Сегодня — хороший день, чтобы позаботиться о себе.', en: 'Today is a good day to take care of yourself.' },
    { ru: 'Каждая привычка — это письмо будущему тебе.', en: 'Every habit is a letter to your future self.' },
    { ru: 'Ты справляешься лучше, чем думаешь.', en: 'You’re doing better than you think.' },
    { ru: 'Доброта к себе — это не слабость, а сила.', en: 'Being kind to yourself is strength, not weakness.' },
    { ru: 'Один сфокусированный час стоит целого дня суеты.', en: 'One focused hour beats a whole day of rush.' },
    { ru: 'Замечай хорошее — его больше, чем кажется.', en: 'Notice the good — there’s more of it than it seems.' },
  ];
  function quoteOfDay() {
    const now = new Date();
    const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const q = QUOTES[doy % QUOTES.length];
    return '💭 ' + (I18N.get() === 'en' ? q.en : q.ru);
  }

  const PHRASES = [
    'Хороший день, чтобы что-то сделать!', 'Одна задача — и уже победа 🏆',
    'Я верю в тебя!', 'Кофе выпит. Погнали! ☕', 'Не забудь про привычки 🌱',
    'Ты сегодня молодец.', 'Маленький шаг — большой прогресс.',
  ];
  let speechTimer = null;
  function showSpeech(text, ms) {
    clearTimeout(speechTimer);
    refs.speech.textContent = text;
    refs.speech.classList.remove('hidden');
    speechTimer = setTimeout(() => refs.speech.classList.add('hidden'), ms || 2600);
  }

  /* --- проводка кнопок хаба --- */
  function wireHub() {
    document.getElementById('navHome').addEventListener('click', () => {
      TG.haptic('light'); UI.close();
      setNavActive('home');
      showSpeech(T(PHRASES[Math.floor(Math.random() * PHRASES.length)]), 2400);
    });
    document.getElementById('navMenu').addEventListener('click', () => { TG.haptic('medium'); setNavActive('menu'); Sections.openMenu(); });
    document.getElementById('navExtra').addEventListener('click', () => { TG.haptic('light'); setNavActive('extra'); Sections.openAssistant(); });
    document.getElementById('customizeBtn').addEventListener('click', () => { TG.haptic('medium'); Sections.openCustomize(); });
    document.getElementById('playerCard').addEventListener('click', () => { TG.haptic('light'); Sections.openMenu(); });

    if (refs.karmaAddBtn) refs.karmaAddBtn.addEventListener('click', () => { TG.haptic('medium'); Sections.openKarmaAdd(); });
    if (refs.karmaJournalBtn) refs.karmaJournalBtn.addEventListener('click', () => { TG.haptic('light'); Sections.openKarmaJournal(); });
    if (refs.focusStop) refs.focusStop.addEventListener('click', () => endFocus(false));

    // тап по персонажу → реплика + монетка-пасхалка изредка
    const scene = document.getElementById('sceneCanvas');
    scene.addEventListener('click', e => {
      showSpeech(T(PHRASES[Math.floor(Math.random() * PHRASES.length)]), 2200);
      TG.haptic('soft'); FX.beep(600, 0.05);
    });
  }

  function setNavActive(id) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('nav-btn--active', b.dataset.nav === id));
  }

  return { init, refreshTop, updateAvatar, applyFrame, renderWidgets, refreshKarma, applyLang, applyStaticLang, startFocus, focusActive, setAmbient, applyTheme };
})();

// старт
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.init);
else App.init();

  </script>
</body>
</html>
